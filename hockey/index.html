<body>

<h1>NHL‑Style Hockey</h1>

<canvas id="rink" width="700" height="400"></canvas>

<div id="ui">
  <input id="username" placeholder="Username" />
  <span style="margin-left:20px;">Score: <span id="score">0</span></span>
  <button id="startBtn">Start Game</button>
</div>

<script>
const canvas = document.getElementById("rink");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const usernameEl = document.getElementById("username");
const startBtn = document.getElementById("startBtn");

let running = false;
let score = 0;

// Paddle (player stick)
const paddle = {
  x: canvas.width / 2 - 40,
  y: canvas.height - 40,
  w: 80,
  h: 12
};

// Puck
const puck = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  r: 10,
  vx: 5,
  vy: -5
};

// Mouse control
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  paddle.x = mx - paddle.w / 2;
});

// Start button
startBtn.addEventListener("click", () => {
  if (!usernameEl.value.trim()) {
    alert("Enter a username first");
    return;
  }
  resetGame();
  running = true;
  loop();
});

// Reset game
function resetGame() {
  score = 0;
  scoreEl.textContent = score;
  puck.x = canvas.width / 2;
  puck.y = canvas.height / 2;
  puck.vx = (Math.random() > 0.5 ? 1 : -1) * 5;
  puck.vy = -5;
}

// Draw NHL‑style rink
function drawRink() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Center line
  ctx.strokeStyle = "red";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();

  // Blue lines
  ctx.strokeStyle = "#1e90ff";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.25, 0);
  ctx.lineTo(canvas.width * 0.25, canvas.height);
  ctx.moveTo(canvas.width * 0.75, 0);
  ctx.lineTo(canvas.width * 0.75, canvas.height);
  ctx.stroke();

  // Center circle
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
  ctx.stroke();

  // Goal creases
  drawCrease(0);
  drawCrease(canvas.width);
}

function drawCrease(x) {
  ctx.fillStyle = "rgba(30,144,255,0.4)";
  ctx.beginPath();
  ctx.arc(x, canvas.height / 2, 60, -Math.PI / 2, Math.PI / 2);
  ctx.fill();
}

// Update puck physics
function update() {
  puck.x += puck.vx;
  puck.y += puck.vy;

  // Wall bounce
  if (puck.x - puck.r < 0 || puck.x + puck.r > canvas.width) {
    puck.vx *= -1;
  }

  // Top wall = score
  if (puck.y - puck.r < 0) {
    score++;
    scoreEl.textContent = score;
    puck.vy *= -1;
  }

  // Bottom = game over
  if (puck.y + puck.r > canvas.height) {
    running = false;
    sendScore();
  }

  // Paddle collision
  if (
    puck.y + puck.r >= paddle.y &&
    puck.x >= paddle.x &&
    puck.x <= paddle.x + paddle.w &&
    puck.vy > 0
  ) {
    puck.vy *= -1;
  }
}

// Draw everything
function draw() {
  drawRink();

  // Paddle
  ctx.fillStyle = "#f5f5f5";
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

  // Puck
  ctx.fillStyle = "#ffcc00";
  ctx.beginPath();
  ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
  ctx.fill();
}

// Game loop
function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

// Send score to Vercel backend
async function sendScore() {
  const username = usernameEl.value.trim();
  if (!username) return;

  try {
    const res = await fetch("/api/submit-score", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, score })
    });

    const data = await res.json();
    console.log("Saved:", data);
    alert("Game Over — Score: " + score);
  } catch (err) {
    console.error(err);
    alert("Could not save score");
  }
}
</script>
