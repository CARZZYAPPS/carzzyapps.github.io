<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Carzzy Apps</title>
  <style>
    body{background:#0a0a0a;color:#00d1b2;font-family:sans-serif;margin:0}
    .card{background:#121212;border:1px solid #00d1b2;padding:30px;border-radius:12px;width:100%;max-width:450px;box-sizing:border-box;margin:100px auto 0 auto;}
    h2 {font-size: 32px; text-align: center;}
    label{display:block;margin-top:20px;font-size:15px}
    input,button{width:100%;padding:10px;margin-top:5px;border-radius:6px;box-sizing:border-box}
    input{background:#1a1a1a;border:1px solid #333;color:#fff}
    button{background:#00d1b2;border:none;color:#0a0a0a;font-weight:bold;cursor:pointer;margin-top:25px; font-size: 20px;}
    .msg{text-align:center;margin-top:15px}
  </style>
</head>
<body>
  <script src="/nav-bar.js"></script>
  <div class="card">
    <h2>Sign Up</h2>
    <form id="signup-form">
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="carzzy_boss">

      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" required placeholder="••••••••">

      <button type="submit">Sign Up</button>
    </form>
    <div id="msg" class="msg"></div>
    <div style="text-align:center; margin-top:15px;">Already have an account? <a href="/auth/sign-in" style="color:#00d1b2">Sign In</a></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({ apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", authDomain: "carzzy-apps.firebaseapp.com", projectId: "carzzy-apps" });
    const auth = getAuth(app); const db = getFirestore(app);

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        msg.style.color = "#f00"; msg.textContent = "Passwords do not match!"; return;
      }

      let cred = null;
      try {
        const usernameRef = doc(db, "usernames", username.toLowerCase());
        const snap = await getDoc(usernameRef);
        if (snap.exists()) { msg.style.color = "#f00"; msg.textContent = "Username is already taken!"; return; }

        // 1. Create the Auth User
        cred = await createUserWithEmailAndPassword(auth, document.getElementById("email").value, password);
        
        // 2. Set the display name in Auth
        await updateProfile(cred.user, { displayName: username });
        
        // 3. Save the username record in Firestore
        await setDoc(usernameRef, { uid: cred.user.uid });
        
        msg.style.color = "#00d1b2"; msg.textContent = "Account registered successfully!";
      } catch (err) {
        // Rollback: If account was created but username write failed, delete the account
        if (cred && cred.user) {
          try {
            await cred.user.delete();
          } catch (delErr) {
            console.error("Cleanup rollback failed:", delErr);
          }
        }

        msg.style.color = "#f00";
        let friendlyMessage = "An unexpected error occurred. Please try again.";
        switch (err.code) {
          case "auth/email-already-in-use": friendlyMessage = "This email address is already registered."; break;
          case "auth/invalid-email": friendlyMessage = "Please enter a valid email address."; break;
          case "auth/weak-password": friendlyMessage = "Your password is too weak."; break;
          case "auth/network-request-failed": friendlyMessage = "Network error. Check connection."; break;
          case "permission-denied": friendlyMessage = "Username registration failed."; break;
          case "auth/password-does-not-meet-requirements": friendlyMessage = "Password must contain an uppercase and lowercase letter, a number, a special character, and be at least 6 characters long."; break;
          default: friendlyMessage = err.message;
        }
        msg.textContent = friendlyMessage;
      }
    });
  </script>
</body>
</html>
