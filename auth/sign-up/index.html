<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Carzzy Apps</title>
    <style>
      body{background:#0a0a0a;color:#00d1b2;font-family:sans-serif;margin:0}
      .card{background:#1a1a1a;border:1px solid #00d1b2;padding:30px;border-radius:12px;width:100%;max-width:450px;box-sizing:border-box;margin:100px auto 0 auto;}
      h2 {font-size:32px;text-align:center;}
      label{display:block;margin-top:20px;font-size:15px}
      input,button{width:100%;padding:10px;margin-top:5px;border-radius:6px;box-sizing:border-box}
      input{background:#2a2a2a;border:1px solid #333;color:#fff}
      button{background:#00d1b2;border:none;color:#0a0a0a;font-weight:bold;cursor:pointer;margin-top:25px;font-size:20px;}
      .msg{text-align:center;margin-top:15px}
      .stay-signed-in-container{display:flex;align-items:center;gap:8px;margin-top:12px;color:#ccc;font-size:14px}
      .stay-signed-in-container input{width:auto;margin:0;accent-color:#00d1b2}
      .stay-signed-in-container label{margin:0;cursor:pointer}
    </style>
</head>
<body>
  <script src="/nav-bar.js"></script>
  <div class="card">
    <h2>Sign Up</h2>
    <form id="signup-form">
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="carzzy_boss">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" required placeholder="••••••••">
      <div style="display:flex;align-items:center;gap:8px;margin-top:15px;font-size:14px;">
        <input type="checkbox" id="show-password" style="width:auto;margin:0;cursor:pointer;accent-color:#00d1b2;">
        <label for="show-password" style="margin:0;cursor:pointer;color:#ccc;">Show Password</label>
      </div>
      <div class="stay-signed-in-container">
        <input type="checkbox" id="stay-signed-in">
        <label for="stay-signed-in">Stay signed in on this device</label>
      </div>
      <button type="submit">Sign Up</button>
    </form>
    <div id="msg" class="msg"></div>
    <div style="text-align:center;margin-top:15px;color:#ccc;">Already have an account? <a href="/auth/sign-in" style="color:#00d1b2">Sign In</a></div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      browserLocalPersistence,
      browserSessionPersistence,
      createUserWithEmailAndPassword,
      getAuth,
      setPersistence,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, collection, query, where, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({ apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", authDomain: "carzzy-apps.firebaseapp.com", projectId: "carzzy-apps" });
    const auth = getAuth(app);

    async function claimUsernameSafely(user, username) {
      const db = getFirestore(app);
      const lowercaseUsername = username.toLowerCase();
      const usernamesRef = collection(db, "usernames");
      
      const q = query(usernamesRef, where("usernameLower", "==", lowercaseUsername));
      const querySnapshot = await getDocs(q);
      let isTaken = false;
      querySnapshot.forEach((docSnap) => {
        if (docSnap.data().uid !== user.uid) { isTaken = true; }
      });
      if (isTaken) {
        const e = new Error("taken"); e.code = "already-exists"; throw e;
      }
      
      const ref = doc(db, "usernames", user.uid);
      await runTransaction(db, async (tx) => {
        tx.set(ref, { 
          uid: user.uid, 
          guest: false, 
          username: username, 
          usernameLower: lowercaseUsername 
        });
      });
    }

    const showPasswordCheckbox = document.getElementById("show-password");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm-password");

    showPasswordCheckbox.addEventListener("change", () => {
      const type = showPasswordCheckbox.checked ? "text" : "password";
      passwordInput.type = type; confirmPasswordInput.type = type;
    });

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        msg.style.color = "#f00"; msg.textContent = "Passwords do not match!"; return;
      }

      let cred = null;
      try {
        if (!username || username.length > 15) {
          msg.style.color = "#f00"; msg.textContent = "Username must be up to 15 characters."; return;
        }
        const staySignedIn = document.getElementById("stay-signed-in").checked;
        await setPersistence(auth, staySignedIn ? browserLocalPersistence : browserSessionPersistence);
        cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: username });
        await claimUsernameSafely(cred.user, username);
        if (staySignedIn) { localStorage.setItem("signIn", "true"); } else { localStorage.removeItem("signIn"); }
        msg.style.color = "#00d1b2"; msg.textContent = "Account registered successfully!";
        setTimeout(() => {document.location.href = "/auth/verify-email";}, 500);
      } catch (err) {
        if (cred && cred.user) {
          try { await cred.user.delete(); } catch (delErr) { console.error("Cleanup failed:", delErr); }
        }
        msg.style.color = "#f00";
        let friendlyMessage = "An unexpected error occurred. Please try again.";
        switch (err.code) {
          case "auth/email-already-in-use": friendlyMessage = "This email address is already registered."; break;
          case "already-exists": friendlyMessage = "That username is already taken."; break;
          case "auth/invalid-email": friendlyMessage = "Please enter a valid email address."; break;
          case "auth/weak-password": case 'auth/password-does-not-meet-requirements': friendlyMessage = "Password is too weak. Must be at least six characters long and include a lowercase, uppercase, numeric, and special characters."; break;
          case "auth/network-request-failed":
          case "unavailable":
          case "deadline-exceeded": friendlyMessage = "Network error. Check connection and try again."; break;

          case "permission-denied": friendlyMessage = "Username registration failed."; break;
          default: friendlyMessage = err.message;
        }
        msg.textContent = friendlyMessage;
      }
    });
  </script>
</body>
</html>
