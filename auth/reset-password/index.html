</head>
<body>
{% include navbar.html %}
  <script src="/nav-bar.js"></script>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8"/><path d="m16 7 3 3"/><path d="m19 4 2 2"/></svg>
        </div>
        <h1>Reset your password</h1>
        <p>Enter your account's email and we'll send you a link to choose a new password.</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="auth-field">
          <label for="email">Email address</label>
          <div class="auth-input-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
          </div>
        </div>

        <button type="submit" class="auth-submit" id="submit-btn" style="margin-top:6px">
          <span class="auth-spinner" aria-hidden="true"></span>
          <span class="auth-submit-text">Send Reset Link</span>
        </button>
      </form>

      <div id="msg" class="auth-msg" role="alert" aria-live="polite"></div>

      <div class="auth-foot">
        Remembered your password? <a href="/auth/sign-in">Sign in</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4",
      authDomain: "www.carzzyapps.com",
      projectId: "carzzy-apps"
    });
    const auth = getAuth(app);

    const msg = document.getElementById("msg");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submit-btn");
    const submitText = submitBtn.querySelector(".auth-submit-text");

    function showMsg(text, kind, sub) {
      msg.className = "auth-msg is-" + kind;
      msg.textContent = text;
      if (sub) {
        const s = document.createElement("span");
        s.className = "auth-msg-sub";
        s.textContent = sub;
        msg.appendChild(s);
      }
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      submitBtn.classList.toggle("is-loading", on);
      submitText.textContent = on ? "Sending…" : "Send Reset Link";
    }

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { showMsg("Please enter your email address.", "error"); return; }

      setLoading(true);
      try {
        await sendPasswordResetEmail(auth, email);
        showMsg("Check your email for the password reset link!", "success",
          "Didn't receive it? Check your spam folder, or send it again.");
        emailInput.value = "";
        emailInput.blur();
      } catch (err) {
        switch (err.code) {
          case "auth/invalid-email": showMsg("Please enter a valid email address.", "error"); break;
          case "auth/user-not-found": showMsg("No account found with this email.", "error"); break;
          case "auth/too-many-requests": showMsg("Too many requests. Please wait a moment and try again.", "error"); break;
          case "auth/network-request-failed": showMsg("Network error. Check your connection and try again.", "error"); break;
          default: showMsg(err.message, "error");
        }
      } finally {
        setLoading(false);
      }
    });
  </script>
{% include site-footer.html %}
</body>
</html>
