<!DOCTYPE html>
<html lang="en">
<head>
  <title>Account | Carzzy Apps</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #0a0a0a; color: #ccc; font-family: sans-serif; margin: 0; padding-top: 80px; box-sizing: border-box; }
    .container { display: flex; max-width: 900px; margin: 40px auto; gap: 20px; padding: 0 15px; }
    .sidebar { width: 220px; background: #2a2a2a; border-radius: 8px; padding: 15px; height: fit-content; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-btn { background: none; border: none; color: #aaa; cursor: pointer; padding: 12px 15px; width: 100%; text-align: left; font-weight: bold; border-radius: 4px; transition: all 0.2s; }
    .sidebar-btn:hover { background: #1a1a1a; color: #fff; }
    .sidebar-btn.active { color: #00d1b2; background: #1a1a1a; }
    .main-content { flex: 1; background: #2a2a2a; padding: 30px; border-radius: 8px; min-height: 350px; }
    .panel { display: none; }
    .panel.active { display: block; }
    h2 { color: #00d1b2; margin-top: 0; font-size: 1.4rem; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #aaa; display: block; margin: 15px 0 5px; }
    input { background: #1a1a1a; border: 1px solid #444; color: #ccc; padding: 10px; width: 100%; box-sizing: border-box; border-radius: 4px; }
    input:focus { border-color: #00d1b2; outline: none; }
    button.action-btn { background: #00d1b2; color: #0a0a0a; border: none; padding: 12px; font-weight: bold; border-radius: 4px; width: 100%; margin-top: 20px; cursor: pointer; }
    .status { color: #00d1b2; margin-top: 15px; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- Left Sidebar Options -->
  <div class="sidebar">
    <button class="sidebar-btn active" onclick="showTab('tab-user')">Username</button>
    <button class="sidebar-btn" onclick="showTab('tab-pwd')">Password</button>
    <button class="sidebar-btn" onclick="showTab('tab-email')">Email</button>
    <button class="sidebar-btn" onclick="showTab('tab-del')">Delete Account</button>
  </div>

  <!-- Right Main Area -->
  <div class="main-content">
    <div id="profile" style="display:none;">
      <!-- Username Panel -->
      <div id="tab-user" class="panel active">
        <h2>Change Username</h2>
        <label>New Username</label>
        <input id="username-in" type="text" />
        <button class="action-btn" onclick="updateUsername()">Update Username</button>
      </div>

      <!-- Password Panel -->
      <div id="tab-pwd" class="panel">
        <h2>Change Password</h2>
        <label>Current Password</label>
        <input id="pwd-curr" type="password" />
        <label>New Password</label>
        <input id="pwd-new" type="password" />
        <button class="action-btn" onclick="changePassword()">Change Password</button>
      </div>

      <!-- Email Panel -->
      <div id="tab-email" class="panel">
        <h2>Change Email Address</h2>
        <label>Current Password</label>
        <input id="email-curr-pwd" type="password" />
        <label>New Email</label>
        <input id="email-new" type="email" />
        <button class="action-btn" onclick="changeEmail()">Change Email</button>
      </div>

      <!-- Delete Panel -->
      <div id="tab-del" class="panel">
        <h2 style="color: #ff3860;">Delete Account</h2>
        <p style="color:#ff3860; font-size: 0.9rem;">Warning: This action is permanent and cannot be undone.</p>
        <label>Confirm Password</label>
        <input id="del-pwd" type="password" />
        <button class="action-btn" style="background:#ff3860; color:#fff;" onclick="deleteAcc()">Delete Account</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>
</div>

<script src="/nav-bar.js"></script>
<script type="module">
  sessionStorage.setItem("prevPage", document.location.href);
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, updatePassword, updateEmail, deleteUser, reauthenticateWithCredential, EmailAuthProvider, updateProfile } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const app = initializeApp({ apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", authDomain: "carzzy-apps.firebaseapp.com", projectId: "carzzy-apps" });
  const auth = getAuth(app);
  const db = getFirestore(app);
  let curUser = null;

  window.showTab = (id) => {
    document.querySelectorAll('.panel, .sidebar-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
    document.getElementById('status').innerText = "";
  };

  onAuthStateChanged(auth, u => {
    if (!u || u.isAnonymous) {
      window.location.href = "/auth/sign-in";
      return;
    }
    if (!u.emailVerified) {
      window.location.href = "/auth/verify-email";
      return;
    }
    curUser = u;
    document.getElementById('profile').style.display = 'block';
  });

  const reauth = async (pwd) => {
    const cred = EmailAuthProvider.credential(curUser.email, pwd);
    await reauthenticateWithCredential(curUser, cred);
  };

  const setStatus = (msg, err = false) => {
    const el = document.getElementById('status');
    el.style.color = err ? '#ff3860' : '#00d1b2';
    el.innerText = msg;
  };

  window.updateUsername = async () => {
    const val = document.getElementById('username-in').value.trim();
    try {
      setStatus("Updating...");
      await updateProfile(curUser, { displayName: val });
      await setDoc(doc(db, "usernames", curUser.uid), {
        uid: curUser.uid,
        guest: false,
        username: val,
        usernameLower: val.toLowerCase()
      });
      setStatus("Username updated!");
    } catch (e) { setStatus(e.message, true); }
  };

  window.changePassword = async () => {
    const curr = document.getElementById('pwd-curr').value;
    const newPwd = document.getElementById('pwd-new').value;
    try {
      setStatus("Verifying password...");
      await reauth(curr);
      await updatePassword(curUser, newPwd);
      setStatus("Password changed!");
    } catch (e) { setStatus(e.message, true); }
  };

  window.changeEmail = async () => {
    const curr = document.getElementById('email-curr-pwd').value;
    const mail = document.getElementById('email-new').value;
    try {
      setStatus("Verifying password...");
      await reauth(curr);
      await updateEmail(curUser, mail);
      setStatus("Email updated!");
    } catch (e) { setStatus(e.message, true); }
  };

  window.deleteAcc = async () => {
    const pwd = document.getElementById('del-pwd').value;
    try {
      setStatus("Deleting...");
      await reauth(pwd);
      await deleteUser(curUser);
      location.reload();
    } catch (e) { setStatus(e.message, true); }
  };
</script>
</body>
</html>
