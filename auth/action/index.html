---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Security | Carzzy Apps</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/auth/auth.css">
<script src="/shabbos-gate.js"></script>
</head>
<body>
{% include navbar.html %}
  <script src="/nav-bar.js"></script>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-badge" id="badge" aria-hidden="true">
          <span class="auth-spinner" id="icon-loading"></span>
          <svg id="icon-key" hidden viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8"/><path d="m16 7 3 3"/><path d="m19 4 2 2"/></svg>
          <svg id="icon-check" hidden viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <svg id="icon-error" hidden viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5"/><path d="M12 16h.01"/></svg>
        </div>
        <h1 id="title">Account security</h1>
        <p id="status">Verifying secure request…</p>
      </div>

      <form id="reset-form" hidden novalidate>
        <div class="auth-field">
          <label for="new-password">New password</label>
          <div class="auth-input-wrap has-toggle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="new-password" placeholder="Create a new password" autocomplete="new-password" required aria-describedby="password-hint">
            <button type="button" class="auth-eye" id="show-pwd" aria-label="Show passwords" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <ul id="password-hint"></ul>
        </div>

        <div class="auth-field">
          <label for="confirm-password">Confirm new password</label>
          <div class="auth-input-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
            <input type="password" id="confirm-password" placeholder="Re-enter your new password" autocomplete="new-password" required aria-describedby="confirm-hint">
          </div>
          <div class="auth-hint" id="confirm-hint" aria-live="polite"></div>
        </div>

        <button type="submit" class="auth-submit" id="submit-reset" style="margin-top:6px">
          <span class="auth-spinner" aria-hidden="true"></span>
          <span class="auth-submit-text">Update Password</span>
        </button>
      </form>

      <div id="msg" class="auth-msg" role="alert" aria-live="polite"></div>

      <a class="auth-secondary" id="retry-link" href="/auth/reset-password" hidden>Request a new link</a>

      <div class="auth-foot">
        <a href="/">Back to Carzzy Apps</a>
      </div>
    </div>
  </main>

 <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, verifyPasswordResetCode, confirmPasswordReset, checkActionCode, applyActionCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { attachPasswordChecklist, PASSWORD_RULES_MESSAGE } from "/auth/password-rules.js?v=1";

  const firebaseConfig = { apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", authDomain: "www.carzzyapps.com" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode');
  const actionCode = params.get('oobCode');
  const continueUrl = params.get('continueUrl');

  const titleEl = document.getElementById('title');
  const statusEl = document.getElementById('status');
  const badge = document.getElementById('badge');
  const msg = document.getElementById('msg');
  const retryLink = document.getElementById('retry-link');
  const resetForm = document.getElementById('reset-form');
  const showPwd = document.getElementById('show-pwd');
  const newPwdInput = document.getElementById('new-password');
  const confirmPwdInput = document.getElementById('confirm-password');
  const confirmHint = document.getElementById('confirm-hint');
  const checkPasswordRules = attachPasswordChecklist(newPwdInput, document.getElementById('password-hint'));
  const submitBtn = document.getElementById('submit-reset');
  const submitText = submitBtn.querySelector('.auth-submit-text');

  const titles = { resetPassword: "Reset your password", recoverEmail: "Recover your email", verifyEmail: "Verify your email", verifyAndChangeEmail: "Confirm email change" };
  const tabTitles = { resetPassword: "Reset Password", recoverEmail: "Recover Email", verifyEmail: "Verify Email", verifyAndChangeEmail: "Verify Email Change" };

  if (titles[mode]) {
    document.title = `${tabTitles[mode]} | Carzzy Apps`;
    titleEl.textContent = titles[mode];
  }

  // Badge icon: "loading", "key", "check" or "error".
  function setBadge(kind) {
    badge.className = "auth-badge" + (kind === "check" ? " is-success" : kind === "error" ? " is-error" : "");
    for (const k of ["loading", "key", "check", "error"]) {
      document.getElementById("icon-" + k).toggleAttribute("hidden", k !== kind);
    }
  }

  function setStatus(text, email, after) {
    statusEl.textContent = text;
    if (email) {
      const strong = document.createElement("strong");
      strong.textContent = email;
      statusEl.append(strong, after || "");
    }
  }

  function showMsg(text, kind) {
    msg.className = "auth-msg is-" + kind;
    msg.textContent = text;
  }

  function succeed(title, text) {
    setBadge("check");
    titleEl.textContent = title;
    setStatus(text);
    msg.className = "auth-msg";
    resetForm.hidden = true;
    handleRedirect();
  }

  // A link that failed can't be retried, so point people at where to get a new one.
  function fail(err) {
    setBadge("error");
    titleEl.textContent = "This link didn't work";
    setStatus(getFriendlyError(err));
    resetForm.hidden = true;
    if (mode === "resetPassword") {
      retryLink.href = "/auth/reset-password";
      retryLink.textContent = "Request a new reset link";
      retryLink.hidden = false;
    } else if (mode === "verifyEmail" || mode === "verifyAndChangeEmail") {
      retryLink.href = "/auth/verify-email";
      retryLink.textContent = "Send a new verification email";
      retryLink.hidden = false;
    }
  }

  showPwd.onclick = () => {
    const show = newPwdInput.type === "password";
    newPwdInput.type = confirmPwdInput.type = show ? "text" : "password";
    showPwd.setAttribute("aria-pressed", String(show));
    showPwd.setAttribute("aria-label", show ? "Hide passwords" : "Show passwords");
  };

  function updateConfirmHint() {
    if (!confirmPwdInput.value) {
      confirmHint.textContent = ""; confirmHint.className = "auth-hint";
    } else if (confirmPwdInput.value === newPwdInput.value) {
      confirmHint.textContent = "Passwords match"; confirmHint.className = "auth-hint is-good";
    } else {
      confirmHint.textContent = "Passwords don't match yet"; confirmHint.className = "auth-hint is-bad";
    }
  }
  newPwdInput.addEventListener("input", updateConfirmHint);
  confirmPwdInput.addEventListener("input", updateConfirmHint);

  const handleRedirect = () => {
    setTimeout(() => { window.location.href = continueUrl || "https://www.carzzyapps.com/"; }, 2000);
  };

  const getFriendlyError = (err) => {
    switch (err?.code) {
      case 'auth/expired-action-code': return "This link has expired. Please request a new link.";
      case 'auth/invalid-action-code': return "This link is invalid or has already been used.";
      case 'auth/weak-password': case 'auth/password-does-not-meet-requirements': return "Password is too weak. Must be at least six characters long and include a lowercase, uppercase, numeric, and special characters.";
      case 'auth/user-disabled': return "This account has been disabled.";
      case 'auth/network-request-failed': return "Network error. Check your connection and try again.";
      default: return "An error occurred. Please try again.";
    }
  };

  if (!actionCode) {
    fail({ code: "auth/invalid-action-code" });
  } else {
    switch (mode) {
      case 'resetPassword':
        verifyPasswordResetCode(auth, actionCode).then(email => {
          setBadge("key");
          setStatus("Choose a new password for ", email, ".");
          resetForm.hidden = false;
          newPwdInput.focus();

          resetForm.onsubmit = (e) => {
            e.preventDefault();
            const newPassword = newPwdInput.value;
            const confirmPassword = confirmPwdInput.value;

            if (!checkPasswordRules(true)) { newPwdInput.focus(); showMsg(PASSWORD_RULES_MESSAGE, "error"); return; }
            if (newPassword !== confirmPassword) { showMsg("Passwords do not match.", "error"); return; }

            submitBtn.disabled = true;
            submitBtn.classList.add("is-loading");
            submitText.textContent = "Updating…";

            confirmPasswordReset(auth, actionCode, newPassword).then(() => {
              succeed("Password updated", "Your password has been changed. Redirecting…");
            }).catch(err => {
              submitBtn.disabled = false;
              submitBtn.classList.remove("is-loading");
              submitText.textContent = "Update Password";
              // A weak password can be fixed on this page; anything else means the link is dead.
              if (err?.code === 'auth/weak-password' || err?.code === 'auth/password-does-not-meet-requirements' || err?.code === 'auth/network-request-failed') {
                showMsg(getFriendlyError(err), "error");
              } else {
                fail(err);
              }
            });
          };
        }).catch(fail);
        break;

      case 'recoverEmail':
        checkActionCode(auth, actionCode).then(info => {
          const revertedEmail = info.data.email;
          return applyActionCode(auth, actionCode).then(() => {
            succeed("Email recovered", "");
            setStatus("Your email address was changed back to ", revertedEmail, ". Redirecting…");
          });
        }).catch(fail);
        break;

      case 'verifyEmail':
      case 'verifyAndChangeEmail':
        applyActionCode(auth, actionCode).then(() => {
          succeed("Email verified", "Your email address is verified! Redirecting…");
        }).catch(fail);
        break;

      default:
        setBadge("error");
        titleEl.textContent = "Unknown request";
        setStatus("We couldn't recognise this link. Please try opening it from your email again.");
    }
  }
</script>
{% include site-footer.html %}
</body>
</html>
