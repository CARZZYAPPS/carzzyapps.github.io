<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Security | Carzzy Apps</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #ccc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1a1a1a;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid #00d1b2;
    }
    h2 {
      color: #00d1b2;
      margin-top: 0;
      font-size: 1.6rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    p {
      color: #ccc;
      font-size: 1rem;
      line-height: 1.5;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border-radius: 6px;
      border: 1px solid #3a3a3a;
      box-sizing: border-box;
      font-size: 1rem;
      background: #2a2a2a;
      color: #ccc;
      outline: none;
    }
    input:focus {
      border-color: #00d1b2 !important;
    }
    .show-pwd-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.6rem 0 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #ccc;
      width: 100%;
      box-sizing: border-box;
    }

    .show-pwd-label input[type="checkbox"] {
      accent-color: #00d1b2;
      cursor: pointer;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      background: #00d1b2;
      color: #0a0a0a;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #00b097;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <script src="/nav-bar.js"></script>
  <div class="card">
    <h2 id="title">CARZZY APPS</h2>
    <p id="status">Verifying secure request...</p>
    
    <div id="reset-form" class="hidden">
      <input type="password" id="new-password" placeholder="Enter new password" required />
      <input type="password" id="confirm-password" placeholder="Confirm new password" required />
      <label class="show-pwd-label">
        <input type="checkbox" id="show-pwd" /> Show Password
      </label>
      <button id="submit-reset">Update Password</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset, checkActionCode, applyActionCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", 
      authDomain: "carzzy-apps.firebaseapp.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const actionCode = params.get('oobCode');
    
    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const resetForm = document.getElementById('reset-form');
    const showPwd = document.getElementById('show-pwd');
    const newPwdInput = document.getElementById('new-password');
    const confirmPwdInput = document.getElementById('confirm-password');

    const titles = {
      resetPassword: "Reset Password",
      recoverEmail: "Recover Email",
      verifyEmail: "Verify Email"
    };

    if (titles[mode]) {
      document.title = `${titles[mode]} | Carzzy Apps`;
      titleEl.innerText = titles[mode];
    }

    // Password visibility toggle logic
    showPwd.onchange = () => {
      const type = showPwd.checked ? 'text' : 'password';
      newPwdInput.type = type;
      confirmPwdInput.type = type;
    };

    if (!actionCode) {
      statusEl.innerText = "Error: Invalid action request.";
    } else {
      switch (mode) {
        case 'resetPassword':
          verifyPasswordResetCode(auth, actionCode).then(email => {
            statusEl.innerText = `Choose a new password for ${email}`;
            resetForm.classList.remove('hidden');
            
            document.getElementById('submit-reset').onclick = () => {
              const newPassword = newPwdInput.value;
              const confirmPassword = confirmPwdInput.value;

              if (newPassword !== confirmPassword) {
                statusEl.innerText = "Error: Passwords do not match.";
                return;
              }
              if (newPassword.length < 6) {
                statusEl.innerText = "Password must be at least 6 characters.";
                return;
              }

              confirmPasswordReset(auth, actionCode, newPassword).then(() => {
                statusEl.innerText = "Success! Your password is updated.";
                resetForm.classList.add('hidden');
              }).catch(err => statusEl.innerText = err.message);
            };
          }).catch(() => statusEl.innerText = "Expired or invalid reset link.");
          break;

        case 'recoverEmail':
          checkActionCode(auth, actionCode).then(info => {
            const revertedEmail = info.data.email;
            return applyActionCode(auth, actionCode).then(() => {
              statusEl.innerText = `Email address reverted to ${revertedEmail}.`;
            });
          }).catch(() => statusEl.innerText = "Failed to restore previous email.");
          break;

        case 'verifyEmail':
          applyActionCode(auth, actionCode).then(() => {
            statusEl.innerText = "Your email address is verified!";
          }).catch(() => statusEl.innerText = "Invalid or expired verification link.");
          break;

        default:
          statusEl.innerText = "Unknown security request.";
      }
    }
  </script>
</body>
</html>
