<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | Carzzy Apps</title>
  <style>
    body{background:#0a0a0a;color:#00d1b2;font-family:sans-serif;margin:0}
    .card{background:#121212;border:1px solid #00d1b2;padding:30px;border-radius:12px;width:100%;max-width:450px;box-sizing:border-box;margin:150px auto 0 auto;}
    h2 {font-size: 32px; text-align: center;}
    label{display:block;margin-top:20px;font-size:15px}
    input,button{width:100%;padding:10px;margin-top:5px;border-radius:6px;box-sizing:border-box}
    input{background:#1a1a1a;border:1px solid #333;color:#fff}
    button{background:#00d1b2;border:none;color:#0a0a0a;font-weight:bold;cursor:pointer;margin-top:25px; font-size: 20px;}
    .msg{text-align:center;margin-top:15px}
  </style>
</head>
<body>
  <script src="/nav-bar.js"></script>
  <div class="card">
    <h2>Reset Password</h2>
    <form id="reset-form">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <button type="submit">Send Reset Link</button>
    </form>
    <div id="msg" class="msg"></div>
    <div style="text-align:center; margin-top:15px;">
      Remembered your password? <a href="/auth/sign-in" style="color:#00d1b2">Sign In</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp({ 
      apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", 
      authDomain: "carzzy-apps.firebaseapp.com", 
      projectId: "carzzy-apps" 
    });
    const auth = getAuth(app);

    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const email = document.getElementById("email").value.trim();

      try {
        await sendPasswordResetEmail(auth, email);
        msg.style.color = "#00d1b2";
        msg.textContent = "Check your email for the password reset link!";
        document.getElementById("email").value = "";
        document.getElementById("email").blur();
        
      } catch (err) {
        msg.style.color = "#f00";
        
        switch (err.code) {
          case "auth/invalid-email":
            msg.textContent = "Please enter a valid email address.";
            break;
          case "auth/user-not-found":
            msg.textContent = "No account found with this email.";
            break;
          default:
            msg.textContent = err.message;
        }
      }
    });
  </script>
</body>
</html>
