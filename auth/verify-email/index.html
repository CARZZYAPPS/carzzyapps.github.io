<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | Carzzy Apps</title>

    <meta name="description" content="Verify your email address to secure your Carzzy Apps account.">
    <meta name="keywords" content="Carzzy Apps, verify email, account security">
    <meta name="author" content="Avis, DeBus">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="Carzzy Apps">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Carzzy Apps">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Verify Email | Carzzy Apps">
    <meta property="og:description" content="Verify your email address to secure your Carzzy Apps account.">
    <meta property="og:url" content="https://www.carzzyapps.com/auth/verify-email/">
    <meta property="og:image" content="https://www.carzzyapps.com/Carzzy%20Apps%20Logo.png">
    <meta property="og:image:alt" content="Carzzy Apps logo">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Verify Email | Carzzy Apps">
    <meta name="twitter:description" content="Verify your email address to secure your Carzzy Apps account.">
    <meta name="twitter:image" content="https://www.carzzyapps.com/Carzzy%20Apps%20Logo.png">
    <meta name="twitter:image:alt" content="Carzzy Apps logo">
    <link rel="canonical" href="https://www.carzzyapps.com/auth/verify-email/">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
{% include navbar.html %}
  <script src="/nav-bar.js"></script>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-badge" id="badge" aria-hidden="true">
          <svg id="icon-mail" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <svg id="icon-check" hidden viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <svg id="icon-lock" hidden viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <h1 id="title">Verify your email</h1>
        <p id="subtitle">We need to verify your email address to secure your Carzzy Apps account.</p>
      </div>

      <button type="button" class="auth-submit" id="sendBtn" disabled>
        <span class="auth-spinner" aria-hidden="true"></span>
        <span class="auth-submit-text">Send Verification Email</span>
      </button>
      <a href="/auth/sign-in" class="auth-secondary" id="signInLink" hidden>Sign in</a>

      <div id="statusMsg" class="auth-msg" role="status" aria-live="polite"></div>

      <div class="auth-foot">
        <a href="/">Back to Carzzy Apps</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendEmailVerification, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4",
      authDomain: "www.carzzyapps.com",
      projectId: "carzzy-apps"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Send people back to where they were after verifying. Only pass a
    // continue URL when we have one; Firebase rejects an empty one.
    const prevPage = sessionStorage.getItem("prevPage");
    const actionCodeSettings = prevPage ? { url: prevPage, handleCodeInApp: false } : undefined;

    const sendBtn = document.getElementById("sendBtn");
    const sendText = sendBtn.querySelector(".auth-submit-text");
    const statusMsg = document.getElementById("statusMsg");
    const badge = document.getElementById("badge");
    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const signInLink = document.getElementById("signInLink");

    let cooldownInterval = null;
    const COOLDOWN_DURATION = 60000; // 60 seconds in milliseconds

    function showMsg(text, kind, sub) {
      statusMsg.className = "auth-msg is-" + kind;
      statusMsg.textContent = text;
      if (sub) {
        const s = document.createElement("span");
        s.className = "auth-msg-sub";
        s.textContent = sub;
        statusMsg.appendChild(s);
      }
    }

    function clearMsg() {
      statusMsg.className = "auth-msg";
      statusMsg.textContent = "";
    }

    function setBadge(kind) {
      badge.className = "auth-badge" + (kind === "mail" ? "" : " is-" + (kind === "check" ? "success" : "error"));
      document.getElementById("icon-mail").toggleAttribute("hidden", kind !== "mail");
      document.getElementById("icon-check").toggleAttribute("hidden", kind !== "check");
      document.getElementById("icon-lock").toggleAttribute("hidden", kind !== "lock");
    }

    function setSubtitle(before, email, after) {
      subtitleEl.textContent = before;
      if (email) {
        const strong = document.createElement("strong");
        strong.textContent = email;
        subtitleEl.append(strong, after || "");
      }
    }

    // Translate raw Firebase auth errors into readable messages.
    function getFriendlyAuthErrorMessage(error) {
      const code = error.code || error;
      switch (code) {
        case "auth/too-many-requests":
          return "You've made too many requests. Please wait a minute and try again.";
        case "auth/user-disabled":
          return "This account has been disabled. Please contact support for help.";
        case "auth/user-token-expired":
          return "Your session has expired. Please sign out and log back in to try again.";
        case "auth/network-request-failed":
          return "A network error occurred. Please check your internet connection.";
        case "auth/invalid-email":
          return "The associated email address is invalid.";
        case "auth/unauthorized-domain":
          return "This domain is not authorized. Please configure your authorized domains in the Firebase Console.";
        default:
          return error.message || "An unexpected error occurred. Please try again later.";
      }
    }

    function startCooldown(remainingSeconds) {
      clearInterval(cooldownInterval);
      sendBtn.disabled = true;

      const updateTimer = () => {
        if (remainingSeconds <= 0) {
          clearInterval(cooldownInterval);
          sendBtn.disabled = false;
          sendText.textContent = "Resend Verification Email";
          return;
        }
        sendText.textContent = `Resend in ${remainingSeconds}s`;
        remainingSeconds--;
      };

      updateTimer();
      cooldownInterval = setInterval(updateTimer, 1000);
    }

    // Resume a cooldown that was running before the page was refreshed.
    function checkCooldown(uid) {
      const lastSent = localStorage.getItem(`lastSentVerification_${uid}`);
      if (lastSent) {
        const timePassed = Date.now() - parseInt(lastSent, 10);
        if (timePassed < COOLDOWN_DURATION) {
          startCooldown(Math.ceil((COOLDOWN_DURATION - timePassed) / 1000));
        }
      }
    }

    onAuthStateChanged(auth, (user) => {
      clearInterval(cooldownInterval);
      sendBtn.classList.remove("is-loading", "is-done");
      signInLink.hidden = true;
      sendBtn.hidden = false;

      if (user) {
        if (user.emailVerified) {
          setBadge("check");
          titleEl.textContent = "Email verified";
          setSubtitle("", user.email, " is verified. You're all set!");
          sendText.textContent = "Verified ✓";
          sendBtn.classList.add("is-done");
          sendBtn.disabled = true;
          clearMsg();
        } else {
          setBadge("mail");
          titleEl.textContent = "Verify your email";
          setSubtitle("We'll send a verification link to ", user.email, ". Click it to secure your account.");
          sendText.textContent = "Send Verification Email";
          sendBtn.disabled = false;
          clearMsg();
          checkCooldown(user.uid);
        }
      } else {
        setBadge("lock");
        titleEl.textContent = "Sign in required";
        setSubtitle("You must be signed in to verify your email.");
        sendBtn.hidden = true;
        sendBtn.disabled = true;
        signInLink.hidden = false;
        clearMsg();
      }
    });

    sendBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) return;

      try {
        sendBtn.disabled = true;
        sendBtn.classList.add("is-loading");
        sendText.textContent = "Sending…";
        showMsg("Sending verification link…", "info");

        await sendEmailVerification(user, actionCodeSettings);

        localStorage.setItem(`lastSentVerification_${user.uid}`, Date.now().toString());
        sendBtn.classList.remove("is-loading");
        showMsg("Verification email sent! Please check your inbox.", "success",
          "Didn't receive it? Check your spam folder, or resend the email.");
        startCooldown(60);
      } catch (error) {
        sendBtn.classList.remove("is-loading");
        showMsg(getFriendlyAuthErrorMessage(error), "error");
        sendText.textContent = "Send Verification Email";
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
