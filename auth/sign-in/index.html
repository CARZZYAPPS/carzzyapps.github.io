---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Carzzy Apps</title>
    <style>
    /* These headings were moved up one level (h2 -> h1 etc.); keep the
       size and spacing they had before. Rules below still override this. */
    h1 { font-size: 1.5em; margin-top: 0.83em; margin-bottom: 0.83em; }

      body{background:#0a0a0a;color:#00d1b2;font-family:sans-serif;margin:0}
      .card{background:#1a1a1a;border:1px solid #00d1b2;padding:30px;border-radius:12px;width:100%;max-width:450px;box-sizing:border-box;margin:150px auto 0 auto;}
      h1 {font-size: 32px; text-align: center;}
      label{display:block;margin-top:20px;font-size:15px}
      input,button{width:100%;padding:10px;margin-top:5px;border-radius:6px;box-sizing:border-box}
      input{background:#2a2a2a;border:1px solid #333;color:#fff}
      button{background:#00d1b2;border:none;color:#0a0a0a;font-weight:bold;cursor:pointer;margin-top:25px; font-size: 20px}
      .msg{text-align:center;margin-top:15px}
      .show-pw-container {display: flex; align-items: center; gap: 8px; margin-top: 10px;}
      .show-pw-container input {width: auto; margin: 0; cursor: pointer; accent-color: #00d1b2;}
      .show-pw-container label {margin: 0; font-size: 14px; color: #ccc; cursor: pointer;}
      .stay-signed-in-container {display: flex; align-items: center; gap: 8px; margin-top: 12px; color: #ccc; font-size: 14px;}
      .stay-signed-in-container input {width: auto; margin: 0; accent-color: #00d1b2;}
      .stay-signed-in-container label {margin: 0; cursor: pointer;}
    </style>
  <style>
    /* Base page font and spacing. These used to be applied to every page by the
       old fetched navbar; they now live on each page that relies on them. */
    html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body>
{% include navbar.html %}
  <script src="/nav-bar.js"></script>
  <div class="card">
    <h1>Sign In</h1>
    <form id="login-form">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">

      <div class="show-pw-container">
        <input type="checkbox" id="toggle-password">
        <label for="toggle-password">Show password</label>
      </div>

      <div class="stay-signed-in-container">
        <input type="checkbox" id="stay-signed-in">
        <label for="stay-signed-in">Stay signed in on this device</label>
      </div>

      <button type="submit">Sign In</button>
    </form>
    <div id="msg" class="msg"></div>
    <div style="text-align:center; margin-top:15px;color:#ccc">
      <br><a href="/auth/reset-password" style="color:#00d1b2">Forgot your password?</a><br><br>
      Don't have an account? <a href="/auth/sign-up" style="color:#00d1b2">Sign Up</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      browserLocalPersistence,
      browserSessionPersistence,
      getAuth,
      setPersistence,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp({ apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", authDomain: "carzzy-apps.firebaseapp.com", projectId: "carzzy-apps" });
    const auth = getAuth(app);

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    togglePassword.addEventListener("change", () => {
      passwordInput.type = togglePassword.checked ? "text" : "password";
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      try {
        const staySignedIn = document.getElementById("stay-signed-in").checked;
        await setPersistence(auth, staySignedIn ? browserLocalPersistence : browserSessionPersistence);
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        // Perform email-based login directly
        await signInWithEmailAndPassword(auth, email, password);
        
        if (staySignedIn) {
          localStorage.setItem("signIn", "true");
        } else {
          localStorage.removeItem("signIn");
        }
        msg.style.color = "#00d1b2"; msg.textContent = "Logged in successfully!";
        const returnTo = sessionStorage.getItem("prevPage") || "/";
        window.location.href = returnTo;
      } catch (error) {
        console.error("Sign-in failed.", error);
        msg.style.color = "#f00"; msg.textContent = "Incorrect email or password";
      }
    });
  </script>
</body>
</html>
