---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <title>Sign In | Carzzy Apps</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
{% include navbar.html %}
  <script src="/nav-bar.js"></script>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to your Carzzy Apps account</p>
      </div>

      <label class="auth-check auth-check-top">
        <input type="checkbox" id="stay-signed-in" checked>
        Stay signed in on this device
      </label>

      <button type="button" class="auth-google" id="google-btn">
        <span class="auth-spinner" aria-hidden="true"></span>
        <svg class="auth-google-logo" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span>Continue with Google</span>
      </button>

      <div id="google-msg" class="auth-msg" role="alert" aria-live="polite"></div>

      <div class="auth-divider">or</div>

      <form id="login-form" novalidate>
        <div class="auth-field">
          <label for="email">Email address</label>
          <div class="auth-input-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <div class="auth-label-row">
            <label for="password">Password</label>
            <a href="/auth/reset-password">Forgot password?</a>
          </div>
          <div class="auth-input-wrap has-toggle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="auth-eye" aria-controls="password" aria-label="Show password" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>


        <button type="submit" class="auth-submit" id="submit-btn">
          <span class="auth-spinner" aria-hidden="true"></span>
          <span class="auth-submit-text">Sign In</span>
        </button>
      </form>

      <div id="msg" class="auth-msg" role="alert" aria-live="polite"></div>

      <div class="auth-foot">
        Don't have an account? <a href="/auth/sign-up">Create one</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      browserLocalPersistence,
      browserSessionPersistence,
      getAuth,
      setPersistence,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { startGoogleSignIn, finishGoogleSignIn, isFinishingGoogleSignIn, googleErrorMessage, CHOOSE_USERNAME_URL } from "/auth/google.js?v=5";

    const app = initializeApp({ apiKey: "AIzaSyAgu1uiobgixRWcvIja6bI1l6M2KQ36FL4", authDomain: "www.carzzyapps.com", projectId: "carzzy-apps" });
    const auth = getAuth(app);

    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");
    const submitText = submitBtn.querySelector(".auth-submit-text");

    function showMsg(text, kind) {
      msg.className = "auth-msg is-" + kind;
      msg.textContent = text;
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      submitBtn.classList.toggle("is-loading", on);
      submitText.textContent = on ? "Signing in…" : "Sign In";
    }

    document.querySelectorAll(".auth-eye").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.getAttribute("aria-controls"));
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.setAttribute("aria-pressed", String(show));
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMsg("Please enter your email and password.", "error");
        return;
      }

      setLoading(true);
      try {
        const staySignedIn = document.getElementById("stay-signed-in").checked;
        await setPersistence(auth, staySignedIn ? browserLocalPersistence : browserSessionPersistence);

        await signInWithEmailAndPassword(auth, email, password);

        if (staySignedIn) {
          localStorage.setItem("signIn", "true");
        } else {
          localStorage.removeItem("signIn");
        }
        showMsg("Signed in! Taking you back…", "success");
        const returnTo = sessionStorage.getItem("prevPage") || "/";
        window.location.href = returnTo;
      } catch (error) {
        console.error("Sign-in failed.", error);
        setLoading(false);
        if (error.code === "auth/network-request-failed") {
          showMsg("Network error. Check your connection and try again.", "error");
        } else if (error.code === "auth/too-many-requests") {
          showMsg("Too many attempts. Please wait a moment and try again.", "error");
        } else {
          showMsg("Incorrect email or password.", "error");
        }
      }
    });

    // ---------- Continue with Google ----------
    // The whole window goes to Google, then Google sends the person back here.
    const googleBtn = document.getElementById("google-btn");
    const googleMsg = document.getElementById("google-msg");

    // Google messages show right under the Google button.
    function showGoogleMsg(text, kind) {
      googleMsg.className = "auth-msg is-" + kind;
      googleMsg.textContent = text;
    }
    const googleText = googleBtn.querySelector("span:last-child");

    function setGoogleBusy(on, text) {
      googleBtn.disabled = on;
      googleBtn.classList.toggle("is-loading", on);
      googleText.textContent = on ? text : "Continue with Google";
    }

    googleBtn.addEventListener("click", async () => {
      setGoogleBusy(true, "Going to Google…");
      googleMsg.className = "auth-msg";
      try {
        const staySignedIn = document.getElementById("stay-signed-in").checked;
        await startGoogleSignIn(auth, staySignedIn);
      } catch (err) {
        console.error("Google sign-in failed.", err);
        setGoogleBusy(false);
        const text = googleErrorMessage(err);
        if (text) showGoogleMsg(text, "error");
      }
    });

    // Back from Google: finish signing in, then move on.
    function finishFromGoogle() {
      setGoogleBusy(true, "Signing you in…");
      finishGoogleSignIn(app, auth).then((done) => {
        if (!done) { setGoogleBusy(false); return; }
        if (done.cancelled) {
          setGoogleBusy(false);
          showGoogleMsg("Google sign-in was cancelled. Please try again.", "error");
          return;
        }
        if (done.needsUsername) {
          window.location.replace(CHOOSE_USERNAME_URL);
        } else {
          showGoogleMsg("Signed in! Taking you back…", "success");
          window.location.replace(sessionStorage.getItem("prevPage") || "/");
        }
      }).catch((err) => {
        console.error("Google sign-in failed.", err);
        setGoogleBusy(false);
        const text = googleErrorMessage(err);
        if (text) showGoogleMsg(text, "error");
      });
    }
    if (isFinishingGoogleSignIn()) finishFromGoogle();

    // Pressing Back on Google's page can bring this page back from the
    // browser's memory without reloading it; finish (or reset) then too.
    window.addEventListener("pageshow", (e) => {
      if (!e.persisted) return;
      if (isFinishingGoogleSignIn()) finishFromGoogle();
      else setGoogleBusy(false);
    });
  </script>
</body>
</html>
