<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Harbor Rush</title>
<!--LZHEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1626;--ink2:#14243b;--ink3:#1d3352;--hz:#ffc400;--hz2:#e0a800;--wh:#f4f7fb;--mut:#8ea3bf;--good:#3ddc84;--bad:#ff5a4f;--blue:#38a8ff;--disp:'Bungee','Impact','Arial Black',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--wh);font-family:var(--body);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
/* hazard stripes */
.stripe{background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#111 14px 28px)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{background:rgba(11,22,38,.82);border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:6px 11px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#hLvl{display:flex;flex-direction:column;min-width:0}
#hLvl b{font:15px var(--disp);letter-spacing:.5px;color:var(--hz);white-space:nowrap}
#hLvl small{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap}
#hTrucks{display:flex;gap:3px;align-items:center;flex-wrap:wrap;max-width:46vw}
@media (max-width:520px){#hTrucks{max-width:30vw}#hTrucks i{width:9px;height:9px}#hLvl b{font-size:14px}}
#hTrucks i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.18);display:block}
#hTrucks i.ok{background:var(--good)}#hTrucks i.miss{background:var(--bad)}
#hScore{margin-left:auto;text-align:right}
#hScore b{font:20px var(--disp);display:block;line-height:1.05}
#hScore small{font-size:11px;font-weight:800;color:var(--hz)}
#hHearts{font-size:16px;letter-spacing:1px;white-space:nowrap}
#hPause{pointer-events:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:16px var(--disp)}
/* controls */
#ctl{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:flex-end;gap:12px;z-index:5;pointer-events:none}
.cb{pointer-events:auto;width:76px;height:76px;border-radius:22px;background:rgba(11,22,38,.85);border:2px solid rgba(255,255,255,.12);box-shadow:0 5px 0 rgba(0,0,0,.35);display:grid;place-items:center;font:28px var(--disp);color:var(--wh)}
.cb.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);background:var(--ink3)}
#bAct{margin-left:auto;width:118px;height:92px;border-radius:26px;background:var(--hz);color:var(--ink);border-color:#fff3;box-shadow:0 6px 0 #a87d00;font-size:22px}
#bAct.drop{background:#3ddc84;box-shadow:0 6px 0 #1c8a4d}
#bAct.busy{opacity:.55}
#bAct.on{transform:translateY(4px);box-shadow:0 2px 0 #a87d00}
#keys{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(11,22,38,.7);padding:7px 12px;border-radius:999px;z-index:5;pointer-events:none;white-space:nowrap}
#keys kbd{font:11px var(--disp);background:rgba(255,255,255,.14);padding:2px 6px;border-radius:6px;margin:0 2px}
/* toast / callout */
#call{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center}
#call div{font:clamp(18px,4.6vw,30px) var(--disp);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);animation:cin .25s ease-out}
#call small{display:block;font:700 13px var(--body);color:var(--hz);text-shadow:0 2px 0 rgba(0,0,0,.5)}
@keyframes cin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#tip{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:6;pointer-events:none;background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:10px 14px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.25);max-width:88vw;text-align:center}
#tip:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
body.desk #tip{bottom:60px}
@media (pointer:coarse){#tip{bottom:auto;top:calc(env(safe-area-inset-top) + 70px)}#tip:after{display:none}#call{top:auto;bottom:150px}}
/* screens */
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px);background:radial-gradient(120% 80% at 50% 0%,#1d3a63 0%,var(--ink) 70%)}
.scr.glass{background:rgba(7,14,26,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);justify-content:center}
.scr>*{flex:none}
.card{width:100%;max-width:440px;background:var(--ink2);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.3);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font:26px var(--disp);margin:0 0 4px;line-height:1.05}
.card p{margin:6px 0;color:#c7d4e6;font-size:14px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font:17px var(--disp);background:var(--hz);color:var(--ink);box-shadow:0 5px 0 #a87d00;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a87d00}
.btn.sec{background:var(--ink3);color:var(--wh);box-shadow:0 5px 0 #0a1424}
.btn.sec:active{box-shadow:0 2px 0 #0a1424}
.btn.grn{background:var(--good);box-shadow:0 5px 0 #1c8a4d}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1}
/* title */
#title{justify-content:center;gap:14px;overflow:hidden}
.logo{text-align:center;position:relative}
.logo .k{font:800 12px var(--body);letter-spacing:4px;color:var(--mut)}
.logo h1{margin:4px 0 0;font:clamp(46px,14vw,92px)/.92 var(--disp);color:#fff;text-shadow:0 6px 0 #091222}
.logo h1 span{color:var(--hz);display:block}
.logo .st{height:14px;width:min(360px,80vw);margin:14px auto 0;border-radius:4px}
#title .card{max-width:380px;text-align:center;background:rgba(20,36,59,.85)}
#tEA{font-size:13px;font-weight:700;color:var(--hz);margin-top:10px}
#tLz{font-size:12px;color:var(--mut);margin-top:8px}
.crane-art{width:min(300px,70vw);height:auto;display:block;margin:0 auto -6px}
/* map */
#map h1{font:28px var(--disp);margin:6px 0 2px;text-align:center}
.top{width:100%;max-width:560px;display:flex;align-items:center;gap:10px}
.top .sp{flex:1}
.coins{font:16px var(--disp);color:var(--hz);background:var(--ink2);padding:8px 12px;border-radius:12px}
.port{width:100%;max-width:560px;border-radius:22px;margin-top:14px;padding:16px;position:relative;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.port h3{margin:0;font:21px var(--disp);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.port .tg{font-size:13px;font-weight:700;opacity:.92;margin:2px 0 12px;max-width:80%}
.port .stc{position:absolute;right:14px;top:14px;font:15px var(--disp);background:rgba(0,0,0,.28);padding:5px 10px;border-radius:10px}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:16px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:20px var(--disp);color:#fff;position:relative}
.lv small{font:11px var(--body);font-weight:800;letter-spacing:-1px;color:var(--hz);height:13px}
.lv.next{background:var(--hz);color:var(--ink);border-color:#fff;animation:bob 1.4s ease-in-out infinite}
.lv.next small{color:var(--ink)}
.lv[disabled]{opacity:.4}
@keyframes bob{50%{transform:translateY(-3px)}}
.lock{position:absolute;inset:0;background:rgba(7,14,26,.62);display:flex;align-items:center;justify-content:center;font:16px var(--disp);text-align:center;padding:10px}
.mode{width:100%;max-width:560px;margin-top:14px;display:flex;gap:10px}
.mode .btn{flex:1;min-height:58px}
/* workshop */
.up{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.up:first-of-type{border-top:0}
.up .ic{width:46px;height:46px;border-radius:14px;background:var(--ink3);display:grid;place-items:center;font-size:22px;flex:none}
.up .tx{flex:1;min-width:0}.up b{display:block;font-size:15px}.up small{color:var(--mut);font-size:12.5px}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}.pips i.on{background:var(--hz)}
.up .btn{min-height:42px;padding:0 12px;font-size:14px}
/* results */
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.stars svg{width:54px;height:54px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.stars svg.in{transform:scale(1)}.stars svg:nth-child(2){width:66px;height:66px;margin-top:-10px}
.big{font:40px var(--disp);text-align:center;margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;margin-top:10px}
.kv span:nth-child(even){text-align:right;font-weight:800}
.kv .t{font-weight:800;border-top:1px dashed rgba(255,255,255,.18);padding-top:6px}
.pos{color:var(--good)}.neg{color:var(--bad)}.gold{color:var(--hz)}
.nb{display:inline-block;background:var(--hz);color:var(--ink);font:12px var(--disp);padding:3px 8px;border-radius:8px;margin-top:4px}
.goal{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.goal div{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.2);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700}
.goal i{font-style:normal;font-size:20px;width:26px;text-align:center}
.tgl{font:13px var(--body);font-weight:800;color:var(--mut);text-decoration:underline;margin-top:12px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div class="pill" id="hLvl"><b id="hName">1-1</b><small id="hTime">0:00</small></div>
  <div class="pill" id="hTrucks"></div>
  <div class="pill" id="hScore"><b id="hPts">0</b><small id="hCombo"></small></div>
  <div class="pill" id="hHearts"></div>
  <button class="pill" id="hPause" aria-label="Pause">II</button>
</div>
<div id="ctl" class="hide">
  <button class="cb" id="bL" aria-label="Move left">◀</button>
  <button class="cb" id="bR" aria-label="Move right">▶</button>
  <button class="cb" id="bAct">GRAB</button>
</div>
<div id="keys" class="hide"><kbd>←</kbd><kbd>→</kbd> move · <kbd>SPACE</kbd> grab / drop · or drag and click</div>
<div id="call"></div>
<div id="tip" class="hide"></div>
<div id="scr"></div>
<script>
