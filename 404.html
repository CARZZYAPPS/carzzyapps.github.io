    <style>
        :root {
            --primary: #00d1b2;
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --text-secondary: #888;
        }

        * {
            box-sizing: border-box;

        }

        body {
            background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 90%);
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: min(48vw, 700px);
            margin: clamp(340px, 38vh, 440px) 4vw 110px auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            animation: fadeIn 1.2s ease-out;
        }

        h2 {
            color: var(--primary);
            font-size: clamp(5rem, 15vw, 9rem);
            line-height: 1;
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.4);
            animation: pulseText 3s ease-in-out infinite;
        }

        h3 {
            color: var(--text-secondary);
            font-size: clamp(1.75rem, 5vw, 3rem);
            margin: 0.5rem 0 1.5rem;
        }

        p {
            font-weight: bold;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            color: var(--primary);
        }

        .btn {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 1rem 2rem;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn:hover {
            background-color: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 30px rgba(0, 209, 178, 0.6);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .wordmark {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            z-index: 1;
        }

        .wordmark h1 {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            align-items: center;
            margin: 0;
            color: var(--primary);
            font-size: clamp(1.35rem, 7vw, 8rem);
            line-height: 1.1;
            font-weight: 800;
            text-shadow: 0 0 24px rgba(0, 209, 178, 0.25);
        }

        .missing-slot {
            grid-column: 5;
            grid-row: 1;
            justify-self: center;
            width: 0.56em;
            height: 0.5em;
            align-self: flex-start;
            margin-top: 0.55em;
            border-bottom: 0.055em dashed rgba(0, 209, 178, 0.65);
        }

        .wordmark-space {
            grid-column: 8;
            width: 0.5em;
        }

        .repair-message {
            max-width: 620px;
            margin: 0 0 2rem;
            line-height: 1.5;
        }

        .repair-message a {
            color: white;
            text-decoration-color: var(--primary);
            text-underline-offset: 3px;
        }

        .repair-message a:hover,
        .repair-message a:focus-visible {
            color: var(--primary);
        }

        .fallen-z {
            grid-column: 5;
            grid-row: 2;
            justify-self: center;
            color: var(--primary);
            font-size: clamp(1.35rem, 8.5vw, 8rem);
            line-height: 1;
            font-weight: 800;
            text-shadow: 0 0 24px rgba(0, 209, 178, 0.4);
            animation: fall-out 1.2s cubic-bezier(0.48, 0, 0.75, 0.35) both;
        }

        @keyframes fall-out {
            from {
                opacity: 0;
                transform: translateY(calc(-100% - 0.5rem)) rotate(-15deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--primary) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.05;
            z-index: -1;
        }

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 32px);
                margin: 220px auto 90px;
                align-items: center;
                text-align: center;
            }

            .repair-message {
                margin-right: auto;
                margin-left: auto;
            }
        }

        @media (max-width: 480px) {
            .wordmark h1,
            .fallen-z {
                font-size: 7.3vw;
            }

            .container {
                margin-top: 190px;
                padding: 1.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }

    </style>
</head>

<body>
    <script src="/nav-bar.js"></script>

    <header class="wordmark">
        <h1 aria-label="Carzzy Apps">
            <span class="wordmark-letter">C</span>
            <span class="wordmark-letter">A</span>
            <span class="wordmark-letter">R</span>
            <span class="wordmark-letter">Z</span>
            <span class="missing-slot" aria-hidden="true"></span>
            <span class="wordmark-letter">Z</span>
            <span class="wordmark-letter">Y</span>
            <span class="wordmark-space" aria-hidden="true"></span>
            <span class="wordmark-letter">A</span>
            <span class="wordmark-letter">P</span>
            <span class="wordmark-letter">P</span>
            <span class="wordmark-letter">S</span>
            <span class="fallen-z" aria-hidden="true">z</span>
        </h1>
    </header>

    <div class="container">

        <samp>
            <h2>404</h2>
            <h3>Not Found</h3>
        </samp>

        <p class="repair-message">
            This page is missing its second Z. Please check out our
            <a href="https://www.carzzyapps.com/">other games</a> while we repair it.
        </p>

        <a href="https://carzzyapps.github.io/" class="btn">
            Explore Our Games
        </a>

    </div>

</body>

</html>
