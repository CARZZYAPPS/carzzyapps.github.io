    <style>
        :root {
            --primary: #00d1b2;
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --text-secondary: #888;
        }

        * {
            box-sizing: border-box;

        }

        body {
            /* Radial gradient adds depth compared to a flat color */
            background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 90%);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            margin-top: 150px;
            padding: 2rem;
            max-width: 400px;
            animation: fadeIn 1.2s ease-out;
        }

        h2 {
            color: var(--primary);
            font-size: 9rem;
            margin: -20px;
            text-shadow: 0 0 20px rgba(0, 209, 178, 0.4);
            animation: pulseText 3s ease-in-out infinite;
        }

        h3 {
            color: var(--text-secondary);
            font-size: 3rem;
            margin: 0px;
            margin-bottom: 2rem;
        }

        p {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 3rem;
            color: var(--primary);
        }

        /* Styled button with transitions and hover effects */

        .btn {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 1.2rem 2.5rem;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn:hover {
            background-color: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 30px rgba(0, 209, 178, 0.6);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseText {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        /* Subtle background particle effect (simulated with CSS) */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--primary) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.05;
            z-index: -1;
        }
