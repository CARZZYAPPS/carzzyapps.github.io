    <body>

		<script src="/nav-bar.js"></script>

        <div id="stats">
            Session Score: <span id="session-score"></span>
            <div class="best-scores">All Time Score: <span id="all-time-score"></span></div>
            Streak: <span id="streak"></span>
            <div class="best-scores">Highest Streak: <span id="highest-streak"></span></div>
        </div>

        <h2>Right On Time</h2>
        <p style="color: #ffd700">
            Try to stop the stopwatch exactly on the second (1.00s, 2.00s, etc.). You can wait as long as you want before you stop it.<br>
            Try to build a streak!
        </p>

        <div id="timer">
            <span id="minutes"></span><span id="seconds">00</span>.<span id="centiseconds">00</span>
        </div>

        <p id="message">&nbsp;</p>

        <button id="start-stop" onmousedown="doTimer()">Start</button>
        <button id="reset" onmousedown="resetTimer()">Reset</button>

        <script>

            let s = 0;
            let cs = 0;
            let m = 0;
            let score = 0;
            let ATScore = Number(localStorage.getItem('all-time-score')) || 0;
            let currStreak = 0;
            let highestStreak = Number(localStorage.getItem('highest-streak')) || 0;
            let stopMessage;

            const sessionScore = document.getElementById('session-score');
            const allTimeScore = document.getElementById('all-time-score');
            const streak = document.getElementById('streak');
            const bestStreak = document.getElementById('highest-streak');

            sessionScore.innerHTML = score;
            allTimeScore.innerHTML = ATScore;
            streak.innerHTML = currStreak;
            bestStreak.innerHTML = highestStreak;

            const minutes = document.getElementById('minutes');
            const seconds = document.getElementById('seconds');
            const centiseconds = document.getElementById('centiseconds');
            const message = document.getElementById('message');

            const startStop = document.getElementById('start-stop');
            const reset = document.getElementById('reset');

            let timer = null;

            function doTimer() {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                    startStop.style.backgroundColor = "#00a500"
                    startStop.innerText = "Start";

                    if (s > 0 && cs === 0) {
                        stopMessage = "You did it! Continue the streak!";
                        message.style.color = '#0f0';

                        score += 1;
                        ATScore += 1;
                        currStreak += 1;
                        sessionScore.innerHTML = score;
                        allTimeScore.innerHTML = ATScore;
                        streak.innerHTML = currStreak;
                        localStorage.setItem('all-time-score', ATScore);
                        if (currStreak > highestStreak) {
                            highestStreak += 1;
                            bestStreak.innerHTML = highestStreak;
                            localStorage.setItem('highest-streak', currStreak);
                        }

                    } else if (cs >= 95 || (s > 0 && cs <= 5)) {
                        stopMessage = "So Close! Try again.";
                        message.style.color = '#ffd700';
                        currStreak = 0;
                        streak.innerHTML = currStreak;
                    } else if (cs >= 90 || (s > 0 && cs <= 10)) {
                        stopMessage = "Off by just a bit! Try again.";
                        message.style.color = '#ffd700';
                        currStreak = 0;
                        streak.innerHTML = currStreak;
                    } else {
                        stopMessage = "You can do better than that. Try again.";
                        message.style.color = '#f00';
                        currStreak = 0;
                        streak.innerHTML = currStreak;
                    }

                    message.innerHTML = stopMessage;

                } else {
                    timer = setInterval(() => {
                        cs += 1;
                        if (cs > 99) {
                            s +=1;
                            cs = 0;
                        }
                        seconds.innerHTML = s;
                        if (cs < 10) {
                            centiseconds.innerHTML = "0" + cs;
                        } else {
                            centiseconds.innerHTML = cs;
                        }
                        if (s > 59) {
                            m += 1;
                            s = 0;
                            cs = 0;
                            minutes.innerHTML = m + ":";
                            seconds.innerHTML = "0" + s;
                            centiseconds.innerHTML = cs;
                        }
                        if (s < 10) {
                            seconds.innerHTML = "0" + s;
                        } else {
                            seconds.innerHTML = s;
                        }
                    }, 10)

                    startStop.style.backgroundColor = "#ff0000";
                    startStop.style.color = "#fff";
                    startStop.innerText = "Stop";
                    message.innerHTML = "&nbsp;";
                }
            }

            function resetTimer() {
                clearInterval(timer);
                timer = null;
                s = 0;
                cs = 0;
                minutes.innerHTML = "";
                seconds.innerHTML = "00";
                centiseconds.innerHTML = "00";
                startStop.style.backgroundColor = "#00a500"
                startStop.innerText = "Start";
                message.innerHTML = "&nbsp;";
            }

        </script>

    </body>
