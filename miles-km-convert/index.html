    <body>

        <script src="/nav-bar.js"></script>

        <h2>Miles ↔ Kilometers Converter</h2>

            <div class="convert">
                <h3>Miles to Kilometers</h3>
                <input type="number" id="miles" placeholder="Miles">
                <button class="convert-btn" id="mi-to-km" onclick="convertMi()">CONVERT</button>
                <div class="result">
                    <b>Result:</b> <span id="km-result"><br>&nbsp;</span>
                </div>
            </div>

            <div class="convert">
                <h3>Kilometers to Miles</h3>
                <input type="number" id="km" placeholder="Kilometers">
                <button class="convert-btn" id="km-to-mi" onclick="convertKm()">CONVERT</button>
                <div class="result">
                    <b>Result:</b> <span id="mi-result"><br>&nbsp;</span>
                </div>
            </div>


        <footer>Avis & DeBus v1.0.0 PRO</footer>

        <script>

            const milesKm = 1.60934;
            const milesBtn = document.getElementById('miles-to-km');
            const kmBtn = document.getElementById('km-to-mi');
            const miInput = document.getElementById('miles');
            const kmInput = document.getElementById('km');
            let result;

            function convertMi() {
                result = miInput.value * milesKm;
                document.getElementById('km-result').innerHTML = "<br>" + result + " Km";
            }

            function convertKm() {
                result = kmInput.value / milesKm;
                document.getElementById('mi-result').innerHTML = "<br>" + result + " Mi";
            }

        </script>

</body>
