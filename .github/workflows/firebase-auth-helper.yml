name: Firebase sign-in helper files

# Google sign-in runs through www.carzzyapps.com/__/auth/ instead of
# carzzy-apps.firebaseapp.com, so the Google popup shows our own domain.
# Firebase's helper files are copied from the firebaseapp.com domain into
# __/ here. This keeps them up to date: it runs monthly and can be run by hand
# (Actions tab -> this workflow -> Run workflow). Commits only if they changed.
#
# GitHub Pages serves /__/auth/handler from handler.html, so the two HTML pages
# are saved with a .html extension. _config.yml tells Jekyll to publish __/.

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download helper files
        run: |
          set -euo pipefail
          base="https://carzzy-apps.firebaseapp.com/__"
          mkdir -p __/auth __/firebase
          get() {
            code=$(curl -sSL --retry 3 -o "$2" -w "%{http_code}" "$base/$1")
            echo "$1 -> HTTP $code, $(wc -c < "$2") bytes"
            [ "$code" = 200 ] && [ -s "$2" ]
          }
          failed=0
          get auth/handler        __/auth/handler.html   || failed=1
          get auth/handler.js     __/auth/handler.js     || failed=1
          get auth/experiments.js __/auth/experiments.js || failed=1
          get auth/iframe         __/auth/iframe.html    || failed=1
          get auth/iframe.js      __/auth/iframe.js      || failed=1
          # Only exists if Firebase Hosting is set up; the sign-in pages work
          # without it (it 404s on carzzy-apps.firebaseapp.com too).
          get firebase/init.json  __/firebase/init.json  || rm -f __/firebase/init.json
          [ "$failed" = 0 ] || { echo "Some files could not be downloaded."; exit 1; }
          ls -la __/auth
      - name: Commit if changed
        run: |
          git add __
          if git diff --cached --quiet; then
            echo "Helper files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Firebase sign-in helper files"
          git push
      - name: Check the live site serves them
        # Right after a commit the site may still be rebuilding, so this only
        # warns. A real problem shows up here on the next run.
        run: |
          ok=1
          check() {
            body=$(curl -sSL --retry 2 "https://www.carzzyapps.com/__/auth/$1" || true)
            if printf '%s' "$body" | grep -q "$2"; then echo "OK: /__/auth/$1"; else echo "::warning::/__/auth/$1 is not serving the Firebase helper yet"; ok=0; fi
          }
          check handler     "fireauth.oauthhelper.widget.initialize"
          check iframe      "fireauth.iframe.AuthRelay.initialize"
          check handler.js  "fireauth"
          [ "$ok" = 1 ] && echo "All helper files are live."
