name: Wipe Firestore (keep usernames)
on:
  push:
    branches: [claude/serene-noether-v41jf4]
    paths: [".github/wipe-mode", ".github/workflows/wipe-firestore.yml", ".github/scripts/wipe-firestore.js"]
permissions:
  contents: read
jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wipe
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export MODE="$(cat .github/wipe-mode)"
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i firebase-admin@12 >/dev/null
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/wipe-firestore.js"
