name: Arcade migration export

# ONE-TIME, read-only export of Lazer Arcade data out of carzzy-apps for the move
# to the standalone project. Uses the existing FIREBASE_SERVICE_ACCOUNT secret only
# to READ; writes nothing back to carzzy-apps data. The dump is encrypted with a
# public key (private half lives only on the EWieds repo) and pushed to the
# `arcade-migration` branch for the import job to pull. Delete this workflow after.
#
# Runs only when `.github/arcade-export/RUN` changes (commit/alter it to trigger),
# so merely adding the tooling does not fire a premature snapshot.

on:
  push:
    paths: [".github/arcade-export/RUN"]

permissions:
  contents: write

concurrency:
  group: arcade-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: s
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::error::FIREBASE_SERVICE_ACCOUNT not set — cannot export."; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save firebase-admin@13
      - name: Dump auth users (uids + password hashes)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/arcade-auth-dump.js auth-dump.json
      - name: Dump Firestore (all arcade collections + subcollections)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/arcade-dump.js firestore-dump.json
      - name: Bundle + encrypt (hybrid RSA-OAEP + AES-256)
        run: |
          tar czf dump.tgz auth-dump.json firestore-dump.json
          openssl rand -out aeskey.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in dump.tgz -out dump.enc -pass file:aeskey.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/migrate/mig_pub.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in aeskey.bin -out aeskey.enc
          rm -f dump.tgz auth-dump.json firestore-dump.json aeskey.bin
          ls -la dump.enc aeskey.enc
      - name: Publish encrypted dump to arcade-migration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir ../pub && cp dump.enc aeskey.enc ../pub/
          echo "$STAMP" > ../pub/STAMP
          cd ../pub
          git init -q
          git checkout -q -b arcade-migration
          git add .
          git -c user.email=actions@github.com -c user.name="arcade-export" commit -q -m "Encrypted arcade migration dump $STAMP"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" arcade-migration
          echo "Pushed encrypted dump to arcade-migration @ $STAMP"
