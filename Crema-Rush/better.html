<style>
/* Layout: full-bleed 3D café behind a thin overlay. HUD on top, ticket rail under it,
   camera views at the bottom. Bubbles and machine timers float over the 3D world. */
:root{
  --bg:#101815; --glass:rgba(14,22,19,.80); --glass2:rgba(30,44,38,.92); --line:rgba(255,255,255,.14);
  --ink:#f3f0e7; --muted:#a8b3ab;
  --paper:#f4f1e8; --paper-ink:#1d211e; --paper-mute:#6b716b; --paper-line:#d4d0c3;
  --amber:#ffc542; --danger:#ff5b4a; --go:#7fe0a5;
  --E:#e38a3c; --M:#dfe7ea; --D:#d8b043; --C:#3fbcb3;
  --Ed:#a95815; --Md:#557a8e; --Dd:#8a6a0c; --Cd:#127c75;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[data-k="E"]{--kc:var(--E);--kd:var(--Ed)}
[data-k="M"]{--kc:var(--M);--kd:var(--Md)}
[data-k="D"]{--kc:var(--D);--kd:var(--Dd)}
[data-k="C"]{--kc:var(--C);--kd:var(--Cd)}

#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block;width:100%;height:100%;cursor:pointer}
#tags{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}

#ui{position:fixed;inset:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:8px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui>*{pointer-events:auto}
#ui>.fill{flex:1;pointer-events:none;min-height:0}

/* HUD */
#hud{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex:none}
.hl{display:flex;gap:8px;align-items:stretch;min-width:0}
.card{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cash small,.dayrow small{display:block;font:600 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cash b{display:block;font:700 32px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--go)}
.cash b.neg{color:var(--danger)}
.cash .emp{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:2px;white-space:nowrap}
.dayb{display:flex;flex-direction:column;gap:4px;min-width:150px}
.dayrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dayrow b{font:700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
#clock{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.dbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--amber);transform-origin:left;transform:scaleX(0)}
.dbar.closing i{background:var(--danger)}
.rate{display:flex;align-items:center;gap:6px;font:600 13px var(--mono)}
.stars{display:flex;gap:2px}
.star{width:14px;height:14px;position:relative}
.star svg{position:absolute;inset:0;width:100%;height:100%}
.star .bgs{fill:rgba(255,255,255,.18)}
.star .fgs{fill:var(--amber)}
.star .fgw{position:absolute;left:0;top:0;bottom:0;overflow:hidden}
.star .fgw svg{width:14px;height:14px}
.hr{display:flex;gap:6px;align-items:center}
.pill-b{background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.pill-b.can{background:var(--amber);color:#1c1503;border-color:transparent;animation:glow .9s infinite alternate}
.icon-b{width:40px;height:40px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);font:700 15px var(--mono);cursor:pointer}
@keyframes glow{to{box-shadow:0 0 0 4px rgba(255,197,66,.3)}}

/* Ticket rail */
#rail{flex:none;display:flex;gap:8px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:2px 2px 4px;min-height:0;max-height:34vh;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;touch-action:pan-x}
#rail:empty{display:none}
.tk{flex:0 0 160px;background:var(--paper);color:var(--paper-ink);font-family:var(--mono);padding:6px 7px 14px;position:relative;
  animation:feed .35s ease-out;box-shadow:0 6px 16px rgba(0,0,0,.35);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;
  transition:opacity .25s,transform .25s}
.tk.out{opacity:0;transform:translateY(-10px)}
@keyframes feed{from{transform:translateY(-14px);opacity:0}}
.tk-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tk-top .no{font:500 11px var(--mono);color:var(--paper-mute)}
.tk-top .who{font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-flag{display:inline-block;background:var(--danger);color:#fff;font:600 10px var(--mono);letter-spacing:.08em;padding:1px 5px;margin-top:3px}
.tk-timer{height:4px;background:var(--paper-line);margin:5px 0 3px;overflow:hidden}
.tk-timer i{display:block;height:100%;background:var(--paper-ink);transform-origin:left}
.tk.hot .tk-timer i{background:var(--danger)}
.row{display:flex;align-items:center;gap:6px;width:100%;min-height:38px;padding:3px;border:0;border-top:1px dashed var(--paper-line);background:none;color:inherit;text-align:left;cursor:pointer}
.sz{flex:none;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font:700 11px var(--mono)}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm b{font:600 15px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font:500 10px var(--mono);color:var(--paper-mute);white-space:nowrap}
.pips{display:flex;gap:2px;flex:none}
.pips em{font:700 9px var(--mono);font-style:normal;width:15px;height:15px;display:grid;place-items:center;border:1.5px solid var(--paper-line);color:var(--paper-mute);border-radius:3px}
.pips em.cur{border-color:var(--kd);color:var(--kd)}
.pips em.dn{background:var(--kd);border-color:var(--kd);color:#fff}
.row.s-brew,.row.s-stage{opacity:.65}
.row.s-ready{background:#ffe7a6}
.row.s-shelf{opacity:.4}
.row.s-shelf .nm b{text-decoration:line-through}
.row.sel{background:#e3dfd2;box-shadow:inset 0 0 0 2px var(--paper-ink)}

/* Alerts + view tabs */
#alerts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;flex:none;pointer-events:none}
#alerts:empty{display:none}
.alert{pointer-events:auto;background:var(--amber);color:#1c1503;border:0;border-radius:18px;padding:7px 14px;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;animation:bob .7s infinite alternate;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.alert.cool{background:var(--glass2);color:var(--ink);border:1px solid var(--line);animation:none}
@keyframes bob{to{transform:translateY(-3px)}}
#views{display:none!important;flex:none;align-self:center;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:100%}
#views button{border:0;background:none;border-radius:10px;padding:9px 16px;font:700 16px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
#views button[aria-selected="true"]{background:var(--ink);color:#111}

/* World tags */
.tag{position:absolute;left:0;top:0;will-change:transform}
.tag>.in{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.bub{background:#fffdf7;color:#1d211e;font:600 15px/1.15 var(--display);padding:6px 10px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35);position:relative;margin-bottom:9px;max-width:210px;width:max-content;text-align:center;animation:pop .2s ease-out}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fffdf7;border-bottom:0}
.bub.bad{background:#ff6c5c;color:#2a0905}.bub.bad::after{border-top-color:#ff6c5c}
.bub.good{background:#8fe3b0;color:#062a14}.bub.good::after{border-top-color:#8fe3b0}
.bub.ask{pointer-events:auto;cursor:pointer;background:var(--amber);color:#1c1503;animation:pop .2s ease-out,bob .7s .2s infinite alternate}
.bub.ask::after{border-top-color:var(--amber)}
.bub .pb{height:4px;border-radius:2px;background:rgba(0,0,0,.18);margin-top:4px;overflow:hidden}
.bub .pb i{display:block;height:100%;background:currentColor;transform-origin:left}
.bub small{display:block;font:500 11px var(--mono);opacity:.75;margin-top:1px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.wp{width:38px;height:6px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden;margin-bottom:6px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.wp i{display:block;height:100%;background:var(--go);transform-origin:left}
.wp.mid i{background:var(--amber)}.wp.low i{background:var(--danger)}
.mt{pointer-events:auto;cursor:pointer;font:600 12px var(--mono);background:rgba(10,16,14,.84);color:#fff;padding:3px 8px 4px;border-radius:8px;margin-bottom:4px;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:64px;box-shadow:0 3px 10px rgba(0,0,0,.35);white-space:nowrap}
.mt .mb{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.mt .mb i{display:block;height:100%;background:var(--kc);transform-origin:left}
.mt.ready{background:var(--amber);color:#1c1503;animation:bob .5s infinite alternate}
.mt.ready .mb i{background:#1c1503}
.mt.load{background:#fff;color:#111;animation:bob .6s infinite alternate}
.mt.idle{background:rgba(10,16,14,.6);color:var(--muted)}
.pop{font:700 24px var(--display);color:var(--go);text-shadow:0 2px 6px rgba(0,0,0,.7);white-space:nowrap;animation:rise 1.5s ease-out forwards}
.pop.tip small{font:600 14px var(--display);color:var(--amber);margin-left:4px}
.pop.free{color:var(--muted);font-size:18px}
@keyframes rise{0%{transform:translateY(8px);opacity:0}15%{opacity:1}100%{transform:translateY(-46px);opacity:0}}

#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:8;pointer-events:none;opacity:0;padding:7px 16px;border-radius:20px;font:700 18px var(--display);letter-spacing:.04em;background:var(--ink);color:#111;white-space:nowrap;max-width:92vw}
#toast.show{animation:toast 1.8s forwards}
#toast.bad{background:var(--danger);color:#1d0804}
#toast.good{background:var(--go);color:#07200f}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* Modals (receipt paper) */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,11,9,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rc{background:var(--paper);color:var(--paper-ink);font-family:var(--mono);width:100%;max-width:440px;max-height:100%;overflow-y:auto;padding:20px 20px 30px;touch-action:pan-y;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.rc.wide{max-width:560px}
.rc h1{margin:0;font:700 50px/.95 var(--display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.rc h2{margin:16px 0 4px;font:700 20px var(--display);letter-spacing:.1em;text-transform:uppercase}
.rc-sub{margin:6px 0 12px;font:400 12px/1.5 var(--mono);color:var(--paper-mute)}
.account-label{display:block;margin:10px 0 4px;font:600 12px var(--mono)}
.account-input{display:block;width:100%;padding:11px;border:1px solid var(--paper-line);border-radius:4px;background:#fff;color:var(--paper-ink);font:500 15px var(--mono);user-select:text;-webkit-user-select:text}
.account-error{min-height:1em;margin:8px 0 0;color:#a21c12;font:500 12px/1.4 var(--mono)}
.account-note{margin:10px 0 0;color:var(--paper-mute);font:400 11px/1.5 var(--mono)}
.account-note a{color:inherit}
.how{margin:0 0 12px;padding-left:20px;font:400 13px/1.45 var(--mono);display:flex;flex-direction:column;gap:6px}
.ln{display:flex;gap:6px;align-items:baseline;font:500 13px var(--mono);padding:2px 0}
.ln i{flex:1;border-bottom:2px dotted var(--paper-line);transform:translateY(-3px)}
.ln b{font-weight:600;font-variant-numeric:tabular-nums}
.ln.neg b{color:#b42318}.ln.pos b{color:#13703b}
.ln.tot{font-size:15px;border-top:2px solid var(--paper-ink);margin-top:6px;padding-top:6px}
.big{font:700 60px/1 var(--display);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.flag{display:inline-block;background:var(--paper-ink);color:var(--paper);font:600 12px var(--mono);padding:2px 8px;letter-spacing:.08em;margin-bottom:6px}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:6px;background:var(--paper-ink);color:var(--paper);font:700 21px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;color:var(--paper-ink);border:2px solid var(--paper-ink)}
.btns{display:flex;gap:8px;margin-top:14px}.btns .btn{margin-top:0}
.mtabs{display:flex;gap:4px;margin:10px 0 4px;border-bottom:2px solid var(--paper-ink);overflow-x:auto}
.mtabs button{border:0;background:none;padding:7px 10px;font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--paper-mute);cursor:pointer;white-space:nowrap}
.mtabs button[aria-selected="true"]{background:var(--paper-ink);color:var(--paper)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cashbig{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;color:#13703b}
.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px dashed var(--paper-line)}
.stxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.stxt b{font:600 17px/1.05 var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.stxt small{font:400 11px/1.45 var(--mono);color:var(--paper-mute)}
.kb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--kc);color:#14110a;font:700 11px var(--mono);flex:none}
.buy{flex:none;min-width:78px;padding:8px 10px;border:0;border-radius:5px;background:var(--paper-ink);color:var(--paper);font:700 18px var(--display);letter-spacing:.04em;cursor:pointer;font-variant-numeric:tabular-nums}
.buy[data-poor]{background:#cfccbf;color:#767b74}
.buy:disabled{background:none;color:var(--paper-mute);border:1.5px solid var(--paper-line);cursor:default;font-size:15px}
.buy.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.best{margin:10px 0 0;font:500 12px var(--mono);color:var(--paper-mute);text-align:center}

#banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;text-align:center;opacity:0;width:max-content;max-width:92vw}
#banner b{display:block;font:700 66px/.95 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--amber);text-shadow:0 4px 0 #6a3d00,0 12px 30px rgba(0,0,0,.6)}
#banner small{display:block;font:600 15px var(--mono);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9);margin-top:8px}
#banner.hot b{color:#ff8a52;text-shadow:0 4px 0 #6b1d05,0 12px 30px rgba(0,0,0,.6)}
#banner.good b{color:var(--go);text-shadow:0 4px 0 #0c4a26,0 12px 30px rgba(0,0,0,.6)}
#banner.show{animation:bnr 2.3s forwards}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-75%)}}
.vip{font:700 11px var(--mono);letter-spacing:.12em;background:#141416;color:var(--amber);border:1.5px solid var(--amber);padding:2px 8px;border-radius:10px;margin-bottom:4px;white-space:nowrap;box-shadow:0 0 12px rgba(255,197,66,.5)}
.goalrow{display:flex;gap:8px;font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
.goalrow .ok{color:var(--go)}.goalrow .stk{color:var(--amber)}.goalrow .rush{color:#ff8a52}
.dbar.rush i{background:repeating-linear-gradient(45deg,#ff7a4a 0 6px,#ffc542 6px 12px)}
@media (max-width:520px){
  #banner b{font-size:44px}
  .cash b{font-size:22px}
  .dayb{min-width:0;gap:3px}
  .dayrow{flex-direction:column;align-items:flex-start;gap:1px}
  #clock{font-size:11px}
  #ratev{display:none}
  .hl{gap:6px}
  .dayrow b{font-size:16px;white-space:nowrap}
  .card{padding:5px 9px}
  .cash .emp{display:none}
  .pill-b{padding:7px 9px;font-size:13px}
  .icon-b{width:36px;height:36px}
  #views button{padding:8px 11px;font-size:14px}
  .tk{flex-basis:146px}
  .rc h1{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="scene"></div>
<div id="tags"></div>
<div id="ui">
  <header id="hud">
    <div class="hl">
      <div class="card cash"><small>Cash</small><b id="cash">$0</b><span class="emp" id="emp"></span></div>
      <div class="card dayb">

    mk(new T.SphereGeometry(rt*1.02,18,8,0,Math.PI*2,0,Math.PI/2),MAT.plastic,0,h,0,lid,true).scale.y=.45;
    var straw=cyl(.006,.006,h*.9,std({color:0x2f8a5a,roughness:.5}),.012,h*.95,0,lid,8);straw.rotation.z=-.12;

var puffs=[];
for(var pi=0;pi<160;pi++){
  var sp=new T.Sprite(new T.SpriteMaterial({map:steamTex,transparent:true,depthWrite:false,opacity:0}));
  sp.visible=false;scene.add(sp);puffs.push({s:sp,life:0,max:1,vel:V3(0,0,0),s0:.05,s1:.2,a:.5});
}
var puffI=0;
function puff(pos,o){
  o=o||{};
  var p=puffs[puffI];puffI=(puffI+1)%puffs.length;
  p.s.position.set(pos.x+rnd(-.02,.02),pos.y,pos.z+rnd(-.02,.02));
  p.vel.set(rnd(-.04,.04),o.up||rnd(.22,.38),rnd(-.04,.04));
  p.max=o.life||rnd(1,1.5);p.life=p.max;p.s0=o.s0||.04;p.s1=o.s1||.2;p.a=o.a||.55;
  p.s.material.color.setHex(o.color||0xffffff);p.s.visible=true;
}
function updPuffs(dt){
  for(var i=0;i<puffs.length;i++){
    var p=puffs[i];if(p.life<=0)continue;
    p.life-=dt;if(p.life<=0){p.s.visible=false;continue;}
    var k=1-p.life/p.max;
    p.s.position.addScaledVector(p.vel,dt);p.vel.x*=.98;
    var sz=lerp(p.s0,p.s1,k);p.s.scale.set(sz,sz,sz);
    p.s.material.opacity=p.a*Math.sin(Math.PI*Math.min(1,k*1.4));
  }
}

var bills=[];
var billMat=new T.MeshStandardMaterial({map:billTex,roughness:.7,side:T.DoubleSide});

for(var bi=0;bi<24;bi++){var bm=new T.Mesh(billGeo,billMat);bm.visible=false;scene.add(bm);bills.push({m:bm,t:0,dur:1,from:V3(0,0,0),to:V3(0,0,0),spin:0});}
var billI=0;
function throwBills(from,to,n){
  for(var i=0;i<n;i++){
    var b=bills[billI];billI=(billI+1)%bills.length;
    b.from.copy(from).add(V3(rnd(-.1,.1),rnd(0,.1),rnd(-.05,.05)));b.to.copy(to).add(V3(rnd(-.12,.12),0,rnd(-.06,.06)));
    b.t=-i*.12;b.dur=rnd(.6,.8);b.spin=rnd(6,12);b.m.visible=false;
  }
}
function updBills(dt){
  bills.forEach(function(b){
    if(b.t>=b.dur+.6||b.dur===0)return;
    b.t+=dt;if(b.t<0)return;
    b.m.visible=true;
    var k=Math.min(1,b.t/b.dur);
    b.m.position.lerpVectors(b.from,b.to,ease(k));b.m.position.y+=Math.sin(k*Math.PI)*.45;
    b.m.rotation.set(-Math.PI/2+Math.sin(b.t*b.spin)*.6,b.t*b.spin*.4,0);
    if(b.t>b.dur+.5){b.m.visible=false;b.dur=0;}
  });
}

var flights=[];
function fly(obj,to,dur,arc,done){
  stopFly(obj);
  flights.push({o:obj,from:obj.position.clone(),to:to.clone(),dur:dur,t:0,arc:arc,done:done});
}
function stopFly(obj){for(var i=flights.length-1;i>=0;i--)if(flights[i].o===obj)flights.splice(i,1);}
function updFlights(dt){
  for(var i=flights.length-1;i>=0;i--){
    var f=flights[i];f.t+=dt;var k=Math.min(1,f.t/f.dur),e=ease(k);
    f.o.position.lerpVectors(f.from,f.to,e);f.o.position.y+=Math.sin(k*Math.PI)*f.arc;
    if(k>=1){flights.splice(i,1);if(f.done)f.done();}
  }
}

function popIn(obj){obj.scale.setScalar(.01);pops.push({o:obj,t:0});}

function stream(color,r){
  var g=new T.CylinderGeometry(r||.006,r||.006,1,8);g.translate(0,-.5,0);
  var m=new T.Mesh(g,std({color:color,roughness:.2}));m.visible=false;return m;
}
function lampMat(){return new T.MeshStandardMaterial({color:0x111111,emissive:0x2d7a55,emissiveIntensity:1.2});}
function setLamp(mat,st,time){
  if(st==='brew'){mat.emissive.setHex(0x42b8ff);mat.emissiveIntensity=1.2+Math.sin(time*10)*.9;}
  else if(st==='ready'){mat.emissive.setHex(0xffb020);mat.emissiveIntensity=2.2;}
  else{mat.emissive.setHex(0x2d7a55);mat.emissiveIntensity=.8;}
}
function gauge(parent,x,y,z,r){
  var gg=new T.Group();gg.position.set(x,y,z);parent.add(gg);
  var bz=cyl(r,r,.02,MAT.chrome,0,0,0,gg,24);bz.rotation.x=Math.PI/2;
  var face=mk(new T.CircleGeometry(r*.82,24),MAT.white,0,0,.011,gg,true);
  var nd=new T.Group();nd.position.z=.013;gg.add(nd);
  box(.004,r*.75,.002,std({color:0xb3261e}),0,r*.3,0,nd,true);
  nd.rotation.z=1;return nd;
}

var eyeMat=std({color:0x161210,roughness:.3});
function makePerson(o){
  o=o||{};
  var root=new T.Group();
  var skin=std({color:o.skin||pick(SKIN),roughness:.6});
  var shirt=std({color:o.shirt||pick(SHIRT),roughness:.8});
  var pants=std({color:o.pants||pick(PANTS),roughness:.85});
  var hairM=std({color:o.hair||pick(HAIR),roughness:.7});
  var hips=new T.Group();hips.position.y=.88;root.add(hips);
  var legs=[-1,1].map(function(s){var p=new T.Group();p.position.set(s*.09,0,0);hips.add(p);mk(GEO.leg,pants,0,-.42,0,p);mk(GEO.shoe,MAT.rubber,0,-.84,.04,p);return p;});
  mk(GEO.torso,shirt,0,-.04,0,hips);
  var head=new T.Group();head.position.y=.62;hips.add(head);
  mk(GEO.neck,skin,0,.02,0,head);mk(GEO.head,skin,0,.16,0,head);
  mk(GEO.eye,eyeMat,-.047,.18,.122,head,true);mk(GEO.eye,eyeMat,.047,.18,.122,head,true);
  var style=o.style||pick(['short','short','long','bun','bald','cap','beanie','curly']);
  if(style==='short'||style==='long'||style==='bun'||style==='curly'){var hc=mk(GEO.hairCap,hairM,0,.17,-.012,head);hc.rotation.x=-.25;}
  if(style==='long'){box(.26,.3,.08,hairM,0,.05,-.09,head);}
  if(style==='bun'){mk(GEO.bun,hairM,0,.3,-.08,head);}
  if(style==='curly'){for(var i=0;i<7;i++){var a=i/7*Math.PI*2;mk(GEO.bun,hairM,Math.cos(a)*.11,.24+Math.random()*.04,Math.sin(a)*.1-.02,head).scale.setScalar(.75);}}
  if(style==='cap'){var cc=std({color:o.capColor||pick(SHIRT),roughness:.6});mk(GEO.capTop,cc,0,.18,0,head);var br=box(.2,.015,.13,cc,0,.19,.16,head);br.rotation.x=.12;}
  if(style==='beanie'){var bc=std({color:pick(SHIRT),roughness:.9});mk(GEO.capTop,bc,0,.19,0,head).scale.set(1.02,1.15,1.02);}
  var arms=[-1,1].map(function(s){var p=new T.Group();p.position.set(s*.255,.5,0);hips.add(p);mk(GEO.sleeve,shirt,0,-.14,0,p);mk(GEO.fore,skin,0,-.41,0,p);mk(GEO.hand,skin,0,-.57,0,p);return p;});
  var hand=new T.Object3D();hand.position.set(0,-.6,.04);arms[1].add(hand);
  if(o.apron){
    var ap=std({color:o.apron,roughness:.85});
    box(.36,.5,.02,ap,0,.18,.215,hips);box(.36,.03,.02,ap,0,.42,.2,hips);
  }
  var hit=new T.Mesh(GEO.hit,MAT.hit);hit.position.y=.9;root.add(hit);
  return {root:root,hips:hips,legs:legs,arms:arms,head:head,hand:hand,hit:hit,phase:Math.random()*6,yaw:0,sit:false,hold:false,work:false};
}
function animPerson(p,dt,speed,time){
  p.phase+=dt*speed*5.4;
  var a=Math.min(1,speed/1.2)*.6,s=Math.sin(p.phase);
  if(p.sit){
    p.legs[0].rotation.x=p.legs[1].rotation.x=-1.5;p.hips.position.y=.5;
    p.arms[0].rotation.x=-.5;p.arms[1].rotation.x=p.hold?-1.1:-.5;
  }else{
    p.legs[0].rotation.x=s*a;p.legs[1].rotation.x=-s*a;
    p.hips.position.y=.88+Math.abs(Math.cos(p.phase))*.03*Math.min(1,a*2)+Math.sin(time*2+p.phase)*.004;
    if(p.work){p.arms[0].rotation.x=-1.0+Math.sin(time*9)*.15;p.arms[1].rotation.x=-1.0+Math.cos(time*9)*.15;}
    else{p.arms[0].rotation.x=-s*a*.8;p.arms[1].rotation.x=p.hold?-1.05:s*a*.8;}
  }
  p.head.rotation.y=p.look||0;
}

var SAVEKEY='crema-tycoon-v1';
function defState(){return {v:1,day:1,cash:60,rating:3.5,lvl:1,mach:['E','D'],spd:{E:0,M:0,D:0,C:0},cashiers:0,baristas:0,cTrain:0,bTrain:0,locs:{},served:0,earned:0};}
var G=defState();
var cloudSave={db:null,uid:null,auth:null,account:null,storeModule:null,write:null,enabled:false,chain:Promise.resolve(),lastWrite:0};
var saveErrorShown=false,cloudErrorShown=false;
var LEGACY_MIGRATION_KEY=SAVEKEY+'-migrated';
function localSaveKey(){return cloudSave.uid?SAVEKEY+'-'+cloudSave.uid:SAVEKEY;}
function validSave(s){
  return !!(s&&s.v===1&&Array.isArray(s.mach)&&s.mach.length>0&&s.mach.length<=LEVELS[3].slots
    &&s.mach.every(function(k){return !!KIND[k];})
    &&typeof s.day==='number'&&isFinite(s.day)&&s.day>=1&&typeof s.cash==='number'&&isFinite(s.cash)
    &&typeof s.rating==='number'&&isFinite(s.rating)&&s.rating>=1&&s.rating<=5
    &&typeof s.lvl==='number'&&isFinite(s.lvl)&&s.lvl>=1&&s.lvl<=3
    &&typeof s.cashiers==='number'&&isFinite(s.cashiers)&&s.cashiers>=0&&s.cashiers<=3
    &&typeof s.baristas==='number'&&isFinite(s.baristas)&&s.baristas>=0&&s.baristas<=4
    &&typeof s.cTrain==='number'&&isFinite(s.cTrain)&&s.cTrain>=0&&s.cTrain<=3
    &&typeof s.bTrain==='number'&&isFinite(s.bTrain)&&s.bTrain>=0&&s.bTrain<=3
    &&typeof s.served==='number'&&isFinite(s.served)&&s.served>=0
    &&typeof s.earned==='number'&&isFinite(s.earned)&&s.earned>=0
    &&s.spd&&typeof s.spd==='object'&&!Array.isArray(s.spd)
    &&['E','M','D','C'].every(function(k){return typeof s.spd[k]==='number'&&isFinite(s.spd[k])&&s.spd[k]>=0&&s.spd[k]<=3;})
    &&Object.keys(s.spd).every(function(k){return !!KIND[k];})
    &&s.locs&&typeof s.locs==='object'&&!Array.isArray(s.locs)
    &&Object.keys(s.locs).every(function(k){
      return ['kiosk','midtown','airport','roastery'].indexOf(k)>=0
        &&typeof s.locs[k]==='number'&&isFinite(s.locs[k])&&s.locs[k]>=0&&s.locs[k]<=3;
    }));
}
function readLocalSave(key){
  try{
    var raw=localStorage.getItem(key||localSaveKey());
    if(!raw)return null;
    var s=JSON.parse(raw);
    if(validSave(s))return s;
    console.warn('Saved Crema Tycoon data is invalid; starting a new café.');
  }catch(e){console.error('Unable to load the saved Crema Tycoon game.',e);}
  return null;
}
function migrateLocalSave(uid){
  try{
    if(localStorage.getItem(LEGACY_MIGRATION_KEY))return;
    var legacy=readLocalSave(SAVEKEY);
    if(legacy)localStorage.setItem(SAVEKEY+'-'+uid,JSON.stringify(legacy));
    localStorage.setItem(LEGACY_MIGRATION_KEY,'1');
  }catch(e){console.error('Unable to migrate the existing local café save.',e);}
}
async function connectCloudSave(){
  var accountModule=await import('./account.js');
  var account=await accountModule.connectCremaAccount(window.CARZZY_FIREBASE_CONFIG,modal,window.location.pathname);
  var storeModule=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
  var user=account.user,db=account.db;
  cloudSave.auth=account.auth;cloudSave.account=account;cloudSave.storeModule=storeModule;cloudSave.uid=user.uid;
  migrateLocalSave(user.uid);
  var saveRef=storeModule.doc(db,'cremaTycoonSaves',user.uid);
  var snapshot=await storeModule.getDoc(saveRef);
  cloudSave.db=db;cloudSave.uid=user.uid;
  cloudSave.write=function(state){
    return storeModule.setDoc(saveRef,{state:state,updatedAt:storeModule.serverTimestamp()});
  };
  cloudSave.enabled=true;
  if(snapshot.exists()){
    var saved=snapshot.data().state;
    if(validSave(saved))return saved;
    console.warn('Saved Crema Tycoon cloud data is invalid; using this device’s save.');
  }
  cloudSave.lastWrite=Date.now();
  return null;
}
function save(forceCloud){
  var saved=true;
  try{
    localStorage.setItem(localSaveKey(),JSON.stringify(G));
    saveErrorShown=false;
  }catch(e){
    saved=false;
    if(!saveErrorShown){
      saveErrorShown=true;
      console.error('Unable to save the Crema Tycoon game to this device.',e);
      if(!document.hidden)toast('Could not save your café on this device','bad');
    }
  }
  if(cloudSave.enabled&&(forceCloud!==false||Date.now()-cloudSave.lastWrite>=15000)){
    cloudSave.lastWrite=Date.now();
    var state=JSON.parse(JSON.stringify(G));
    queueCloudSave(state);
  }
  return saved;
}
function queueCloudSave(state){
  cloudSave.chain=cloudSave.chain.then(function(){
    return cloudSave.write(state);
  }).then(function(){
    cloudErrorShown=false;
  }).catch(function(e){
    if(!cloudErrorShown){
      cloudErrorShown=true;
      console.error('Unable to save the Crema Tycoon game to Firestore.',e);
      if(!document.hidden)toast('Cloud save failed; your café is saved on this device','bad');
    }
  });
}

function stepMove(o,dt,spd){

  var tg=o.path[0],dx=tg.x-o.pos.x,dz=tg.z-o.pos.z,d=Math.hypot(dx,dz),st=spd*dt;
  if(d<=st||d<.001){o.pos.x=tg.x;o.pos.z=tg.z;o.path.shift();}
  else{o.pos.x+=dx/d*st;o.pos.z+=dz/d*st;}
  if(d>.02)o.yawT=Math.atan2(dx,dz);

function chest(c){return V3(c.pos.x,1.25,c.pos.z);}
var HAPPY=['Thanks!','Smells amazing.','Perfect, thank you!','You\'re the best.','Exactly right.'];
var GRUMBLE=['That took forever.','Finally...','Long wait for a coffee.','Not my best morning.'];
function pay(c){
  var o=c.o,mood=clamp(c.pat/c.patMax,0,1),base=0;
  o.items.forEach(function(it){base+=priceOf(it);});
  o.items.forEach(function(it,i){

  }else{

    G.cash+=base+tip;R.st.rev+=base;R.st.tips+=tip;G.earned+=base+tip;R.st.happy++;

    say(c,c.vip?pick(['Five stars.','I\'ll write about this.','Remarkable crema.']):pick(HAPPY),'good',2.2);
    popAt(chest(c),'+'+money(base)+(tip>0?'<small>+'+money(tip)+' tip</small>':''),'tip');
    throwBills(chest(c),counter,tip>.9?3:2);sfx.cash();
  }
  if(!o.remake){R.st.served++;G.served++;if(R.st.served===R.goal){banner('Daily goal hit','+'+money(goalBonus())+' at closing','good');sfx.buy();}}

}

function walkout(c,inQueue){
  if(inQueue){var qi=R.queue.indexOf(c);if(qi>=0)R.queue.splice(qi,1);G.rating=clamp(G.rating-.07,1,5);}
  else{if(c.o)cancelOrder(c.o);freeWait(c);G.rating=clamp(G.rating-(c.o&&c.o.remake?.15:.12),1,5);}
  R.st.walk++;breakStreak();shake(.18);
  say(c,pick(inQueue?['Forget it.','This line isn\'t moving.','I\'ll go elsewhere.']:['I\'m out.','Never mind the coffee.','Forget it.']),'bad',2.8);
  sfx.bad();c.angry=true;leave(c);

function updCustomers(dt,time){
  R.queue.forEach(function(c,i){
    if(c.qi!==i){c.qi=i;var spot=L.queue[i].clone();c.path=c.inside?[spot]:[L.door.clone(),spot];}
  });
  R.customers.slice().forEach(function(c){
    stepMove(c,dt,c.speed);
    if(!c.inside&&c.pos.x<5.6)c.inside=true;
    switch(c.state){
      case 'queue':c.pat-=dt;c.face=Math.PI;if(c.pat<=0)walkout(c,true);break;
      case 'ordering':c.t-=dt;if(c.t<=0)goWait(c,true);break;
      case 'wait':c.pat-=dt;if(orderDone(c.o))goPickup(c);else if(c.pat<=0)walkout(c,false);break;
      case 'pickup':if(!c.path.length){c.state='paying';c.t=.55;}break;
      case 'paying':c.t-=dt;if(c.t<=0)pay(c);break;
      case 'sendback':c.t-=dt;if(c.t<1.6)c.face=Math.PI;if(c.t<=0)doSendBack(c);break;
      case 'toSeat':if(!c.path.length){c.state='sit';c.v.sit=true;c.t=rnd(8,16);c.face=c.seat.yaw;}break;
      case 'sit':c.t-=dt;c.face=c.seat?c.seat.yaw:c.face;
        if(c.cupHeld&&Math.random()<dt*.8){c.v.hand.getWorldPosition(tmpV);puff(tmpV.add(V3(0,.15,0)),{s0:.02,s1:.09,a:.35,life:.9});}
        if(c.t<=0){if(c.seat){c.seat.taken=null;c.seat=null;}leave(c);}break;
      case 'leave':if(!c.path.length)removeCustomer(c);break;
    }
    if(c.bubT>0){c.bubT-=dt;if(c.bubT<=0)c.bub=null;}
    var ty=c.moving?c.yawT:c.face;turnTo(c,ty,dt);
    var sitOff=0;
    if(c.state==='sit'&&c.seat){c.pos.x=c.seat.pos.x;c.pos.z=c.seat.pos.z;sitOff=-.02;}

function updCashier(dt,time){
  var c=R.queue[0],busy=false;
  R.cashFull=false;
  if(G.cashiers>0&&c&&c.qi===0&&!c.path.length&&c.state==='queue'){
    var open=R.orders.filter(function(o){return !o.remake;}).length;
    if(open<cashierCap()){R.cashT+=dt;busy=true;if(R.cashT>=cashierTime())takeOrder(c);}
    else R.cashFull=true;
  }else R.cashT=0;
  STAFF.cashiers.forEach(function(s,i){s.v.look=i===0&&busy?Math.sin(time*2.5)*.25:0;s.v.root.rotation.y=0;animPerson(s.v,dt,0,time);});

function validTask(t){
  if(t.type==='collect')return t.m.st==='ready';
  return t.m.st==='idle'&&t.it.st==='wait'&&R.orders.indexOf(t.it.o)>=0&&need(t.it)===t.m.k;
}
function releaseTask(b){var t=b.task;if(!t)return;if(t.m.claim===b)t.m.claim=null;if(t.it&&t.it.claim===b)t.it.claim=null;b.task=null;}
function findTask(b){
  var best=null,bd=1e9;
  MR.forEach(function(m){if(m.st==='ready'&&!m.claim){var d=Math.abs(m.wx-b.pos.x);if(d<bd){bd=d;best={type:'collect',m:m};}}});
  if(best)return best;
  var bs=1e9;
  MR.forEach(function(m){
    if(m.st!=='idle'||m.claim)return;
    var it=mostUrgent(m.k,true);if(!it)return;
    var c=it.o.c,f=c&&c.state==='wait'?c.pat/c.patMax:1,sc=f+Math.abs(m.wx-b.pos.x)*.02;
    if(sc<bs){bs=sc;best={type:'load',m:m,it:it};}
  });
  return best;
}
function updBaristas(dt,time){
  STAFF.baristas.forEach(function(b){
    if(b.task&&!validTask(b.task))releaseTask(b);
    if(!b.task&&R&&R.phase!=='done'){
      var t=findTask(b);
      if(t){b.task=t;t.m.claim=b;if(t.it)t.it.claim=b;b.path=[V3(t.m.wx,0,L.lane)];b.t=0;}
    }
    if(!b.task&&!b.path.length&&Math.hypot(b.pos.x-b.home.x,b.pos.z-b.home.z)>.1)b.path=[b.home.clone()];
    stepMove(b,dt,baristaSpeed());
    var working=b.task&&!b.path.length;
    if(working){b.t+=dt;if(b.t>=baristaAct()){var t2=b.task;releaseTask(b);if(validTask(t2)){if(t2.type==='collect')collect(t2.m);else loadItem(t2.m,t2.it);}}}
    b.v.work=!!working;
    turnTo(b,b.moving?b.yawT:0,dt);
    b.v.root.position.set(b.pos.x,0,b.pos.z);b.v.root.rotation.y=b.yaw;
    animPerson(b.v,dt,b.moving?baristaSpeed():0,time);
  });
}

/* ---------- purchases ---------- */
function goalBonus(){return 15+G.day*10;}
function spend(c){if(G.cash<c)return false;G.cash-=c;return true;}
function slotsFree(){return LEVELS[G.lvl].slots-G.mach.length;}
function machCost(k){var n=G.mach.filter(function(q){return q===k;}).length;return Math.round(KIND[k].cost*(1+.6*n));}
function spdCost(k){return Math.round(KIND[k].spd*(G.spd[k]+1)*1.4);}
function hireCost(r){return r==='cashier'?80+70*G.cashiers:160+110*G.baristas;}
function trainCost(r){return (r==='cashier'?90:120)*((r==='cashier'?G.cTrain:G.bTrain)+1);}
function locUpCost(l){return Math.round(l.cost*.5*((G.locs[l.id]||0)+1));}
function doBuy(id){
  var p=id.split(':'),t=p[0],a=p[1],cost;
  if(t==='mach'){if(slotsFree()<=0)return 'room';cost=machCost(a);if(!spend(cost))return 'cash';G.mach.push(a);var m=addMachineView(a,G.mach.length-1);popIn(m.g);drawMenu();}
  else if(t==='spd'){if(G.spd[a]>=3)return 'max';cost=spdCost(a);if(!spend(cost))return 'cash';G.spd[a]++;}
  else if(t==='hire'){var mx=a==='cashier'?3:4,cur=a==='cashier'?G.cashiers:G.baristas;if(cur>=mx)return 'max';cost=hireCost(a);if(!spend(cost))return 'cash';if(a==='cashier')G.cashiers++;else G.baristas++;syncStaff();}
  else if(t==='train'){var lv=a==='cashier'?G.cTrain:G.bTrain;if(lv>=3)return 'max';cost=trainCost(a);if(!spend(cost))return 'cash';if(a==='cashier')G.cTrain++;else G.bTrain++;}
  else if(t==='expand'){if(G.lvl>=3)return 'max';cost=LEVELS[G.lvl+1].cost;if(!spend(cost))return 'cash';G.lvl++;buildRoom(G.lvl);if(R)R.wocc=R.wocc.length===L.wait.length?R.wocc:L.wait.map(function(){return null;});camFit();}
  else if(t==='loc'){var l=LOCS.filter(function(q){return q.id===a;})[0];if(G.locs[a]!=null)return 'max';if(!spend(l.cost))return 'cash';G.locs[a]=0;}
  else if(t==='locup'){var l2=LOCS.filter(function(q){return q.id===a;})[0];if(G.locs[a]==null||G.locs[a]>=3)return 'max';if(!spend(locUpCost(l2)))return 'cash';G.locs[a]++;}
  save();sfx.buy();
  return 'ok';
}

/* ---------- music: a soft café loop ---------- */
var musicOn=true,mus={gain:null,timer:0,next:0,step:0};
var CHORDS=[[53,57,60,64],[50,53,57,60],[55,58,62,65],[48,52,55,58]];
var SCALE=[60,62,65,67,69,72,74,77];
function mtof(n){return 440*Math.pow(2,(n-69)/12);}
function noiseBuf(){var b=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
var nbuf=null;
function mnote(f,t,d,type,v,dest){
  var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
function hat(t,v){
  if(!nbuf)nbuf=noiseBuf();
  var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nbuf;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.07);
  s.connect(f);f.connect(g);g.connect(mus.gain);s.start(t);s.stop(t+.1);
}
function musicTick(){
  if(!ac||!mus.gain)return;
  var beat=60/84/2;
  while(mus.next<ac.currentTime+.4){
    var t=mus.next,st=mus.step,bar=Math.floor(st/8)%4,ch=CHORDS[bar],pos=st%8;
    if(pos===0)ch.forEach(function(n){mnote(mtof(n),t,beat*7.5,'triangle',.022,mus.lp);});
    if(pos===0||pos===4)mnote(mtof(ch[0]-24),t,beat*3,'sine',.07,mus.gain);
    if(pos===6&&Math.random()<.5)mnote(mtof(ch[1]-12),t,beat*1.5,'sine',.045,mus.gain);
    hat(t,pos%2?.006:.012);
    if(Math.random()<.28)mnote(mtof(pick(SCALE)),t+(Math.random()<.5?0:beat*.5),beat*2.5,'sine',.022,mus.lp);
    mus.next+=beat;mus.step++;
  }
}
function startMusic(){
  if(!ac||mus.gain)return;
  mus.gain=ac.createGain();mus.gain.gain.value=musicOn&&!muted?1:0;
  mus.lp=ac.createBiquadFilter();mus.lp.type='lowpass';mus.lp.frequency.value=2200;mus.lp.connect(mus.gain);
  mus.gain.connect(ac.destination);mus.next=ac.currentTime+.1;
  mus.timer=setInterval(musicTick,120);
}

var FOV=40,HALF=Math.tan(FOV/2*Math.PI/180),occHidden=false;

var viewShift=0;
function viewDef(v){
  var tall=W/H<.8,lo=L.xL-.3,hi=L.xR+.3;
  if(tall)return {y:.4,z:1.4,dir:V3(0,.86,-.51),dist:11,w:9,lo:lo,hi:hi,cap:2.0};
  return {y:.35,z:-.9,dir:V3(0,.66,-.75),dist:12,w:Math.min(L.xR-L.xL+.6,14.5),lo:lo,hi:hi,cap:1.6};
}
function camLayout(v){
  var d=viewDef(v),a=W/H;
  var need=(d.w/2)/(HALF*a);
  var dist=Math.min(Math.max(d.dist,need),d.dist*(d.cap||1.75));
  var hv=dist*HALF*a;
  var lo=d.lo+hv,hi=d.hi-hv,mid=(d.lo+d.hi)/2;
  return {d:d,dist:dist,hv:hv,lo:lo,hi:hi,mid:mid};
}

  var r=cvs.getBoundingClientRect();
  ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var objs=MR.map(function(m){return m.hit;}).concat(R.customers.map(function(c){return c.v.hit;}));
  var hits=ray.intersectObjects(objs,false);
  for(var i=0;i<hits.length;i++){
    var u=hits[i].object.userData;
    if(u.cust){var c=u.cust;if(c.state==='queue'&&c.qi===0&&!c.path.length){tryTake(c);return;}continue;}
    if(u.mach){tapMachine(u.mach);return;}
  }
}
document.querySelectorAll('#views button').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v);});});
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(!modal.hidden){if(e.key==='Escape'&&(modalKind==='pause'||modalKind==='up'))closeModal();return;}
  if(e.key==='1')setView('front');else if(e.key==='2')setView('bar');else if(e.key==='3')setView('all');
  else if(e.key==='ArrowLeft'){pan[view]+=1.3;clampPan(view);}
  else if(e.key==='ArrowRight'){pan[view]-=1.3;clampPan(view);}
  else if(e.key==='u'||e.key==='U')showUpgrades();
  else if(e.key==='Escape'||e.key==='p'||e.key==='P')showPause();
});
document.addEventListener('visibilitychange',function(){if(document.hidden&&R&&R.phase!=='done'&&modal.hidden)showPause();});

/* ================= LIGHT OVER THE DAY ================= */
var skyC=new T.Color(),warm=new T.Color(0xffb27a),cool=new T.Color(0xfff0d8);
function dayLight(){
  var f=R?clamp(R.t/DAYLEN,0,1):.3,closing=R&&R.phase!=='open';
  if(f<.5)skyC.copy(SKY.morning).lerp(SKY.noon,f*2);else skyC.copy(SKY.noon).lerp(SKY.dusk,(f-.5)*2);
  if(closing)skyC.lerp(SKY.night,.55);
  scene.background.copy(skyC);scene.fog.color.copy(skyC);
  if(L.skyMat)L.skyMat.color.copy(skyC).multiplyScalar(1.1);
  var dusk=clamp((f-.6)/.4,0,1)+(closing?.4:0);
  sun.color.copy(cool).lerp(warm,clamp(dusk,0,1));
  sun.intensity=lerp(.95,.45,clamp(dusk,0,1));
  hemi.intensity=lerp(.36,.24,clamp(dusk,0,1));
  lamps.forEach(function(l){l.intensity=lerp(1.3,2,clamp(dusk,0,1));});
}

/* ================= FLOW ================= */
function resetWorld(){
  clearDay();
  STAFF.cashiers.concat(STAFF.baristas).forEach(function(s){peopleG.remove(s.v.root);});
  STAFF.cashiers=[];STAFF.baristas=[];
  buildRoom(G.lvl);rebuildMachines();syncStaff();drawMenu();camFit();
}
var musPaused=null;
function startDay(){
  startMusic();
  modal.hidden=true;modalKind=null;
  newDay();save();paused=false;hudC={};alertKey='';
  setView(view);
}
function demo(){
  for(var i=0;i<5;i++)spawnCustomer();
  R.queue.forEach(function(c,i){c.qi=i;c.pos.copy(L.queue[i]);c.inside=true;c.path=[];c.yaw=Math.PI;});
  for(var j=0;j<2;j++){var c=R.queue[0];takeOrder(c);goWait(c,true);var tg=c.path[c.path.length-1];c.pos.copy(tg);c.path=[];c.yaw=Math.PI;c.bub=null;}
  MR.forEach(function(m){
    var it=mostUrgent(m.k,false);
    if(it&&loadItem(m,it)){
      if(m.k==='D'||MR.indexOf(m)%2){m.left=0;m.st='ready';m.spoil=SPOIL*.7;m.it.st='ready';m.cup.setLevel(m.l1);}
      else{m.left=m.dur*.45;var p=1-m.left/m.dur;m.cup.setLevel(lerp(m.l0,m.l1,m.v.fill(p)));}
    }
  });
  R.customers.forEach(function(c){c.v.root.position.set(c.pos.x,0,c.pos.z);c.v.root.rotation.y=c.yaw;animPerson(c.v,0,0,0);});
  STAFF.cashiers.concat(STAFF.baristas).forEach(function(s){animPerson(s.v,0,0,0);});
  R.t=DAYLEN*.25;
  MR.forEach(function(m){m.v.update(m,0,m.st==='brew'?1-m.left/m.dur:m.st==='ready'?1:0);});
}

/* ================= LOOP ================= */
var last=performance.now(),simT=0,saveElapsed=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;
  if(!paused&&R&&R.phase!=='done'){
    simT+=dt;update(dt,simT);saveElapsed+=dt;
    if(saveElapsed>=5){saveElapsed=0;save(false);}
  }
  var vdt=paused?0:dt;
  updFlights(vdt);updPops(vdt);updPuffs(dt);updBills(dt);
  if(frameNo%20===0)measureShift();
  updCamera(dt);
  if(R)syncRail();
  renderHud();renderTags(dt);renderAlerts();
  dayLight();
  if(paused!==musPaused){musPaused=paused;syncMusic();}
  renderFrame(dt);
}
window.addEventListener('pagehide',save);

/* ================= INIT ================= */
async function initializeGame(){
  var s=defState(),localState=null;
  try{
    var cloudState=await connectCloudSave();
    localState=readLocalSave();
    if(cloudState)s=cloudState;
    else if(localState){s=localState;queueCloudSave(s);}
  }catch(e){
    console.error('Unable to connect to Crema Tycoon cloud saves; using this device’s save.',e);
    if(!cloudSave.uid){
      modal.innerHTML='<div class="rc"><h1>Username required</h1><p class="rc-sub">Sign in or create a username to play and save your progress.</p><p class="account-error" role="alert">Account access failed. Check your connection and try again.</p><button class="btn" type="button" id="retry-account">Try again</button></div>';
      modal.hidden=false;
      $('#retry-account').addEventListener('click',function(){window.location.reload();});
      return;
    }
    if(!cloudErrorShown){cloudErrorShown=true;toast('Cloud save unavailable; your café is saved on this device','bad');}
    localState=readLocalSave();
    if(localState)s=localState;
  }
  if(s){G=Object.assign(defState(),s);G.spd=Object.assign({E:0,M:0,D:0,C:0},s.spd||{});G.locs=s.locs||{};}
  buildRoom(G.lvl);rebuildMachines();syncStaff();drawMenu();
  newDay();demo();
  resize();
  setView('all');pan.all=W/H<.8?-.8:L.cx;
  camFit();updCamera(10);
  showStart(!!s&&(s.day>1||s.served>0));
  requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){drawMenu();setOpenSign(R?R.phase==='open':true);});
}
initializeGame();
})();
</script>
