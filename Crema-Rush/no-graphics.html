  <body>
    <style>
      /* Layout: one-screen shift. HUD on top, receipt rail of tickets always visible,
   swipeable station panels in the middle, station tabs with queue badges at the bottom. */
      :root {
        --bg: #0e1917;
        --panel: #16251f;
        --panel2: #1e312a;
        --line: #2c453c;
        --ink: #eaf1ec;
        --muted: #8ea79d;
        --paper: #f3f1ea;
        --paper-ink: #1c211e;
        --paper-mute: #6a706a;
        --paper-line: #d3d0c4;
        --amber: #ffc83d;
        --amber-soft: #ffe6a0;
        --danger: #ff5a47;
        --go: #7be0a4;
        --e: #d98a42;
        --m: #d8e6ee;
        --d: #b595ee;
        --c: #3fc1c9;
        --ed: #b25f17;
        --md: #4d7ea3;
        --dd: #7a55c9;
        --cd: #14868e;
        --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --steel: #a9b5ba;
        --steel2: #d0d9dc;
        --steeld: #66767c;
        --dk: #1b2825;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flow-root;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--display);
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        touch-action: manipulation;
      }
      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      [data-k="E"] {
        --kc: var(--e);
        --kd: var(--ed);
      }
      [data-k="M"] {
        --kc: var(--m);
        --kd: var(--md);
      }
      [data-k="D"] {
        --kc: var(--d);
        --kd: var(--dd);
      }
      [data-k="C"] {
        --kc: var(--c);
        --kd: var(--cd);
      }

      #game-shell {
        position: relative;
        z-index: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        height: min(76vh, 760px);
        height: min(76dvh, 760px);
        min-height: 400px;
        margin: 92px auto 16px;
        padding-inline: max(10px, env(safe-area-inset-left, 0px))
          max(10px, env(safe-area-inset-right, 0px));
      }
      #game-controls {
        position: relative;
        z-index: 21;
        display: flex;
        flex: none;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
      }
      .dashboard-link {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font: 600 12px var(--mono);
        text-decoration: none;
      }
      .dashboard-link:hover {
        border-color: var(--amber);
        color: var(--amber);
      }
      #fullscreen-toggle {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      #fullscreen-toggle:hover {
        border-color: var(--amber);
        color: var(--amber);
      }
      #fullscreen-toggle svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }
      #fullscreen-toggle .exit-icon,
      #fullscreen-toggle[aria-pressed="true"] .expand-icon {
        display: none;
      }
      #fullscreen-toggle[aria-pressed="true"] .exit-icon {
        display: block;
      }
      #app {
        flex: 1;
        height: auto;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
        min-width: 0;
      }
      #game-shell:fullscreen,
      #game-shell.fullscreen-fallback {
        width: 100%;
        height: 100%;
        max-width: none;
        min-height: 0;
        margin: 0;
        padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px;
        background: var(--bg);
      }
      #game-shell.fullscreen-fallback {
        position: fixed;
        z-index: 100;
        inset: 0;
      }

      /* HUD */
      #hud {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 10px;
        flex: none;
      }
      .score small {
        display: block;
        font: 600 12px var(--display);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .score b {
        display: block;
        font: 700 38px/1 var(--display);
        font-variant-numeric: tabular-nums;
      }
      .mid {
        text-align: center;
        font: 600 15px var(--display);
        letter-spacing: 0.08em;
        color: var(--muted);
        min-width: 0;
      }
      #clock {
        font: 600 22px/1.1 var(--mono);
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #streak {
        min-height: 18px;
        color: var(--amber);
        text-transform: uppercase;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #lives {
        display: flex;
        gap: 4px;
      }
      .life {
        width: 28px;
        height: 28px;
        color: var(--amber);
      }
      .life path:first-child {
        fill: currentColor;
      }
      .life .hnd {
        fill: none;
        stroke: currentColor;
        stroke-width: 8;
        stroke-linecap: round;
      }
      .life.lost {
        color: var(--muted);
        opacity: 0.55;
      }
      .life.lost path:first-child {
        fill: none;
        stroke: currentColor;
        stroke-width: 5;
      }
      .mute {
        background: none;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        padding: 3px 10px;
        font: 600 13px var(--display);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
      }
      .mute[aria-pressed="true"] {
        text-decoration: line-through;
        opacity: 0.6;
      }

      /* Ticket rail */
      #rail {
        flex: 0 0 36%;
        min-height: 196px;
        max-height: 270px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px 2px 6px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }
      #rail:empty::before {
        content: "Rail is clear. Next ticket is on its way.";
        align-self: center;
        color: var(--muted);
        font: 500 15px var(--mono);
        padding: 0 8px;
      }
      .tk {
        flex: 0 0 178px;
        background: var(--paper);
        color: var(--paper-ink);
        font-family: var(--mono);
        padding: 8px 8px 16px;
        position: relative;
        animation: feed 0.35s ease-out;
        -webkit-mask: conic-gradient(
            from -45deg at bottom,
            #0000,
            #000 1deg 89deg,
            #0000 90deg
          )
          50%/14px 100%;
        mask: conic-gradient(
            from -45deg at bottom,
            #0000,
            #000 1deg 89deg,
            #0000 90deg
          )
          50%/14px 100%;
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .tk.out {
        opacity: 0;
        transform: translateY(10px);
      }
      @keyframes feed {
        from {
          transform: translateY(-16px);
          opacity: 0;
        }
      }
      .tk-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .tk-top .no {
        font: 500 12px var(--mono);
        color: var(--paper-mute);
      }
      .tk-top .who {
        font: 700 18px var(--display);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .tk-timer {
        height: 5px;
        background: var(--paper-line);
        margin: 6px 0 4px;
        overflow: hidden;
      }
      .tk-timer i {
        display: block;
        height: 100%;
        background: var(--paper-ink);
        transform-origin: left;
      }
      .tk.hot .tk-timer i {
        background: var(--danger);
      }
      .tk.hot {
        animation:
          feed 0.35s ease-out,
          tick 1s 0.4s infinite;
      }
      @keyframes tick {
        50% {
          transform: translateY(-2px);
        }
      }
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        min-height: 42px;
        padding: 4px 4px;
        border: 0;
        border-top: 1px dashed var(--paper-line);
        background: none;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .sz {
        flex: none;
        width: 22px;
        height: 22px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 700 12px var(--mono);
      }
      .nm {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .nm b {
        font: 600 16px/1 var(--display);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nm small {
        font: 500 11px var(--mono);
        color: var(--paper-mute);
      }
      .pips {
        display: flex;
        gap: 3px;
        flex: none;
      }
      .pips em {
        font: 700 10px var(--mono);
        font-style: normal;
        width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        border: 1.5px solid var(--paper-line);
        color: var(--paper-mute);
        border-radius: 3px;
      }
      .pips em.cur {
        border-color: var(--kd);
        color: var(--kd);
      }
      .pips em.dn {
        background: var(--kd);
        border-color: var(--kd);
        color: #fff;
      }
      .row.s-brew {
        opacity: 0.6;
      }
      .row.s-ready {
        background: var(--amber-soft);
      }
      .row.s-ready .nm small {
        color: var(--paper-ink);
        font-weight: 600;
      }
      .row.s-done {
        opacity: 0.4;
      }
      .row.s-done .nm b {
        text-decoration: line-through;
      }
      .row.sel {
        background: #e5e2d6;
        box-shadow: inset 0 0 0 2px var(--paper-ink);
      }

      /* hint */
      #hint {
        flex: none;
        min-height: 20px;
        text-align: center;
        font: 600 15px var(--display);
        letter-spacing: 0.05em;
        color: var(--muted);
        text-transform: uppercase;
      }
      #hint b {
        color: var(--ink);
      }

      /* Stations */
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #panels {
        height: 100%;
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overscroll-behavior-x: contain;
      }
      #panels::-webkit-scrollbar {
        display: none;
      }
      .panel {
        flex: 0 0 100%;
        scroll-snap-align: start;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .p-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .p-head h2 {
        margin: 0;
        font: 700 30px/1 var(--display);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .p-sub {
        font: 500 13px var(--mono);
        color: var(--muted);
      }
      .kb {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        background: var(--kc);
        color: #14110a;
        font: 700 12px var(--mono);
        flex: none;
      }
      .mgrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 10px;
        align-content: start;
      }
      .mach {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 6px 12px;
        align-items: center;
        padding: 10px 12px;
        background: var(--panel2);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        text-align: left;
        cursor: pointer;
        min-height: 122px;
      }
      .mach.brew {
        border-color: var(--kc);
      }
      .mach.ready {
        border-color: var(--amber);
        background: #322f19;
        animation: glow 0.8s infinite alternate;
      }
      @keyframes glow {
        to {
          box-shadow: 0 0 0 3px rgba(255, 200, 61, 0.35);
        }
      }
      .mach.shake {
        animation: shake 0.35s;
      }
      @keyframes shake {
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }
      .mach.pulse {
        animation: glow 0.4s 3 alternate;
      }
      .art {
        width: 96px;
        height: 96px;
        overflow: visible;
      }
      .steel {
        fill: var(--steel);
      }
      .steel2 {
        fill: var(--steel2);
      }
      .steeld {
        fill: var(--steeld);
      }
      .dk {
        fill: var(--dk);
      }
      .glassf {
        fill: rgba(255, 255, 255, 0.13);
      }
      .vessel {
        fill: none;
        stroke: #dfe9e6;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .mach.ready .vessel {
        stroke: var(--amber);
        filter: drop-shadow(0 0 5px rgba(255, 200, 61, 0.85));
      }
      [data-k="E"] {
        --liq: #7a4423;
        --foam: #d9a463;
      }
      [data-k="M"] {
        --liq: #f6f1e7;
        --foam: #ffffff;
      }
      [data-k="D"] {
        --liq: #9a6128;
        --foam: transparent;
      }
      [data-k="C"] {
        --liq: #5a3a28;
        --foam: transparent;
      }
      .liq {
        fill: var(--liq);
      }
      .foam {
        fill: var(--foam);
      }
      .stream {
        fill: none;
        stroke: var(--liq);
        stroke-linecap: round;
        opacity: 0;
        stroke-width: 3.5;
        stroke-dasharray: 10 4;
      }
      [data-k="D"] .stream {
        stroke-width: 2.5;
        stroke-dasharray: 2 7;
      }
      [data-k="C"] .stream {
        stroke-width: 5;
        stroke-dasharray: 14 3;
      }
      .mach.brew .stream {
        opacity: 1;
        animation: flow 0.45s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -14;
        }
      }
      .lamp {
        fill: #46605a;
      }
      .mach.brew .lamp {
        fill: #52c7ff;
        animation: blink 0.6s infinite alternate;
      }
      .mach.ready .lamp {
        fill: var(--amber);
      }
      @keyframes blink {
        to {
          opacity: 0.3;
        }
      }
      .needle {
        stroke: #b3261e;
        stroke-width: 2;
        stroke-linecap: round;
        transform-origin: 26px 38px;
        transform: rotate(-50deg);
        transition: transform 0.8s;
      }
      .mach.brew .needle,
      .mach.ready .needle {
        transform: rotate(55deg);
      }
      .lever {
        transform-origin: 75px 74px;
        transition: transform 0.3s;
      }
      .mach.brew .lever {
        transform: rotate(-35deg);
      }
      .wisp {
        fill: none;
        stroke: #e9efe9;
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0;
      }
      .mach.ready .wisp,
      .mach.brew[data-k="M"] .wisp {
        animation: rise 1.4s infinite;
      }
      .mach .wisp.w2 {
        animation-delay: 0.35s;
      }
      .mach .wisp.w3 {
        animation-delay: 0.7s;
      }
      @keyframes rise {
        0% {
          opacity: 0;
          transform: translateY(5px);
        }
        50% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      .mach.brew[data-k="M"] .pitcher {
        animation: jig 0.12s infinite alternate;
      }
      @keyframes jig {
        to {
          transform: translateX(1.4px);
        }
      }
      .ice {
        fill: rgba(255, 255, 255, 0.28);
        stroke: rgba(255, 255, 255, 0.6);
        stroke-width: 1;
      }
      .lbl {
        font: 700 13px var(--display);
        letter-spacing: 0.14em;
        fill: #14201d;
      }
      .water {
        fill: #4fb1e6;
      }
      .m-txt {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .m-name {
        font: 600 13px var(--display);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .m-job {
        font: 700 22px/1.05 var(--display);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .m-time {
        font: 500 13px var(--mono);
        color: var(--muted);
      }
      .mach.ready .m-time {
        color: var(--amber);
        font-weight: 600;
      }
      .m-bar {
        grid-column: 1/-1;
        height: 6px;
        background: #0d1815;
        border-radius: 3px;
        overflow: hidden;
      }
      .m-bar i {
        display: block;
        height: 100%;
        background: var(--kc);
        transform-origin: left;
        transform: scaleX(0);
      }
      .mach.ready .m-bar i {
        background: var(--amber);
      }

      #toast {
        position: absolute;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        pointer-events: none;
        opacity: 0;
        z-index: 5;
        padding: 6px 16px;
        border-radius: 20px;
        font: 700 18px var(--display);
        letter-spacing: 0.05em;
        background: var(--ink);
        color: #0e1917;
        white-space: nowrap;
        max-width: 94%;
      }
      #toast.show {
        animation: toast 1.7s forwards;
      }
      #toast.bad {
        background: var(--danger);
        color: #1d0804;
      }
      #toast.good {
        background: var(--go);
        color: #07200f;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, -8px);
        }
        12%,
        80% {
          opacity: 1;
          transform: translate(-50%, 0);

                n: i + 1,

                oid: null,

          var id = S.nid++;
          var scale = Math.max(0.75, 1 - S.t / 1100000);
          var pat = (52000 + spec.length * 20000) * scale * (1 + 0.15 * S.pat);
          return {
            id: id,
            who: NAMES[Math.floor(Math.random() * NAMES.length)],
            pat: pat,
            left: pat,
            items: spec.map(function (p) {

          if (mx >= 3 && r > 0.9) n = 3;

        function serve(o) {
          var base = 0;
          o.items.forEach(function (it) {

          var bonus = Math.round(base * 0.6 * Math.max(0, o.left / o.pat));

          S.combo++;
          if (S.combo > S.maxCombo) S.maxCombo = S.combo;
          var cg = gain;
          S.score += gain;
          S.cash += cg;

            if (c.name !== nm) {
              e.name.textContent = nm;
              c.name = nm;
            }
            if (c.time !== time) {
              e.time.textContent = time;
              c.time = time;
            }
            var bw =
              m.st === "brew" ? p : m.st === "ready" ? m.spoil / SPOIL : 0;
            e.bar.style.transform =
              "scaleX(" + Math.max(0, bw).toFixed(3) + ")";
          });
        }
        function renderTabs() {
          var want = null;
          if (S.sel) {
            var o = ord(S.sel.oid);
            if (o) {
              var it = o.items[S.sel.i];
              if (it && it.st === "wait") want = need(it);
            }
          }
          KO.forEach(function (k, i) {
            var t = tabEls[k],
              st = S.stn[k],
              w = 0,
              r = 0;
            S.orders.forEach(function (o) {
              o.items.forEach(function (it) {
                if (it.st === "wait" && need(it) === k) w++;
              });
            });
            S.machines.forEach(function (m) {
              if (m.k === k && m.st === "ready") r++;
            });
            var poor = S.cash < OPENC[k];
            var key = [
              st.open ? 1 : 0,
              w,
              r,
              cur === i ? 1 : 0,
              want === k ? 1 : 0,
              poor ? 1 : 0,
            ].join("|");
            if (t.c.key === key) return;
            t.c.key = key;
            t.el.classList.toggle("shut", !st.open);
            panelEls[k].classList.toggle("closed", !st.open);
            if (!st.open) {
              t.w.hidden = false;
              t.w.textContent = "closed";
              t.r.hidden = true;
            } else {
              t.w.hidden = !w;
              t.w.textContent = w + " waiting";
              t.r.hidden = !r;
              t.r.textContent = r + " ready";
            }
            if (poor) lockBtn[k].setAttribute("data-poor", "");
            else lockBtn[k].removeAttribute("data-poor");
            t.el.setAttribute("aria-selected", cur === i ? "true" : "false");
            t.el.classList.toggle("want", want === k && cur !== i);
          });
        }
        function renderHint() {
          var h = $("#hint"),
            txt;
          if (S.sel) {
            var o = ord(S.sel.oid),
              it = o && o.items[S.sel.i];
            if (it && it.st === "wait") {
              var k = need(it);
              txt =
                "<b>" +
                it.s +
                " " +
                DRINKS[it.d].name +
                "</b> needs an <b>" +
                KINDS[k].name +
                " " +
                KINDS[k].unit +
                "</b>";
            }
          }
          if (!txt) {
            var any = S.orders.some(function (o) {
              return o.items.some(function (it) {
                return it.st === "wait";
              });
            });
            txt = any
              ? "Pick a cup, then tap a free machine"
              : "Everything is in motion";
          }
          if (hudC.hint !== txt) {
            h.innerHTML = txt;
            hudC.hint = txt;
          }
        }
        function cupSvg(alive) {
          return (
            '<svg class="life' +
            (alive ? "" : " lost") +
            '" viewBox="0 0 100 100" aria-hidden="true"><path d="' +
            BODY +
            '"/><path class="hnd" d="' +
            HANDLE +
            '"/></svg>'
          );
        }
        function renderHud() {
          var sc = S.score.toLocaleString();
          if (hudC.score !== sc) {
            $("#score").textContent = sc;
            hudC.score = sc;
          }
          var cl = mmss(S.t);
          if (hudC.clock !== cl) {
            $("#clock").textContent = cl;
            hudC.clock = cl;
          }
          var st =
            S.combo > 0
              ? "Streak " +
                S.combo +
                " · x" +
                (1 + Math.min(S.combo, 9) * 0.1).toFixed(1)
              : "";
          if (hudC.streak !== st) {
            $("#streak").textContent = st;
            hudC.streak = st;
          }
          if (hudC.lives !== S.lives) {
            var h = "";
            for (var i = 0; i < 4; i++) h += cupSvg(i < S.lives);
            $("#lives").innerHTML = h;
            hudC.lives = S.lives;
          }
          if (hudC.cash !== S.cash) {
            $("#cash").textContent = S.cash.toLocaleString();
            hudC.cash = S.cash;
          }
          var can = shopItems().some(function (x) {
            return !x.maxed && S.cash >= x.cost;
          });
          if (hudC.can !== can) {
            $("#shopb").classList.toggle("can", can);
            hudC.can = can;
          }
        }
        function render() {
          renderHud();
          syncTickets();
          renderMachines();
          renderTabs();
          renderHint();
        }

        /* ---------- feedback ---------- */
        var tt;
        function toast(msg, kind) {
          tEl.textContent = msg;
          tEl.className = "show " + (kind || "");
          tEl.style.animation = "none";
          void tEl.offsetWidth;
          tEl.style.animation = "";
          clearTimeout(tt);
          tt = setTimeout(function () {
            tEl.className = "";
          }, 1750);
        }
        function flash(id, cls) {
          var e = mEls[id];
          if (!e) return;
          e.el.classList.remove("shake", "pulse");
          void e.el.offsetWidth;
          e.el.classList.add(cls);
          setTimeout(
            function () {
              e.el.classList.remove(cls);
            },
            cls === "pulse" ? 1300 : 400,
          );
        }
        function goStation(i, instant) {
          i = Math.max(0, Math.min(KO.length - 1, i));
          panels.scrollTo({
            left: i * panels.clientWidth,
            behavior: instant ? "auto" : "smooth",
          });
          if (instant) cur = i;
        }

        /* ---------- input ---------- */
        function pick(oid, i) {
          if (!S.running) return;
          var o = ord(oid);
          if (!o) return;
          var it = o.items[i];
          if (it.st === "done") return;
          if (it.st === "brew" || it.st === "ready") {
            var m = S.machines.filter(function (x) {
              return x.id === it.mid;
            })[0];
            if (m) {
              goStation(KO.indexOf(m.k));
              setTimeout(function () {
                flash(m.id, "pulse");
              }, 250);
            }
            return;
          }
          S.sel =
            S.sel && S.sel.oid === oid && S.sel.i === i
              ? null
              : { oid: oid, i: i };
        }
        function tapMachine(id) {
          if (!S.running) return;
          var m = S.machines.filter(function (x) {
            return x.id === id;
          })[0];
          if (!m) return;
          if (m.st === "ready") {
            collect(m);
            return;
          }
          if (m.st === "brew") {
            flash(id, "shake");
            return;
          }
          var target = null;
          if (S.sel) {
            var o = ord(S.sel.oid);
            if (o) {
              var it = o.items[S.sel.i];
              if (it && it.st === "wait" && need(it) === m.k)
                target = { o: o, i: S.sel.i };
            }
          }
          if (!target) target = bestWaiting(m.k);
          if (!target) {
            flash(id, "shake");
            toast("Nothing needs a " + KINDS[m.k].unit + " right now");
            sfx.nope();
            return;
          }
          startJob(m, target.o, target.i);
        }
        rail.addEventListener("click", function (e) {
          var r = e.target.closest(".row");
          if (!r) return;
          pick(+r.dataset.oid, +r.dataset.i);
        });
        panels.addEventListener("click", function (e) {
          var o = e.target.closest("[data-open]");
          if (o) {
            buy("open:" + o.dataset.open, o);
            return;
          }
          var m = e.target.closest(".mach");
          if (!m) return;
          tapMachine(m.dataset.mid);
        });
        tabsEl.addEventListener("click", function (e) {
          var t = e.target.closest(".tab");
          if (!t) return;
          goStation(+t.dataset.i);
        });
        var raf = 0;
        panels.addEventListener(
          "scroll",
          function () {
            if (raf) return;
            raf = requestAnimationFrame(function () {
              raf = 0;
              cur = Math.round(
                panels.scrollLeft / Math.max(1, panels.clientWidth),
              );
            });
          },
          { passive: true },
        );
        window.addEventListener("keydown", function (e) {
          if (!shopEl.hidden) {
            if (e.key === "Escape" || e.key === "s") closeShop();
            return;
          }
          if (!ov.hidden) return;
          if (e.key === "s") openShop();
          else if (e.key >= "1" && e.key <= "4") goStation(+e.key - 1);
          else if (e.key === "ArrowRight") goStation(cur + 1);
          else if (e.key === "ArrowLeft") goStation(cur - 1);
        });

        /* ---------- shop ---------- */
        var shopEl = $("#shop");
        function shopItems() {
          var a = [];
          KO.forEach(function (k) {
            var st = S.stn[k],
              K = KINDS[k];
            if (!st.open) {
              a.push({
                id: "open:" + k,
                grp: k,
                title: "Open " + K.name + " station",
                desc: UNLOCK[k],
                cost: OPENC[k],
              });
              return;
            }
            if (st.n >= MAXM)
              a.push({
                id: "mach:" + k,
                grp: k,
                title: "More " + K.unit + "s",
                desc: MAXM + " of " + MAXM + " installed.",
                cost: 0,
                maxed: true,
              });
            else
              a.push({
                id: "mach:" + k,
                grp: k,
                title: "Add a " + K.unit,
                desc:
                  "You have " +
                  st.n +
                  " of " +
                  MAXM +
                  ". More machines means more cups at once.",
                cost: Math.round((45 + st.n * 30) * (k === "C" ? 1.2 : 1)),
              });
            if (st.spd >= 3)
              a.push({
                id: "spd:" + k,
                grp: k,
                title: "Faster brewing",
                desc:
                  "Level 3 of 3. Brew time x" +
                  Math.pow(0.85, 3).toFixed(2) +
                  ".",
                cost: 0,
                maxed: true,
              });
            else
              a.push({
                id: "spd:" + k,
                grp: k,
                title: "Faster brewing",
                desc:
                  "Level " +
                  st.spd +
                  " of 3. Each level cuts brew time by 15%.",
                cost: 70 + st.spd * 60,
              });
            if (st.auto)
              a.push({
                id: "auto:" + k,
                grp: k,
                title: "Automation",
                desc: "On. Machines load and collect by themselves, jobs run 50% slower.",
                cost: 0,
                maxed: true,
              });
            else
              a.push({
                id: "auto:" + k,
                grp: k,
                title: "Automate",
                desc: "Machines load and collect on their own, but automated jobs take 50% longer.",
                cost: 240,
              });
          });
          if (S.pat >= 3)
            a.push({
              id: "pat",
              grp: "",
              title: "Comfy queue",
              desc: "Level 3 of 3. New tickets wait 45% longer.",
              cost: 0,
              maxed: true,
            });
          else
            a.push({
              id: "pat",
              grp: "",
              title: "Comfy queue",
              desc: "Level " + S.pat + " of 3. New tickets wait 15% longer.",
              cost: 120 * (S.pat + 1),
            });
          return a;
        }
        function addMachine(k) {
          var n =
            S.machines.filter(function (x) {
              return x.k === k;
            }).length + 1;
          var m = {
            id: k + S.mid++,
            k: k,
            n: n,
            st: "idle",
            oid: null,
            ii: null,
            dur: 0,
            left: 0,
            spoil: 0,
          };
          S.machines.push(m);
          buildMachineEl(m);
        }
        function buy(id, btn) {
          if (!S.running) return;
          var it = shopItems().filter(function (x) {
            return x.id === id;
          })[0];
          if (!it || it.maxed) return;
          if (S.cash < it.cost) {
            sfx.nope();
            if (btn) {
              btn.classList.remove("shake");
              void btn.offsetWidth;
              btn.classList.add("shake");
            }
            toast("Need $" + (it.cost - S.cash) + " more", "bad");
            return;
          }
          S.cash -= it.cost;
          var p = id.split(":"),
            t = p[0],
            k = p[1];
          if (t === "open") {
            S.stn[k].open = true;
            S.stn[k].n = 1;
            addMachine(k);
          } else if (t === "mach") {
            S.stn[k].n++;
            addMachine(k);
          } else if (t === "spd") S.stn[k].spd++;
          else if (t === "auto") S.stn[k].auto = true;
          else if (t === "pat") S.pat++;
          sfx.buy();
          if (t === "open") toast(KINDS[k].name + " station is open", "good");
          renderShop();
        }
        function renderShop() {
          var old = shopEl.querySelector(".rc"),
            sc = old ? old.scrollTop : 0;
          var html =
              '<div class="rc shop"><div class="shop-top"><h1>Shop</h1><div class="cashbig">$' +
              S.cash.toLocaleString() +
              "</div></div>" +
              '<p class="rc-sub">Paid for with cash from served orders. The counter is paused while you shop.</p>',
            last = "#";
          shopItems().forEach(function (it) {
            if (it.grp !== last) {
              last = it.grp;
              html += it.grp
                ? '<div class="sgrp" data-k="' +
                  it.grp +
                  '"><span class="kb">' +
                  it.grp +
                  "</span>" +
                  KINDS[it.grp].name +
                  (S.stn[it.grp].open ? "" : " (closed)") +
                  "</div>"
                : '<div class="sgrp">Whole counter</div>';
            }
            var poor = !it.maxed && S.cash < it.cost;
            html +=
              '<div class="srow"><div class="stxt"><b>' +
              it.title +
              "</b><small>" +
              it.desc +
              "</small></div>" +
              '<button type="button" class="buy"' +
              (it.maxed ? " disabled" : "") +
              (poor ? " data-poor" : "") +
              ' data-id="' +
              it.id +
              '">' +
              (it.maxed ? "Done" : "$" + it.cost) +
              "</button></div>";
          });
          html +=
            '<div class="foot"><button type="button" id="snd" class="btn ghost">Sound ' +
            (muted ? "off" : "on") +
            '</button>' +
            (rushAccount && rushAccount.canChangeUsername
              ? '<button type="button" id="accountb" class="btn ghost">Change username</button>'
              : "") +
            (rushAccount
              ? '<button type="button" id="switch-account" class="btn ghost">Switch account</button>'
              : "") +
            '<button type="button" id="shut" class="btn">Back to counter</button></div></div>';
          shopEl.innerHTML = html;
          var nr = shopEl.querySelector(".rc");
          if (nr) nr.scrollTop = sc;
        }
        function openShop() {
          if (!S.running || S.over) return;
          S.paused = true;
          renderShop();
          shopEl.hidden = false;
        }
        function closeShop() {
          shopEl.hidden = true;
          S.paused = false;
        }
        shopEl.addEventListener("click", function (e) {
          var b = e.target.closest(".buy");
          if (b && !b.disabled) {
            buy(b.dataset.id, b);
            return;
          }
          if (e.target.closest("#accountb")) {
            switchRushAccount();
            return;
          }
          if (e.target.closest("#switch-account")) {
            rushAccount.switchAccount().then(function () {
              window.location.reload();
            }).catch(function (error) {
              console.error("Unable to switch the Crema Rush account.", error);
              toast("Could not switch accounts. Try again.", "bad");
            });
            return;
          }
          if (e.target.closest("#shut")) {
            closeShop();
            return;
          }
          if (e.target.closest("#snd")) {
            muted = !muted;
            renderShop();
          }
        });
        $("#shopb").addEventListener("click", openShop);

        function syncFullscreenToggle() {
          var expanded =
            document.fullscreenElement === gameShell ||
            gameShell.classList.contains("fullscreen-fallback");
          fullscreenToggle.setAttribute(
            "aria-label",
            expanded ? "Exit fullscreen" : "Expand game to fullscreen",
          );
          fullscreenToggle.setAttribute(
            "aria-pressed",
            expanded ? "true" : "false",
          );
        }
        function expandFallback() {
          gameShell.classList.add("fullscreen-fallback");
          syncFullscreenToggle();
        }
        fullscreenToggle.addEventListener("click", function () {
          if (document.fullscreenElement === gameShell) {
            document.exitFullscreen().then(syncFullscreenToggle);
            return;
          }
          if (gameShell.classList.contains("fullscreen-fallback")) {
            gameShell.classList.remove("fullscreen-fallback");
            syncFullscreenToggle();
            return;
          }
          if (!gameShell.requestFullscreen) {
            expandFallback();
            return;
          }
          gameShell
            .requestFullscreen()
            .then(syncFullscreenToggle)
            .catch(expandFallback);
        });
        document.addEventListener("fullscreenchange", syncFullscreenToggle);
        document.addEventListener("keydown", function (e) {
          if (
            e.key === "Escape" &&
            gameShell.classList.contains("fullscreen-fallback")
          ) {
            gameShell.classList.remove("fullscreen-fallback");
            syncFullscreenToggle();
          }
        });

        /* ---------- overlays ---------- */
        function ln(a, b) {
          return (
            '<div class="ln"><span>' +
            a +
            "</span><i></i><b>" +
            b +
            "</b></div>"
          );
        }
        function showStart() {
          ov.innerHTML =
            '<div class="rc"><h1>Crema Rush</h1>' +
            '<p class="rc-sub">You open with espresso and drip. Earn cash, build the shop up, and keep four walkouts from happening.</p>' +
            '<ol class="how">' +
            "<li>Tickets print along the top. Tap a cup on a ticket, then tap a free machine to load it.</li>" +
            "<li>Grab each cup within 20 seconds of the ding or it scorches.</li>" +
            "<li>Latte is espresso, then milk. Cold Foam is cold brew, then milk.</li>" +
            "<li>Spend cash in the Shop: open stations, add machines, brew faster, automate.</li>" +
            "<li>Swipe or use the tabs to change stations. Tickets stay in view.</li>" +
            "</ol>" +
            ln("Espresso group", "4s") +
            ln("Milk wand", "3s") +
            ln("Drip brewer", "6s") +
            ln("Cold brew tap", "8s") +
            '<p class="rc-sub">Times are for a medium. Small x0.8, large x1.3.</p>' +
            '<button id="go" class="btn" type="button">Open the shop</button>' +
            (rushAccount && rushAccount.canChangeUsername
              ? '<button id="switch-user" class="btn ghost" type="button">Change username</button>'
              : "") +
            (rushAccount
              ? '<button id="switch-account" class="btn ghost" type="button">Switch account</button>'
              : "") +
            (best
              ? '<p class="best">Best shift: ' + best.toLocaleString() + "</p>"
              : "") +
            (rushAccount && rushAccount.isGuest
              ? '<p class="best">Guest username: ' + rushAccount.username + '. Progress saves to your account.</p>'
              : "") +
            "</div>";
          ov.hidden = false;
          $("#go").onclick = begin;
          var changeUsernameButton = $("#switch-user");
          if (changeUsernameButton) changeUsernameButton.onclick = switchRushAccount;
          var switchAccountButton = $("#switch-account");
          if (switchAccountButton) {
            switchAccountButton.onclick = function () {
              rushAccount.switchAccount().then(function () {
                window.location.reload();
              }).catch(function (error) {
                console.error("Unable to switch the Crema Rush account.", error);
                toast("Could not switch accounts. Try again.", "bad");
              });
            };
          }
        }
        function showOver(nb) {
          shopEl.hidden = true;
          ov.innerHTML =
            '<div class="rc">' +
            (nb ? '<span class="flag">NEW BEST</span>' : "") +
            '<h1>Shift over</h1><div class="big">' +
            S.score.toLocaleString() +
            "</div>" +
            ln("Orders served", S.served) +
            ln("Cash earned", "$" + S.earned.toLocaleString()) +
            ln("Scorched cups", S.burnt) +
            ln("Best streak", S.maxCombo) +
            ln("Time on shift", mmss(S.t)) +
            ln("Best shift", best.toLocaleString()) +
            '<button id="go" class="btn" type="button">New shift</button></div>';
          ov.hidden = false;
          $("#go").onclick = begin;
        }
        function begin() {
          if (!ac) {
            try {
              ac = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
              ac = null;
            }
          }
          if (ac && ac.state === "suspended") ac.resume();
          setup(false);
          S.running = true;
          ov.hidden = true;
          shopEl.hidden = true;
          goStation(0, true);
          hudC = {};
          Object.keys(tabEls).forEach(function (k) {
            tabEls[k].c = {};
          });
        }

        /* ---------- loop ---------- */
        var last = 0;
        function frame(now) {
          requestAnimationFrame(frame);
          var dt = Math.min(now - last, 100);
          last = now;
          if (S.running && !S.paused) update(dt);
          render();
        }
        function showAccountRequired() {
          ov.innerHTML =
            '<div class="rc"><h1>Username required</h1>' +
            '<p class="rc-sub">Sign in or create a username to play and save your progress.</p>' +
            '<p class="account-error" role="alert">Account access failed. Check your connection and try again.</p>' +
            '<button id="retry-account" class="btn" type="button">Try again</button></div>';
          ov.hidden = false;
          $("#retry-account").onclick = function () {
            window.location.reload();
          };
        }
        setup(true);
        (async function initializeRush() {
          try {
            await connectRushProgress();
          } catch (error) {
            console.error("Unable to connect Crema Rush account progress.", error);
            if (!rushAccount) {
              showAccountRequired();
              requestAnimationFrame(function (t) {
                last = t;
                requestAnimationFrame(frame);
              });
              return;
            }
            toast("Cloud progress is unavailable; this shift can still be played", "bad");
          }
          showStart();
          requestAnimationFrame(function (t) {
            last = t;
            requestAnimationFrame(frame);
          });
        })();
      })();
    </script>
    <script src="/nav-bar.js"></script>
  </body>
</html>
