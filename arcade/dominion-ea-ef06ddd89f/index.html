<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dominion: Infinite Frontiers | Lazer Arcade</title>
<meta name="description" content="An endless strategy game that shows its own tricks. Build an army, conquer planets base by base, then flip on the Hook Lens to see every engagement and spending hook real games use. Pretend money only.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
import {doc,getDoc,setDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,getDocs,onSnapshot,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
window.FS={doc,getDoc,setDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,getDocs,onSnapshot,writeBatch,serverTimestamp};window.dispatchEvent(new Event("fs-ready"));
</script>
<style>
:root{--bg:#0a0926;--bg2:#12103c;--pn:#1a1757;--pn2:#241f78;--ln:#3d36b0;--tx:#f5f2ff;--mut:#aea8e6;--gold:#ffcf3a;--gold2:#ff9a1f;--pink:#ff4fa3;--cy:#2fe6ff;--lime:#8dff5a;--red:#ff5468;--org:#ff9a3d;--vio:#a66bff;--me:#ffb629;--me2:#ff5d3a;--disp:'Lilita One','Arial Black',sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:700 15px/1.35 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit}
h1,h2,h3,h4{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.3px}
svg.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(900px 500px at 50% -10%,#2a1f8a 0%,transparent 70%),var(--bg)}
/* HUD */
#hud{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:calc(6px + var(--sat)) 10px 6px;background:linear-gradient(180deg,#1d1964,#151250);border-bottom:2px solid #2d2790;position:relative;z-index:5}
.cmd{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 230px;text-align:left}
.cmd canvas{width:38px;height:38px;border-radius:10px;flex:none;box-shadow:0 0 0 2px #fff3}
.cmd .nm{font:400 15px/1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.cmd .lv{display:flex;align-items:center;gap:6px;margin-top:4px}
.cmd .lv b{font:400 12px/1 var(--disp);background:var(--gold);color:#3a2300;border-radius:6px;padding:3px 6px}
.xpb{position:relative;height:10px;width:86px;border-radius:6px;background:#0b0930;overflow:hidden;box-shadow:inset 0 0 0 1px #4a43c4}
.xpb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cy),var(--lime));border-radius:6px;transition:width .5s cubic-bezier(.2,1.4,.4,1)}
.cur{display:flex;gap:6px;flex-wrap:nowrap;min-width:0;order:2}
#hud .hb{order:3}
#hud>.sp{order:1}
.cur .c{display:flex;align-items:center;gap:4px;background:#0c0a33;border:1.5px solid #3a33a8;border-radius:999px;padding:4px 9px 4px 5px;font:800 13px/1 var(--body);white-space:nowrap}
.cur .c svg{width:18px;height:18px}
.cur .c.gem{border-color:var(--pink);padding-right:4px}
.cur .c.gem u{text-decoration:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pink);color:#fff;font:900 14px/1 var(--body);margin-left:3px}
.hb{position:relative;width:36px;height:36px;border-radius:11px;background:#0c0a33;border:1.5px solid #3a33a8;display:grid;place-items:center;flex:none}
.hb svg{width:20px;height:20px}
.hb.on{background:var(--vio);border-color:#fff}
.hb em{position:absolute;right:-5px;top:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);font:900 10px/17px var(--body);text-align:center;font-style:normal;padding:0 4px}
/* banners */
#alerts{flex:none;position:relative;z-index:4}
.thr{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#8f1230,#c2243f);border-bottom:2px solid #ff8394;animation:thr 1s infinite alternate}
@keyframes thr{to{filter:brightness(1.25)}}
.thr b{font:400 15px var(--disp)}
.thr small{display:block;color:#ffd0d6;font-weight:700;font-size:12px}
.thr .sp{flex:1;min-width:0}
/* view */
#view{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{max-width:920px;margin:0 auto;padding:14px 12px 30px}
.page h2{font-size:24px;margin:4px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:13px;margin:-6px 0 12px}
.pn{background:linear-gradient(180deg,var(--pn2),var(--pn));border:2px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 6px 0 #0b0930}
.pn h3{font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px}
.row.w{flex-wrap:wrap}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#120f45;border:2px solid #322ba0;border-radius:14px;padding:10px;position:relative}
.card.lock{opacity:.62}
.card h4{font-size:16px}
.card canvas.ui{width:54px;height:54px;border-radius:12px;background:#0b0930;flex:none}
.st{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0}
.st b{color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:12px;font:400 15px/1.1 var(--disp);letter-spacing:.4px;color:#3a2300;background:linear-gradient(180deg,#ffe36b,#ffb81f);box-shadow:0 4px 0 #b86d00,inset 0 2px 0 #fff7;transition:transform .06s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b86d00}
.btn.b2{color:#fff;background:linear-gradient(180deg,#5d8bff,#3a55e0);box-shadow:0 4px 0 #1d2c8f,inset 0 2px 0 #fff4}
.btn.b3{color:#fff;background:linear-gradient(180deg,#ff73b9,#e02f86);box-shadow:0 4px 0 #8f124f,inset 0 2px 0 #fff4}
.btn.b4{color:#06301a;background:linear-gradient(180deg,#b6ff7a,#4fd63a);box-shadow:0 4px 0 #1d7a16,inset 0 2px 0 #fff6}
.btn.bx{color:#fff;background:#2b2590;box-shadow:0 4px 0 #15115a}
.btn.red{color:#fff;background:linear-gradient(180deg,#ff7b8a,#e0304a);box-shadow:0 4px 0 #8f1227,inset 0 2px 0 #fff4}
.btn.s{min-height:32px;padding:4px 10px;font-size:13px;border-radius:10px}
.btn.big{min-height:52px;font-size:20px;padding:8px 22px;border-radius:16px}
.btn[disabled],.btn.off{filter:grayscale(.9) brightness(.7);pointer-events:none}
.btn svg{width:16px;height:16px}
.bar{position:relative;height:14px;border-radius:8px;background:#0b0930;overflow:hidden;box-shadow:inset 0 0 0 1.5px #4a43c4}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--cy),var(--lime));transition:width .4s}
.bar.g i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.bar.r i{background:linear-gradient(90deg,#ff2d55,#ff8a5c)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:900 10px/1 var(--body);text-shadow:0 1px 2px #000}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font:900 11px/1.5 var(--body);background:#0c0a33;border:1.5px solid #4a43c4;white-space:nowrap}
.tag.g{background:var(--gold);color:#3a2300;border:0}.tag.p{background:var(--pink);border:0}.tag.l{background:var(--lime);color:#0b3a05;border:0}.tag.r{background:var(--red);border:0}.tag.c{background:var(--cy);color:#042a33;border:0}
.seg{display:flex;background:#0c0a33;border:2px solid #322ba0;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;min-height:34px;border-radius:9px;font:400 14px var(--disp);color:var(--mut);padding:0 10px;white-space:nowrap;position:relative}
.seg button.on{background:linear-gradient(180deg,#5d8bff,#3a55e0);color:#fff}
.dot{position:absolute;right:4px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #0c0a33}
/* nav */
#nav{flex:none;display:flex;background:linear-gradient(180deg,#1d1964,#100d40);border-top:2px solid #2d2790;padding:4px 4px calc(4px + var(--sab));z-index:5}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;border-radius:12px;font:400 11.5px var(--disp);color:var(--mut);position:relative;letter-spacing:.3px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:#fff;background:linear-gradient(180deg,#4d45d6,#2f289c);box-shadow:inset 0 2px 0 #fff3}
#nav button.on svg{filter:drop-shadow(0 0 6px var(--cy))}
#nav .dot{right:50%;margin-right:-20px;top:2px}
/* world */
#world{position:absolute;inset:0;overflow:hidden}
#map3{position:absolute;inset:0;width:100%;height:100%;display:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wtop{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;align-items:center;gap:8px;pointer-events:none;padding:0 8px}
.wtop>*{pointer-events:auto}
.pl{display:flex;align-items:center;gap:8px;background:#0c0a33cc;border:2px solid #3a33a8;border-radius:14px;padding:5px 8px;backdrop-filter:blur(6px)}
.pl b{font:400 16px/1 var(--disp)}.pl small{display:block;color:var(--mut);font-size:11px}
.pl button{width:30px;height:30px;border-radius:9px;background:#2b2590;font:900 16px var(--body)}
.pl button[disabled]{opacity:.3}
.wside{position:absolute;right:8px;top:62px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.wleft{position:absolute;left:8px;top:62px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:46%}
.vault{display:flex;align-items:center;gap:8px;background:#0c0a33d9;border:2px solid var(--gold);border-radius:14px;padding:6px 8px 6px 10px}
.vault b{font:400 15px/1 var(--disp);color:var(--gold)}.vault small{display:block;font-size:10.5px;color:var(--mut)}
.vault.full{animation:pulse .8s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 18px var(--gold);transform:scale(1.04)}}
.pill{display:flex;align-items:center;gap:6px;background:#0c0a33d9;border:2px solid #3a33a8;border-radius:12px;padding:5px 9px;font-size:12px}
.pill.ev{border-color:var(--pink)}.pill.tr{border-color:var(--cy)}.pill.sh{border-color:var(--lime)}
.pill b{font:400 13px var(--disp)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;max-width:min(92%,460px);background:#fff;color:#1a1757;border-radius:16px;padding:9px 14px;font-weight:800;font-size:13.5px;box-shadow:0 6px 0 #0b093088;display:flex;gap:8px;align-items:center;animation:bob 1.6s infinite alternate ease-in-out}
.hint:before{content:"TIP";font:400 11px var(--disp);background:var(--pink);color:#fff;border-radius:7px;padding:3px 6px;flex:none}
@keyframes bob{to{transform:translateX(-50%) translateY(-5px)}}
#node{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:min(96%,520px);background:linear-gradient(180deg,#2a2490,#1a1757);border:2px solid #6a62ff;border-radius:20px;padding:12px;box-shadow:0 10px 40px #000a;animation:up .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateX(-50%) translateY(40px);opacity:0}}
#node h3{font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#node .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:10px;background:#0c0a33;font:900 15px var(--body)}
.loot{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.loot span{display:inline-flex;align-items:center;gap:4px;background:#0c0a33;border-radius:9px;padding:3px 8px;font-size:12.5px}
.loot svg{width:15px;height:15px}
/* battle */
#battle{position:fixed;inset:0;z-index:20;background:#05041a;display:flex;flex-direction:column}
#battle[hidden]{display:none}
#bwrap{flex:1;min-height:0;position:relative}
#b3{position:absolute;inset:0;width:100%;height:100%;display:none}
#bf{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#btop{position:absolute;left:0;right:0;top:0;padding:calc(6px + var(--sat)) 8px 6px;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#05041acc,transparent);pointer-events:none}
#btop>*{pointer-events:auto}
#btop .nm{font:400 15px/1.1 var(--disp);text-shadow:0 2px 4px #000}
#btop .nm small{display:block;font:800 11px var(--body);color:var(--mut)}
#btop .tm{font:400 20px/1 var(--disp);background:#0c0a33;border:2px solid #3a33a8;border-radius:10px;padding:5px 9px;min-width:62px;text-align:center}
#btop .tm.low{border-color:var(--red);color:var(--red);animation:thr .5s infinite alternate}
#btop .hp{flex:1;max-width:240px}
#bhud{flex:none;background:linear-gradient(180deg,#1d1964,#100d40);border-top:2px solid #2d2790;padding:6px 8px calc(6px + var(--sab))}
#bhud .r1{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
#cpb{flex:1 1 220px;height:18px;border-radius:9px;background:#0b0930;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1.5px #4a43c4}
#cpb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b45cff,#ff4fa3);border-radius:9px}
#cpb span{position:absolute;inset:0;display:grid;place-items:center;font:900 11px/1 var(--body);text-shadow:0 1px 2px #000}
.stn{display:flex;background:#0c0a33;border-radius:10px;padding:2px;gap:2px}
.stn button{min-height:30px;padding:0 9px;border-radius:8px;font:400 12.5px var(--disp);color:var(--mut)}
.stn button.on{background:var(--cy);color:#042a33}
.stn button.on[data-v=retreat]{background:var(--red);color:#fff}
.tg{min-height:30px;padding:0 9px;border-radius:9px;background:#0c0a33;border:1.5px solid #3a33a8;font:400 12.5px var(--disp);color:var(--mut)}
.tg.on{background:var(--lime);color:#0b3a05;border-color:#fff}
#bcmd.on{background:#3a1d8f;color:#fff;border-color:var(--pink)}
#cards{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px}
.uc{flex:none;width:68px;border-radius:12px;background:#120f45;border:2px solid #322ba0;padding:3px 3px 4px;text-align:center;position:relative;transition:transform .1s}
.uc canvas{width:44px;height:44px;display:block;margin:0 auto}
.uc b{display:block;font:400 11px/1 var(--disp)}
.uc small{display:block;font:800 10px/1.3 var(--body);color:var(--mut)}
.uc .cp{position:absolute;left:-2px;top:-2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#b45cff,#ff4fa3);font:900 11px/20px var(--body);box-shadow:0 0 0 2px #100d40}
.uc.sel{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 0 14px var(--gold)}
.uc.dis{filter:grayscale(1) brightness(.6)}
.uc.pu{width:54px;border-color:#7d3fd0;background:#22104d}
.uc.pu canvas{width:34px;height:34px;margin-top:3px}
.vsep{flex:none;width:2px;background:#322ba0;border-radius:2px;margin:2px 1px}
#bmsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:400 clamp(26px,7vw,54px)/1 var(--disp);text-shadow:0 4px 0 #000,0 0 30px var(--pink);pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
#bmsg.show{animation:bmsg 1.7s forwards}
@keyframes bmsg{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}
/* modal */
#modal{position:fixed;inset:0;z-index:40;background:#05041acc;display:grid;place-items:center;padding:12px;backdrop-filter:blur(5px)}
#modal[hidden]{display:none}
.mb{position:relative;width:min(100%,480px);max-height:calc(100dvh - 24px);overflow-y:auto;background:linear-gradient(180deg,#2c2596,#1a1757);border:3px solid #7b73ff;border-radius:24px;padding:18px 16px 16px;box-shadow:0 20px 70px #000c,inset 0 2px 0 #fff3;animation:pop .28s cubic-bezier(.2,1.5,.4,1)}
.mb.wide{width:min(100%,640px)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mb h2{font-size:28px;text-align:center;margin-bottom:8px;text-shadow:0 3px 0 #0b0930}
.mb .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:10px;background:#0c0a33;font:900 15px var(--body);z-index:2}
.mb p{margin:6px 0;font-weight:700}
.mb .ctr{text-align:center}
.mb .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ray{position:relative;overflow:hidden}
.ray:before{content:"";position:absolute;left:50%;top:60px;width:700px;height:700px;margin:-350px;background:repeating-conic-gradient(#ffffff14 0 9deg,transparent 9deg 18deg);animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ray>*{position:relative}
.ban{font:400 44px/1 var(--disp);text-align:center;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a4a00);margin:4px 0 8px}
.ban.lose{background:linear-gradient(180deg,#fff,#ff8a98);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #6b0b1c)}
.lst{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.lst .li{display:flex;align-items:center;gap:8px;background:#0c0a33;border-radius:11px;padding:7px 10px;font-size:14px}
.lst .li svg{width:20px;height:20px}
.lst .li b{margin-left:auto}
.lst .li.bad{background:#3a0d1c;color:#ffb3bd}
.lst .li.good{background:#0d3a1c;color:#b9ffcf}
.offer{border-color:var(--gold)!important;background:linear-gradient(180deg,#7a2bd6,#3a1680)!important}
.offer .was{text-decoration:line-through;color:#ffb3d6;font-size:14px}
.offer .cd{display:inline-block;background:var(--red);border-radius:8px;padding:2px 8px;font:400 15px var(--disp)}
.burst{display:inline-block;background:var(--red);color:#fff;font:400 14px var(--disp);padding:4px 12px;border-radius:999px;transform:rotate(-4deg);box-shadow:0 3px 0 #7a0b1c}
/* store */
.pack{background:linear-gradient(180deg,#3a1d8f,#22104d);border:2px solid #7d3fd0;border-radius:16px;padding:10px;text-align:center;position:relative}
.pack .gm{font:400 24px/1 var(--disp);color:#ffd6ee;margin:6px 0 2px}
.pack small{display:block;color:var(--mut);font-size:11.5px;min-height:16px}
.pack .rb{position:absolute;left:50%;top:-9px;transform:translateX(-50%);white-space:nowrap}
.pack.hot{border-color:var(--gold);box-shadow:0 0 18px #ffcf3a55}
.wallet{background:#0d3a1c;border:2px solid #3fe37a;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wallet b{font:400 20px/1 var(--disp);color:#b9ffcf}
/* wheel */
#wheelC{width:min(300px,74vw);height:min(300px,74vw);display:block;margin:8px auto}
/* chat */
.chat{height:min(46dvh,360px);overflow-y:auto;background:#0c0a33;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;user-select:text;-webkit-user-select:text}
.chat .m b{color:var(--cy)}.chat .m.me b{color:var(--gold)}.chat .m.sys{color:var(--mut);font-style:italic}
.chat .bd{display:inline-block;font:900 9.5px/1.5 var(--body);border-radius:5px;padding:0 5px;margin-right:4px;background:#4a43c4;vertical-align:1px}

/* ---------------- the hooks (from the deck) ---------------- */
var HOOKS={
h1:{n:"#1",t:"Endless game",d:"There is no final level. Every conquered world reveals another, so you never get the feeling of being finished."},
h2:{n:"#2",t:"Progress bars and levels",d:"XP bars fill fast early on. Each small jump feels like a win, and you start chasing the next one."},
h3:{n:"#3",t:"Unlocks over time",d:"Showing you what is locked makes you want it. You keep playing to reach things you have only seen as silhouettes."},
h3b:{n:"#3b",t:"Achievements",d:"Badges and titles are mini-wins outside of battle. They feel like proof you are improving, so you collect them."},
h4:{n:"#4",t:"Control and decisions",d:"You pick the targets, the deployment and the retreat. Feeling in control makes you more attached and more likely to try again."},
h4b:{n:"#4b",t:"Guided hints",d:"A tip always points at a next step, so you never hit a moment of boredom where you might close the game."},
h5:{n:"#5",t:"Multiple fronts",d:"Anything you own can be taken back while you look elsewhere. You can never fully relax."},
h6:{n:"#6",t:"Real losses",d:"Losing soldiers, gear or land hurts more than winning feels good. One loss turns into several sessions of winning it back."},
h7:{n:"#7",t:"Offline vulnerability",d:"You earn nothing while away, but you can still be attacked. Checking in starts to feel like protecting yourself."},
h8:{n:"#8",t:"Streaks and daily rewards",d:"A streak is a chain you do not want to break. Missing a day feels like losing something you earned."},
h9:{n:"#9",t:"Quests that refill forever",d:"Finish a quest and another takes its place immediately. The to-do list never empties."},
h10:{n:"#10",t:"Harder quests, slightly better rewards",d:"Quest targets grow faster than the rewards do. It stays just barely worth it, so you play longer for the same payoff."},
h10b:{n:"#10b",t:"Difficulty spikes while online",d:"Sudden ambushes and surprise attacks only happen while you are playing. Stress makes people react fast and stay."},
h11:{n:"#11",t:"Needs grow faster than income",d:"A bigger army eats more and costs more to upgrade. You earn more too, but never quite enough, which nudges you toward grinding or shortcuts."},
h12:{n:"#12",t:"Customization and identity",d:"Once you have named it and dressed it, quitting feels like abandoning something you built."},
h13:{n:"#13",t:"Chat, badges and status",d:"Chat keeps you connected and badges show rank in public. People come back to keep up their reputation. Here the rival commanders are AI."},
h13b:{n:"#13b",t:"Leaderboards and tournaments",d:"Seeing your rank slip is a reason to play more. The top AI rivals here are tuned to stay a little ahead of you, so there is always someone to chase."},
h14:{n:"#14",t:"Seasonal events and limited items",d:"A countdown on something that may never come back makes showing up feel necessary."},
h15:{n:"#15",t:"Hidden treasure and surprise drops",d:"Random rewards hit harder than predictable ones. Not knowing what is inside is the whole point."},
h16:{n:"#16",t:"Wheel spins and near-misses",d:"The odds shown are real, but the two most common prizes sit on either side of the jackpot and the wheel is tuned to stop a hair from the line when it lands on them. Almost winning makes people spin again."},
h17:{n:"#17",t:"Notifications",d:"Alerts about attacks, timers and rewards are built to interrupt you. Just checking turns into playing."},
h18:{n:"#18",t:"Speed and bright visuals",d:"Fast battles, flashes and instant feedback keep attention locked and make it hard to stop mid-session."},
m1:{n:"$1",t:"Optional but tempting",d:"Pressure rises over time and premium shortcuts are always one tap away. In a paid game this is where the money comes in. Here the shortcuts cost gems you earned."},
m2:{n:"$2",t:"First-time offer (price anchor)",d:"A cheap one-time starter deal sets what a normal price feels like, so later prices seem reasonable."},
m3:{n:"$3",t:"Purchase-only currency",d:"Most games sell their premium currency for real money. Here gems are only ever earned, but they still sit apart from the normal economy so spending them feels like special access."},
m4:{n:"$4",t:"Multiple currencies",d:"Coins become stamps, gems become spins or boosts. Splitting value across currencies makes each spend feel smaller than it is."},
m5:{n:"$5",t:"Leftover currency",d:"Prices rarely match what you hold. Being a few gems short, or having a few left over, keeps you playing toward the next purchase."},
m6:{n:"$6",t:"Bundles and a price ladder",d:"Bundles show better value than single buys, so spending more feels like the smart choice."},
m7:{n:"$7",t:"Currencies paced differently",d:"Coins flow steadily so you keep playing. Alloy trickles in and is tied to the strongest upgrades, so it always feels scarce."},
m8:{n:"$8",t:"Timed pop-ups",d:"Offers appear right when you feel something: after a loss, before a big fight, or one step from an unlock."},
m9:{n:"$9",t:"Buying XP and power-ups",d:"Paying to skip is framed as saving time. It is most tempting right after a loss or right before an unlock."},
m10:{n:"$10",t:"Paid autopilot",d:"A free general exists, but the premium one is better and even attacks while you are away. Premium currency replaces time."},
m11:{n:"$11",t:"Paid protection and recovery",d:"Shields, revives and loss protection feel like saving what you already earned instead of buying something new."},
m12:{n:"$12",t:"Limited skins and bundles",d:"Cosmetics that may not return create urgency, and they double as status in chat."},
m13:{n:"$13",t:"Event pass and premium track",d:"You can see the premium rewards you have already earned sitting locked. Buying feels like unlocking what is already yours."},
m14:{n:"$14",t:"Small purchases add up",d:"One more spin, one more boost. Each feels minor. The running total is the part games rarely show you."}
};

var AC=null,lastHit=0;
function tone(f,d,type,vol,slide,delay){
  if(!S||S.mute)return;
  try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}

  else if(k==="hit"){var n=now();if(n-lastHit<70)return;lastHit=n;tone(rnd(150,240),.05,"sawtooth",.025,80);}
  else if(k==="boom")tone(120,.35,"sawtooth",.08,35);

  else if(k==="win")[523,659,784,1047].forEach(function(f,i){tone(f,.22,"square",.05,0,i*.11);});
  else if(k==="lose")[392,330,262,196].forEach(function(f,i){tone(f,.28,"sawtooth",.045,0,i*.14);});
  else if(k==="lvl")[523,784,1047,1319,1568].forEach(function(f,i){tone(f,.18,"square",.05,0,i*.08);});
  else if(k==="tick")tone(1200,.03,"square",.025);

// The slot is drawn by its published weight, so the odds on screen are true. The near-miss is in the
// layout and the stop: the two most likely prizes flank the jackpot, and a stop on either one is
// placed a hair from the jackpot line (deck hook #16).
function wheelRoll(){
  var tot=0,i;for(i=0;i<WHEEL.length;i++)tot+=WHEEL[i].w;var x=Math.random()*tot;
  for(i=0;i<WHEEL.length;i++){x-=WHEEL[i].w;if(x<=0)break;}
  i=Math.min(i,WHEEL.length-1);
  if(i===1)return{seg:1,off:rnd(.02,.13),near:true};
  if(i===WHEEL.length-1)return{seg:i,off:rnd(.87,.98),near:true};
  return{seg:i,off:rnd(.15,.85),near:false};
}
function wheelGrant(seg){
  var w=WHEEL[seg];
  if(w.jack){var c=Math.round(3000*(1+.15*(S.lvl-1)));S.coins+=c;S.alloy+=40;gem(100);return IC.coin+" "+fmt(c)+" + "+IC.alloy+" 40 + "+IC.gem+" 100";}
  return grant(w.r);
}

function offlineSim(){
  var away=(now()-S.seen)/1000,out={away:away,raids:[],auto:[]};
  if(away<1200||!S.name)return null;
  S.stats.away+=away;S.stats.sessions++;hit("h7");
  if(S.genU>S.seen){
    var k=Math.min(3,1+Math.floor(away/5400)),wd=W();hit("m10");
    for(var i=0;i<k;i++){var opts=wd.n.filter(function(n){return attackable(wd,n)&&n.ty<=1;});if(!opts.length)break;var n=pick(opts);if(Math.random()<.75){n.o=1;var c=Math.round(T_COIN[n.ty]*.5);S.coins+=c;S.stats.capT[n.ty]++;out.auto.push({nm:n.nm,c:c});}}

    var nr=Math.min(3,1+Math.floor(away/7200));

function tick(){

  var nm=siteCount("mine"),nf=siteCount("farm");if(nm){S.accA=(S.accA||0)+nm/200;if(S.accA>=1){S.accA-=1;S.alloy++;}}if(nf){S.accS=(S.accS||0)+nf/15;if(S.accS>=1){var ws=Math.floor(S.accS);S.accS-=ws;S.stamps+=ws;}}

  if(fedOn()&&S.feedAuto.on&&S.lvl>=6&&S.fedU-now()<4000&&armySize()>0)feed(S.feedAuto.q,true);
  if(S.allyCd>0)S.allyCd--;if(S.campCd>0)S.campCd--;if(S.raidCd>0)S.raidCd--;
  if(!B){
    if(S.threat){S.threat.t--;if(S.threat.t<=0){var r=resolveThreat();if(r&&!r.win)showDefLoss(r);renderAll();}}
    else if(S.lvl>=3&&ownedCount()>=4&&now()>S.shieldU&&modalFree()){S.raidT--;if(S.raidT<=0){spawnThreat();S.raidT=irnd(200,330);renderAll();}}
    if(!S.chest){S.chestT--;if(S.chestT<=0){var wd=W();S.chest={w:S.cur,n:irnd(1,wd.n.length-1),exp:now()+75000};S.chestT=irnd(110,200);hit("h15");}}
    else if(now()>S.chest.exp)S.chest=null;
  }
  if(tickN%5===0){evSync();tourSync();chatTick();dailySync();if(dayStr()!==S.lastDay){S.lastDay=dayStr();streakSync();if(streakPending&&modalFree()&&!B)showStreak();}checkAch();}

      h+="</div>";});
    h+="</div>";
  }else if(sub.army==="mess"){
    if(!fedOn())return h+'<div class="pn"><h3>'+IC.lock+" Mess Hall</h3><p>Opens at level 2. Until then your soldiers live on field rations. "+hk("h3")+"</p></div>";
    var fed=now()<S.fedU,f=clamp((S.fedU-now())/FED_MS,0,1);
    h+='<div class="pn"><h3>'+(fed?"Fed: "+FOODS[S.fedQ].nm+" ("+FOODS[S.fedQ].m+")":'<span style="color:var(--red)">Hungry: fighting at 80%</span>')+" "+hk("h11")+'</h3><div class="bar '+(fed?"":"r")+'"><i id="fedBar" style="width:'+f*100+'%"></i></div><p class="sm mut">'+(fed?"Next meal due in "+cd(S.fedU):"Feed them before your next fight.")+" A meal lasts 3 minutes. Bigger armies eat more.</p><div class=\"grid3\">";
    FOODS.forEach(function(fd,q){var c=feedCost(q)+(S.capFeed&&S.cap?capFeedCost():0);h+='<div class="card"><h4>'+fd.nm+'</h4><div class="sm mut">'+fd.m+'</div><button class="btn s '+(S.stamps<c?"off":"")+'" style="margin-top:8px;width:100%" data-a="feed" data-v="'+q+'">Serve · '+IC.stamp+c+"</button></div>";});

    h+="</div>";
  }
  return h;

  p.innerHTML='<div class="mb"><p class="ctr"><span class="tag p">HOOK '+hh.n+"</span></p><h2>"+hh.t+'</h2><div class="hkc" style="display:block">'+hh.d+'</div><p class="ctr sm mut">Fired <b style="color:var(--gold)">'+(S.hooks[id]||0)+'</b> times for you so far.</p><div class="acts"><button class="btn" data-a="hookX">Got it</button></div></div>';
  p.hidden=false;if(B)B.paused=true;
}
function rr(){renderHud();renderTab();dirty();}
function claimStarter(){if(!S.offers.starter)return;if(!spendGems(GP.starter,"the Starter Pack"))return;S.offers.starter=false;S.coins+=400;S.stamps+=60;S.pu.strike+=2;S.pu.shield++;hit("m2");snd("jack");toast(IC.gem+" Starter Pack claimed.","gold");}
var ACT={
  tab:function(v){closeModal(true);postBattle=null;tab=v;mapSel=-1;if(v==="social")chatNew=0;renderAll();$("#view").scrollTop=0;},
  sub:function(v){sub[tab]=v;renderTab();},
  close:function(){closeModal();},
  cont:function(){flowNext();},
  hook:function(v){showHook(v);},
  hookX:function(){$("#hookpop").hidden=true;if(B&&modalFree()){B.paused=false;B.last=performance.now();}},
  lens:function(){S.lens=!S.lens;if(S.lens){S.stats.lensOpens++;toast(IC.eye+" Hook Lens on. Tap any purple tag.","gold");}document.body.classList.toggle("lens",S.lens);checkAch();dirty();if(!modalFree())showMenu();},
  menu:function(){showMenu();},alerts:function(){showAlerts();},alertCfg:function(){showAlertCfg();},
  acfg:function(v){S.alertCfg[v]=S.alertCfg[v]===false;showAlertCfg();dirty();},
  profile:function(){showProfile();},report:function(){$("#hookpop").hidden=true;showReport();},howto:function(){showHowto();},
  mute:function(){S.mute=!S.mute;showMenu();dirty();},
  arcade:function(){save();if(window.LZ)try{LZ.flush();}catch(e){}location.href="/arcade/";},
  reset:function(){openModal('<h2>Reset everything?</h2><p class="ctr">Your army, worlds, gems and streak will be wiped. Lazer Points you already earned stay on your account.</p><div class="acts"><button class="btn red" data-a="resetYes">Wipe it</button><button class="btn bx" data-a="close">Keep playing</button></div>');},
  resetYes:function(){var g=(S.gen||0)+1,mute=S.mute;S=fresh();S.gen=g;S.mute=mute;_bots=null;save();if(window.LZ)try{LZ.flush();}catch(e){}location.reload();},
  collect:function(){var v=Math.floor(S.vault);if(v<1){toast("The vault is empty. Capture territory to fill it.");return;}S.coins+=v;S.vault-=v;S.stats.collected+=v;qprog("collect",v);snd("coin");toast(IC.coin+" +"+fmt(v)+" collected","gold");renderWorld();renderHud();dirty();},
  raid:function(){startRaid(false);},
  gauntlet:function(){startRaid(false,true);},
  claimMain:function(){claimMain();if(pendingLv.length)flowNext();else{rr();renderNav();}},
  attack:function(v){attackNode(+v,false,false);},
  attackAuto:function(v){attackNode(+v,true,false);},
  attackAlly:function(v){if(S.allyCd>0)return;attackNode(+v,false,true);},
  unsel:function(){mapSel=-1;renderWorld();},
  chest:function(){if(S.chest){openChest();renderWorld();renderHud();}},
  defend:function(){defendNow();},
  autodef:function(){var r=resolveThreat();renderAll();if(r&&!r.win)showDefLoss(r);},
  planet:function(v){S.cur=clamp(S.cur+(+v),0,S.worlds.length-1);mapSel=-1;renderWorld();dirty();},
  goDaily:function(){tab="quests";sub.quests="daily";renderAll();},
  dailyChest:function(){dailyChest();rr();renderNav();},
  goEvent:function(){tab="quests";sub.quests="event";renderAll();},
  goTour:function(){tab="social";sub.social="tour";renderAll();},
  recruit:function(v,el){var n=+el.dataset.n||1,done=0;for(var i=0;i<n;i++){var c=recruitCost(v);if(armySize()>=campCap()||S.coins<c)break;S.coins-=c;S.army[v]=(S.army[v]||0)+1;done++;}if(!done)return;if(!S.clv[v])S.clv[v]=1;S.stats.recruits+=done;qprog("recruit",done);hit("h11");snd("deploy");rr();},
  upClass:function(v){var c=clsUpCost(v);if(S.coins<c||(S.clv[v]||1)>=classMaxLv())return;S.coins-=c;S.clv[v]=(S.clv[v]||1)+1;S.stats.upgrades++;qprog("upgrade",1);hit("h11");snd("lvl");rr();},
  expand:function(){var c=campCost();if(S.coins<c||S.campX>=S.lvl)return;S.coins-=c;S.campX++;snd("coin");rr();},
  feed:function(v){if(feed(+v,false)){snd("coin");toast(IC.stamp+" The army is fed: "+FOODS[+v].nm,"good");}else{toast("Not enough food stamps. Buy more below.","bad");snd("bad");}rr();renderNav();},
  stamps:function(v){var n=+v,c=n*STAMP_PRICE;if(S.coins<c)return;S.coins-=c;S.stamps+=n;hit("m4");snd("coin");rr();},
  faOn:function(){S.feedAuto.on=!S.feedAuto.on;rr();},faQ:function(v){S.feedAuto.q=+v;rr();},faBuy:function(){S.feedAuto.buy=!S.feedAuto.buy;rr();},
  capFeed:function(){S.capFeed=!S.capFeed;rr();},
  ransom:function(){if(!S.cap)return;var c=ransomVal();S.coins+=c;S.cap=0;S.capCyc=0;snd("coin");toast(IC.coin+" Ransom paid: +"+fmt(c),"gold");rr();},
  capJoin:function(){var n=Math.min(S.cap,campCap()-armySize());if(n<1||S.capCyc<2)return;S.army.trooper=(S.army.trooper||0)+n;S.cap-=n;if(!S.cap)S.capCyc=0;snd("deploy");toast(IC.army+" "+n+" captives joined as Troopers","good");rr();},
  gearBuy:function(v){var g=S.gear[v],nt=g?g.t+1:1,c=gearCost(nt);if(nt>gearTierMax()||S.alloy<c)return;S.alloy-=c;S.gear[v]={t:nt,l:1};S.stats.upgrades++;qprog("upgrade",1);hit("m7");snd("lvl");rr();},
  gearUp:function(v){var g=S.gear[v];if(!g)return;var c=gearUpCost(g);if(g.l>=gearMaxLv()||S.alloy<c)return;S.alloy-=c;g.l++;S.stats.upgrades++;qprog("upgrade",1);hit("m7");snd("lvl");rr();},
  fortUp:function(){var c=fortCost();if(S.coins<c||S.fort>=2+S.lvl)return;S.coins-=c;S.fort++;S.stats.upgrades++;qprog("upgrade",1);snd("lvl");rr();},
  enchant:function(){if(S.ench>=5)return;if(!spendGems(80*(S.ench+1),"an enchantment"))return;S.ench++;hit("m3");snd("jack");rr();},
  starter:function(){claimStarter();rr();},
  buy:function(v){
    var nm={shield:"a Shield",prot:"Loss Protection",xp:"an XP Surge",skip:"a Level Skip",pups:"a Power-up Crate",general:"the Advanced General",freeze:"a Streak Freeze",pass:"the premium track",repair:"an Instant Repair"}[v];
    if(v==="repair"&&!S.lastDmg)return;
    if(v==="pass"&&S.ev.prem)return;
    if(!spendGems(GP[v],nm))return;
    if(v==="shield"){S.shieldU=Math.max(now(),S.shieldU)+8*3600e3;S.threat=null;hit("m11");}
    else if(v==="prot"){S.lossProt+=3;hit("m11");}
    else if(v==="xp"){addXP(Math.round(xpNeed(S.lvl)*.3));hit("m9");}
    else if(v==="skip"){addXP(xpNeed(S.lvl)-S.xp);hit("m9");}
    else if(v==="pups"){S.pu.strike+=2;S.pu.heal++;S.pu.rage++;S.pu.shield++;hit("m9");}
    else if(v==="general"){S.genU=Math.max(now(),S.genU)+24*3600e3;hit("m10");}
    else if(v==="freeze"){S.streak.freeze++;hit("m11");}
    else if(v==="pass"){S.ev.prem=true;hit("m13");}
    else if(v==="repair"){S.gear[S.lastDmg.s]={t:S.lastDmg.t,l:S.lastDmg.l};S.lastDmg=null;hit("m11");}
    snd("jack");toast(IC.gem+" Purchased: "+nm.replace(/^(a|an|the) /,""),"gold");
    if(pendingLv.length)flowNext();else renderAll();
  },
  claimQ:function(v){claimQuest(+v);if(pendingLv.length)flowNext();else{rr();renderNav();}},
  claimA:function(v){if(S.ach[v]!==1)return;var a=ACH.filter(function(x){return x.id===v;})[0];S.ach[v]=2;S.coins+=a.c;snd("coin");rr();renderNav();},
  passF:function(){if(S.ev.cf>=passTier())return;var g=grant(PASS_F[S.ev.cf]);S.ev.cf++;snd("coin");toast("Event reward: "+g,"gold");rr();renderNav();},
  passP:function(){if(!S.ev.prem||S.ev.cp>=passTier())return;var g=grant(PASS_P[S.ev.cp]);S.ev.cp++;snd("coin");toast("Premium reward: "+g,"gold");rr();renderNav();},
  signin:function(){if(window.LZ)try{LZ.openAccount("signin");}catch(e){}},
  chatFlag:function(v){netChatFlag(v);},chatDel:function(v){netChatDel(v);},
  chat:function(){var i=$("#chatIn");if(!i)return;if(NET.on){if(netChatSend(i.value))i.value="";return;}var t=chatClean(i.value).slice(0,80);if(!t)return;i.value="";chatPush(S.name,t,{me:1,l:S.lvl});hit("h13");if(Math.random()<.7)setTimeout(function(){var b=pick(bots());chatPush(b.nm,pick(CHAT_REPLY),{l:botLvl(b)});},1400+Math.random()*2200);},
  allyJoin:function(v){S.ally=+v;chatPush("",ALLIES[S.ally].nm+" welcomes "+S.name+".",{sys:1});hit("h13");rr();},
  allyLeave:function(){S.ally=-1;rr();},
  campTog:function(){if(S.campCd>0||S.ally<0)return;S.campU=now()+600e3;S.campCd=1200;toast(IC.shield+" Allies are camped with you: +30% defense for 10 minutes","good");rr();},
  spin:function(){spinWheel();},
  skinBuy:function(v){
    if(S.skins.indexOf(v)>=0)return;var s=SKINS[v],ev=evNow().skin;
    if(s){if(s.coins){if(S.coins<s.coins)return;S.coins-=s.coins;}else if(s.gems){if(!spendGems(s.gems,s.nm))return;}else if(S.lvl<s.lvl)return;}
    else if(ev.id===v){if(!spendGems(GP.evskin,ev.nm))return;hit("m12");}else return;
    S.skins.push(v);S.skin=v;hit("h12");snd("jack");rr();
  },
  skinUse:function(v){if(S.skins.indexOf(v)<0)return;S.skin=v;hit("h12");rr();},
  fac:function(v){S.name=cleanName(($("#nameIn")||{}).value||S.name);S.faction=v;hit("h12");dirty();showProfile();renderHud();},
  em:function(v){S.name=cleanName(($("#nameIn")||{}).value||S.name);S.flag.em=+v;hit("h12");dirty();showProfile();renderHud();},
  fc1:function(v){S.name=cleanName(($("#nameIn")||{}).value||S.name);S.flag.c1=v;hit("h12");dirty();showProfile();renderHud();},
  fc2:function(v){S.name=cleanName(($("#nameIn")||{}).value||S.name);S.flag.c2=v;hit("h12");dirty();showProfile();renderHud();},
  saveName:function(){S.name=cleanName($("#nameIn").value);hit("h12");closeModal(true);renderAll();dirty();},
  tabSkins:function(){S.name=cleanName(($("#nameIn")||{}).value||S.name);closeModal(true);tab="store";sub.store="skins";renderAll();},
  facI:function(v,el){introFac=v;$$(".fpick button").forEach(function(b){b.classList.toggle("on",b===el);});},
  begin:function(){
    S.name=cleanName($("#nameIn").value);S.faction=introFac;S.flag.c1=FACTIONS[introFac].c1;S.lastDay=dayStr();streakSync();hit("h12");
    closeModal(true);renderAll();save();flowNext();try{netInit();}catch(e){}
  },
  revive:function(v,el){var c=reviveCost();if(!armySize(S.lastDead||{}))return;if(!spendGems(c,"a revive"))return;var n=doRevive();hit("m11");snd("jack");toast(IC.army+" "+n+" soldiers revived","good");el.remove();renderHud();},
  offerBuy:function(){offerBuy();}
};

/* ================= wiring ================= */
function wire(){
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-b]");if(b){battleBtn(b);return;}
    var a=e.target.closest("[data-a]");if(!a||a.classList.contains("off")||a.disabled)return;
    var f=ACT[a.dataset.a];if(f){if(a.dataset.a!=="hook")snd("tap");f(a.dataset.v,a);}
  });
  $("#bf").addEventListener("pointerdown",function(e){e.preventDefault();battleTap(e);});
  $("#bauto").addEventListener("click",function(){if(!B||B.over)return;B.auto=!B.auto;if(B.auto){B.sel=null;S.stats.autoBattles++;}snd("tap");updateBattleHud();});
  $("#bspd").addEventListener("click",function(){if(!B||B.over)return;B.spd=B.spd===1?2:1;snd("tap");updateBattleHud();});
  window.addEventListener("resize",function(){if(B)bResize();});
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="chatIn")ACT.chat();});
  document.addEventListener("visibilitychange",function(){if(document.hidden)save();});
  window.addEventListener("pagehide",save);
}
function battleTip(){
  var e=$("#btip");if(!e||!B)return;var t="";
  if(S.stats.wins<2&&!B.auto&&!B.over){
    if(B.cfg.mode==="def")t=B.depN?"":"Enemies are marching on your fortress. Tap a squad, then tap near the fortress to deploy.";
    else if(!B.depN)t="Tap anywhere in the bright zone to drop a Trooper squad.";
    else if(B.t<16)t="Keep deploying as Command refills. Destroy the enemy HQ before the clock runs out.";
  }
  if(e.textContent!==t)e.textContent=t;
}
function boot(){
  S=load();document.body.classList.toggle("lens",!!S.lens);wire();
  lzBoot().then(function(){
    S=load();document.body.classList.toggle("lens",!!S.lens);
    if(!S.worlds.length)S.worlds.push(genWorld(0));
    S.quests=S.quests.filter(function(q){return q&&QT[q.k];});while(S.quests.length<3)S.quests.push(newQuest());
    S.cur=clamp(S.cur,0,S.worlds.length-1);evSync();dailySync();if(S.tour.id<0)S.tour={id:tourId(),pts:0};tourSync();
    if(!S.chat.length){chatPush("","Channel open. Rival commanders are online.",{sys:1});for(var i=0;i<4;i++){var b=bots()[i+3];chatPush(b.nm,botLine(b),{l:botLvl(b)});}chatNew=0;}
    if(!S.name){showIntro();}
    else{
      var off=offlineSim();if(dayStr()!==S.lastDay){S.lastDay=dayStr();streakSync();}
      renderAll();if(off)showAway(off);else flowNext();
    }
    save();setInterval(tick,1000);requestAnimationFrame(mapLoop);
    var goNet=function(){try{netInit();}catch(e){console.warn(e);}};if(window.LZ&&LZ.onChange)LZ.onChange(goNet);window.addEventListener("fs-ready",goNet);setInterval(function(){if(!document.hidden){netInit();netPublish();netRivals();netInbox();}},60000);
  });
}
window.__dom={get NET(){return NET;},get S(){return S;},get B(){return B;},ACT:ACT,startBattle:startBattle,attackNode:attackNode,deploy:deploy,tick:tick,save:save};
boot();
</script>
