<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Harbor Rush | Lazer Arcade</title>
<meta name="description" content="Run the crane at a busy port. Swing containers off the ship, dig out what each truck wants and land every box dead center."><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.png"><script>window.LZ_GAME="harbor";</script><script type="module" src="/arcade/lz.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1626;--ink2:#14243b;--ink3:#1d3352;--hz:#ffc400;--hz2:#e0a800;--wh:#f4f7fb;--mut:#8ea3bf;--good:#3ddc84;--bad:#ff5a4f;--blue:#38a8ff;--disp:'Bungee','Impact','Arial Black',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--wh);font-family:var(--body);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
/* hazard stripes */
.stripe{background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#111 14px 28px)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{background:rgba(11,22,38,.82);border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:6px 11px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#hLvl{display:flex;flex-direction:column;min-width:0}
#hLvl b{font:15px var(--disp);letter-spacing:.5px;color:var(--hz);white-space:nowrap}
#hLvl small{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap}
#hTrucks{display:flex;gap:3px;align-items:center;flex-wrap:wrap;max-width:46vw}
@media (max-width:520px){#hTrucks{max-width:30vw}#hTrucks i{width:9px;height:9px}#hLvl b{font-size:14px}}
#hTrucks i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.18);display:block}
#hTrucks i.ok{background:var(--good)}#hTrucks i.miss{background:var(--bad)}
#hScore{margin-left:auto;text-align:right}
#hScore b{font:20px var(--disp);display:block;line-height:1.05}
#hScore small{font-size:11px;font-weight:800;color:var(--hz)}
#hHearts{font-size:16px;letter-spacing:1px;white-space:nowrap}
#hPause{pointer-events:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:16px var(--disp)}
/* controls */
#ctl{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:flex-end;gap:12px;z-index:5;pointer-events:none}
.cb{pointer-events:auto;width:76px;height:76px;border-radius:22px;background:rgba(11,22,38,.85);border:2px solid rgba(255,255,255,.12);box-shadow:0 5px 0 rgba(0,0,0,.35);display:grid;place-items:center;font:28px var(--disp);color:var(--wh)}
.cb.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);background:var(--ink3)}
#bAct{margin-left:auto;width:118px;height:92px;border-radius:26px;background:var(--hz);color:var(--ink);border-color:#fff3;box-shadow:0 6px 0 #a87d00;font-size:22px}
#bAct.drop{background:#3ddc84;box-shadow:0 6px 0 #1c8a4d}
#bAct.busy{opacity:.55}
#bAct.on{transform:translateY(4px);box-shadow:0 2px 0 #a87d00}
#keys{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(11,22,38,.7);padding:7px 12px;border-radius:999px;z-index:5;pointer-events:none;white-space:nowrap}
#keys kbd{font:11px var(--disp);background:rgba(255,255,255,.14);padding:2px 6px;border-radius:6px;margin:0 2px}
/* toast / callout */
#call{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center}
#call div{font:clamp(18px,4.6vw,30px) var(--disp);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);animation:cin .25s ease-out}
#call small{display:block;font:700 13px var(--body);color:var(--hz);text-shadow:0 2px 0 rgba(0,0,0,.5)}
@keyframes cin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#tip{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:6;pointer-events:none;background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:10px 14px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.25);max-width:88vw;text-align:center}
#tip:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
body.desk #tip{bottom:60px}
@media (pointer:coarse){#tip{bottom:auto;top:calc(env(safe-area-inset-top) + 70px)}#tip:after{display:none}#call{top:auto;bottom:150px}}
/* screens */
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px);background:radial-gradient(120% 80% at 50% 0%,#1d3a63 0%,var(--ink) 70%)}
.scr.glass{background:rgba(7,14,26,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);justify-content:center}
.scr>*{flex:none}
.card{width:100%;max-width:440px;background:var(--ink2);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.3);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font:26px var(--disp);margin:0 0 4px;line-height:1.05}
.card p{margin:6px 0;color:#c7d4e6;font-size:14px;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font:17px var(--disp);background:var(--hz);color:var(--ink);box-shadow:0 5px 0 #a87d00;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a87d00}
.btn.sec{background:var(--ink3);color:var(--wh);box-shadow:0 5px 0 #0a1424}
.btn.sec:active{box-shadow:0 2px 0 #0a1424}
.btn.grn{background:var(--good);box-shadow:0 5px 0 #1c8a4d}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1}
/* title */
#title{justify-content:center;gap:14px;overflow:hidden}
.logo{text-align:center;position:relative}
.logo .k{font:800 12px var(--body);letter-spacing:4px;color:var(--mut)}
.logo h1{margin:4px 0 0;font:clamp(46px,14vw,92px)/.92 var(--disp);color:#fff;text-shadow:0 6px 0 #091222}
.logo h1 span{color:var(--hz);display:block}
.logo .st{height:14px;width:min(360px,80vw);margin:14px auto 0;border-radius:4px}
#title .card{max-width:380px;text-align:center;background:rgba(20,36,59,.85)}
#tEA{font-size:13px;font-weight:700;color:var(--hz);margin-top:10px}
#tLz{font-size:12px;color:var(--mut);margin-top:8px}
.crane-art{width:min(300px,70vw);height:auto;display:block;margin:0 auto -6px}
/* map */
#map h1{font:28px var(--disp);margin:6px 0 2px;text-align:center}
.top{width:100%;max-width:560px;display:flex;align-items:center;gap:10px}
.top .sp{flex:1}
.coins{font:16px var(--disp);color:var(--hz);background:var(--ink2);padding:8px 12px;border-radius:12px}
.port{width:100%;max-width:560px;border-radius:22px;margin-top:14px;padding:16px;position:relative;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.port h3{margin:0;font:21px var(--disp);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.port .tg{font-size:13px;font-weight:700;opacity:.92;margin:2px 0 12px;max-width:80%}
.port .stc{position:absolute;right:14px;top:14px;font:15px var(--disp);background:rgba(0,0,0,.28);padding:5px 10px;border-radius:10px}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:16px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:20px var(--disp);color:#fff;position:relative}
.lv small{font:11px var(--body);font-weight:800;letter-spacing:-1px;color:var(--hz);height:13px}
.lv.next{background:var(--hz);color:var(--ink);border-color:#fff;animation:bob 1.4s ease-in-out infinite}
.lv.next small{color:var(--ink)}
.lv[disabled]{opacity:.4}
@keyframes bob{50%{transform:translateY(-3px)}}
.lock{position:absolute;inset:0;background:rgba(7,14,26,.62);display:flex;align-items:center;justify-content:center;font:16px var(--disp);text-align:center;padding:10px}
.mode{width:100%;max-width:560px;margin-top:14px;display:flex;gap:10px}
.mode .btn{flex:1;min-height:58px}
/* workshop */
.up{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.up:first-of-type{border-top:0}
.up .ic{width:46px;height:46px;border-radius:14px;background:var(--ink3);display:grid;place-items:center;font-size:22px;flex:none}
.up .tx{flex:1;min-width:0}.up b{display:block;font-size:15px}.up small{color:var(--mut);font-size:12.5px}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}.pips i.on{background:var(--hz)}
.up .btn{min-height:42px;padding:0 12px;font-size:14px}
/* results */
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.stars svg{width:54px;height:54px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.stars svg.in{transform:scale(1)}.stars svg:nth-child(2){width:66px;height:66px;margin-top:-10px}
.big{font:40px var(--disp);text-align:center;margin:4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px;background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px;margin-top:10px}
.kv span:nth-child(even){text-align:right;font-weight:800}
.kv .t{font-weight:800;border-top:1px dashed rgba(255,255,255,.18);padding-top:6px}
.pos{color:var(--good)}.neg{color:var(--bad)}.gold{color:var(--hz)}
.nb{display:inline-block;background:var(--hz);color:var(--ink);font:12px var(--disp);padding:3px 8px;border-radius:8px;margin-top:4px}
.goal{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.goal div{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.2);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700}
.goal i{font-style:normal;font-size:20px;width:26px;text-align:center}
.tgl{font:13px var(--body);font-weight:800;color:var(--mut);text-decoration:underline;margin-top:12px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div class="pill" id="hLvl"><b id="hName">1-1</b><small id="hTime">0:00</small></div>
  <div class="pill" id="hTrucks"></div>
  <div class="pill" id="hScore"><b id="hPts">0</b><small id="hCombo"></small></div>
  <div class="pill" id="hHearts"></div>
  <button class="pill" id="hPause" aria-label="Pause">II</button>
</div>
<div id="ctl" class="hide">
  <button class="cb" id="bL" aria-label="Move left">◀</button>
  <button class="cb" id="bR" aria-label="Move right">▶</button>
  <button class="cb" id="bAct">GRAB</button>
</div>
<div id="keys" class="hide"><kbd>←</kbd><kbd>→</kbd> move · <kbd>SPACE</kbd> grab / drop · or drag and click</div>
<div id="call"></div>
<div id="tip" class="hide"></div>
<div id="scr"></div>
<script>
(function(){
'use strict';
/* ================= UTIL ================= */
var $=function(s){return document.querySelector(s);};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return Math.round(n).toLocaleString();}
function mmss(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function easeOut(t){return 1-Math.pow(1-t,3);}

/* ================= AUDIO (all synthesized) ================= */
var AC=null,master=null,hum=null;
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=G&&G.mute?0:.55;master.connect(AC.destination);}catch(e){AC=null;}return AC;}
function setMute(m){G.mute=m;if(master)master.gain.value=m?0:.55;save();}
function tone(f,d,type,vol,delay,f2){var a=AC;if(!a||G.mute)return;var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
var NB=null;function noise(d,vol,freq,delay,q){var a=AC;if(!a||G.mute)return;if(!NB){var n=a.sampleRate*2;NB=a.createBuffer(1,n,a.sampleRate);var c=NB.getChannelData(0);for(var i=0;i<n;i++)c[i]=Math.random()*2-1;}
  var t=a.currentTime+(delay||0),s=a.createBufferSource();s.buffer=NB;var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||800;f.Q.value=q||.9;var g=a.createGain();g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);}
var SFX={
  grab:function(){noise(.07,.35,2400,0,3);tone(260,.07,'square',.04);},
  clunk:function(){noise(.16,.55,380);tone(95,.16,'triangle',.12);},
  perfect:function(){noise(.12,.4,420);tone(880,.07,'triangle',.07);tone(1320,.13,'triangle',.06,.06);},
  bump:function(){noise(.28,.7,240);tone(70,.25,'sawtooth',.09);},
  clang:function(){tone(523,.45,'square',.035);tone(587,.45,'square',.03);noise(.15,.4,2600,0,4);},
  horn:function(){tone(196,.45,'sawtooth',.045);tone(247,.45,'sawtooth',.035);},
  beep:function(){tone(1000,.09,'square',.03);tone(1000,.09,'square',.03,.25);},
  deliver:function(){tone(660,.08,'triangle',.08);tone(990,.09,'triangle',.08,.08);tone(1320,.16,'triangle',.07,.16);},
  bad:function(){tone(220,.22,'square',.06);tone(150,.32,'square',.06,.16);},
  nope:function(){tone(180,.1,'square',.04);},
  star:function(i){tone(660+i*240,.3,'triangle',.09);tone(1320+i*240,.2,'sine',.04,.05);},
  ship:function(){tone(98,1.2,'sawtooth',.05);tone(131,1.2,'sawtooth',.035);},
  coin:function(){tone(1568,.06,'square',.035);tone(2093,.12,'square',.035,.05);},
  gust:function(){noise(1.6,.22,450,0,.6);},
  splash:function(){noise(.6,.45,700,0,.5);},
  puff:function(){noise(.5,.4,900,0,.7);tone(300,.4,'sawtooth',.03,0,90);},
  ui:function(){tone(740,.05,'triangle',.06);},
  win:function(){[523,659,784,1046].forEach(function(f,i){tone(f,.22,'triangle',.08,i*.1);});}
};
function humSet(sp,hoist){var a=AC;if(!a)return;if(!hum){var o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';o2.type='square';o.frequency.value=55;o2.frequency.value=82;f.type='lowpass';f.frequency.value=380;g.gain.value=0;o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start();o2.start();hum={o:o,o2:o2,g:g};}
  var v=G.mute?0:Math.min(.045,sp*.011+(hoist?.02:0));hum.o.frequency.setTargetAtTime(45+sp*22+(hoist?30:0),a.currentTime,.06);hum.o2.frequency.setTargetAtTime(70+sp*30,a.currentTime,.06);hum.g.gain.setTargetAtTime(v,a.currentTime,.06);}

/* ================= DATA ================= */
var CW=.96,CH=.5;   // container width / height in world units
var TYPES={
  red:{c:'#e5483b',d:'#a42a20',sh:'tri',n:'red'},
  blue:{c:'#2f8ff0',d:'#1a5ea8',sh:'circ',n:'blue'},
  green:{c:'#2fbf6a',d:'#1a7f44',sh:'sq',n:'green'},
  yellow:{c:'#ffc61a',d:'#b88a00',sh:'dia',n:'yellow'},
  purple:{c:'#8a5cf0',d:'#5a36ad',sh:'star',n:'purple'},
  orange:{c:'#ff8a2a',d:'#b85a10',sh:'cross',n:'orange'},
  reef:{c:'#eef4f8',d:'#93a9ba',sh:'snow',n:'reefer',reefer:1},
  haz:{c:'#ffd23a',d:'#1e1e1e',sh:'haz',n:'hazmat',hazmat:1}
};
var COLOR_ORDER=['red','blue','green','yellow','purple','orange'];
/* c ship columns · h max stack · f fill · y yard columns · l truck lanes · n trucks · p patience (s) · k colors · par (s)
   r reefer share · pw powered yard slots · z hazmat share · w wind strength */
var PORTS=[
  {id:'old',name:'Old Harbor',tag:'Learn the crane. Dig out what each truck wants.',need:0,
   th:{sky:['#7fc8ff','#dff3ff'],sea:['#2a8fd0','#0f4f85'],quay:'#cfc7b8',quay2:'#a99f8d',crane:'#ffb21a',hull:'#d8402f',city:'#9cc6e6'},rules:[],
   lv:[{c:3,h:3,f:.6,y:2,l:1,n:3,p:75,k:3,par:70,tut:1},{c:4,h:3,f:.62,y:2,l:1,n:5,p:60,k:3,par:95},{c:4,h:4,f:.6,y:3,l:1,n:6,p:55,k:4,par:115},
       {c:5,h:4,f:.62,y:3,l:2,n:8,p:55,k:4,par:140},{c:6,h:4,f:.64,y:3,l:2,n:10,p:50,k:5,par:170},{c:6,h:5,f:.6,y:4,l:2,n:12,p:48,k:5,par:200}]},
  {id:'gale',name:'Gale Point',tag:'Gusts shove the load sideways. Watch the windsock.',need:12,
   th:{sky:['#93aec6','#e6eef5'],sea:['#3d7da6','#173f61'],quay:'#bdbbb3',quay2:'#93918a',crane:'#ee5a2f',hull:'#2d5f8f',city:'#a9bccd'},rules:['wind'],
   lv:[{c:4,h:4,f:.6,y:3,l:1,n:6,p:60,k:4,par:120,w:1},{c:5,h:4,f:.62,y:3,l:2,n:8,p:55,k:4,par:145,w:1.2},{c:5,h:4,f:.65,y:3,l:2,n:9,p:52,k:5,par:160,w:1.4},
       {c:6,h:4,f:.64,y:3,l:2,n:10,p:50,k:5,par:175,w:1.6},{c:6,h:5,f:.6,y:4,l:2,n:11,p:48,k:5,par:190,w:1.8},{c:7,h:5,f:.62,y:4,l:2,n:13,p:46,k:6,par:215,w:2}]},
  {id:'frost',name:'Frost Bay',tag:'Reefers start thawing once they leave the ship. Plug them in or ship them fast.',need:26,

function bottomY(){return hookY()-.06-(CR.carry?CH:0);}

    if(hit){clang(hx,by,hit);return;}}

  if(by>top)return;

  if(!s){bounce(surfaceAt(hx)<0?'That\'s the sea!':'Nothing there','Line up over a stack');return;}
  var off=hx-s.x;

  else if(kind==='perf'){LV.combo++;LV.perf++;var pp=Math.round(60*comboMult());LV.stats.perfPts+=pp;addScore(pp,s.x,topY(s)+.4,'perf','PERFECT');SFX.perfect();burst(s.x,topY(s)-CH+.05,10,'#fff3c4',.9);}
  else{LV.combo=0;LV.bumps++;LV.stats.pen+=20;addScore(-20,s.x,topY(s)+.4,'bad','BUMP');SFX.bump();SHAKE=Math.max(SHAKE,.12);dust(s.x,topY(s)-CH);
    if(LV.rules.hazmat&&(TYPES[b2.t].hazmat||(s.stack.length>1&&TYPES[s.stack[s.stack.length-2].t].hazmat))){smoke(s.x,topY(s));LV.stats.pen+=100;addScore(-100,s.x,topY(s)+.9,'bad','HAZMAT');callout('Careful with hazmat!','A clang costs a heart');SFX.bad();}}

    LV.L.slots.forEach(function(s){if(s.kind==='lane')return;for(var i=s.stack.length-1;i>=0;i--){var b=s.stack[i];if(b.dead){s.stack.splice(i,1);smoke(s.x,baseY(s)+i*CH+CH/2,'#c9d2d8');spoiled();}}});

function endlessParams(){var mx=0;for(var pi=0;pi<PORTS.length;pi++)if(portOpen(pi))mx=pi;var w=mx>=1?.9:0,r=mx>=2?.22:0,z=mx>=3?.15:0;

function updEndless(dt){
  if(!LV.endless)return;
  var ships=LV.L.slots.filter(function(s){return s.kind==='ship';}),n=0;ships.forEach(function(s){n+=s.stack.length;});
  if(LV.shipT>0){LV.shipT-=dt;if(LV.shipT<=0){fillShip(Math.random);LV.ships++;callout('New ship docked','Ship '+LV.ships);SFX.ship();}}

/* ---------- step ---------- */
function update(dt){
  if(!LV||LV.phase!=='play')return;
  LV.t+=dt;if(LV.endT>0){LV.endT-=dt;if(LV.endT<=0){endLevel(true);return;}}
  // every truck has been dealt with (loaded or left): wrap up, even if the last one drove off empty
  if(!LV.endless&&!(LV.endT>0)&&LV.spawned>=LV.p.n&&LV.served+LV.missed>=LV.p.n&&!LV.trucks.some(function(t){return t.state!=='out';}))LV.endT=.9;

}

    r.newBest=r.total>(G.best[key]||0)&&win;if(r.newBest)G.best[key]=r.total;
    r.coins=Math.floor(r.total/120)+r.newStars*15;}
  G.coins+=r.coins;G.total=(G.total||0)+r.total;r.stats=LV.stats;r.perf=LV.perf;r.served=LV.served;r.missed=LV.missed;r.bumps=LV.bumps;r.clangs=LV.clangs;r.lp=Math.round(r.total*LZR*LZM);r.ea=!!window.LZ_EA;
  save();lastRes=r;
  if(window.LZ_GAME&&window.LZ&&r.total>0)try{LZ.endSession(LZ_GAME,r.total,{level:LV.endless?'rush':key,stars:r.stars||0});}catch(e){}
  if(win){SFX.win();for(var i=0;i<4;i++)setTimeout(function(){if(LV)confetti(rnd(LV.L.minX+2,LV.L.maxX-2),3,18);},i*180);}
  setTimeout(function(){showResults(r);},win?1100:900);
}
function showResults(r){
  PAUSED=true;gameUI(false);var h='<div class="card" style="text-align:center">',P=function(n){return fmt(n);};
  if(r.endless)h+='<h2>Rush Hour over</h2><div class="big gold">'+P(r.total)+'</div>'+(r.newBest?'<span class="nb">NEW BEST</span>':'<p>Best '+P(G.endless)+'</p>');
  else{h+='<h2>'+(r.win?'Level clear!':'Out of hearts')+'</h2><div class="stars" style="color:var(--hz)">'+STAR_SVG+STAR_SVG+STAR_SVG+'</div><div class="big">'+P(r.total)+'</div>'+(r.newBest?'<span class="nb">NEW BEST</span>':'');}
  h+='<div class="kv" style="text-align:left"><span>Trucks loaded</span><span>'+r.served+(r.missed?' <span class="neg">('+r.missed+' left)</span>':'')+'</span><span>Delivery points</span><span class="pos">+'+P(r.stats.deliverPts)+'</span><span>Perfect drops ('+r.perf+')</span><span class="pos">+'+P(r.stats.perfPts)+'</span>';
  if(r.stats.pen)h+='<span>Bumps & clangs</span><span class="neg">-'+P(r.stats.pen)+'</span>';
  if(!r.endless&&r.win)h+='<span>Time bonus ('+mmss(r.t)+')</span><span class="pos">+'+P(r.timeB)+'</span><span>Hearts bonus</span><span class="pos">+'+P(r.heartB)+'</span>';
  h+='<span class="t">Score</span><span class="t">'+P(r.total)+'</span><span>Coins</span><span class="gold">+'+P(r.coins)+' ⛁</span>';
  if(window.LZ_GAME)h+='<span>Lazer Points'+(r.ea?' (held, paid 1.5× at launch)':LZM>1?' ('+LZM+'× today)':'')+'</span><span class="pos">+'+P(r.ea?Math.round(r.lp*1.5):r.lp)+' LP</span>';
  h+='</div>';
  var nx=!r.endless&&r.win&&LV&&LV.li<5?[LV.pi,LV.li+1]:!r.endless&&r.win&&LV&&portOpen(LV.pi+1)?[LV.pi+1,0]:null;
  h+='<div class="row"><button class="btn sec" data-a="map">Ports</button><button class="btn sec" data-a="retry">Retry</button>'+(nx?'<button class="btn" data-a="lv" data-p="'+nx[0]+'" data-l="'+nx[1]+'">Next</button>':'')+'</div></div>';
  show(h,'glass','res');
  if(!r.endless)$('#scr .stars').querySelectorAll('svg').forEach(function(s,i){if(i<r.stars)setTimeout(function(){s.classList.add('in');SFX.star(i);},250+i*300);else{s.style.color='rgba(255,255,255,.15)';setTimeout(function(){s.classList.add('in');},250+i*300);}});
}

/* ---------- HUD ---------- */
var hudC={};
function setT(id,v){if(hudC[id]!==v){hudC[id]=v;$('#'+id).textContent=v;}}
function hud(){
  if(!LV)return;
  setT('hName',LV.endless?'RUSH HOUR':(LV.pi+1)+'-'+(LV.li+1)+(CWpx>520?' '+LV.P.name.toUpperCase():''));
  setT('hTime',LV.endless?mmss(LV.t)+' · ship '+LV.ships:mmss(LV.t)+' / par '+mmss(LV.p.par));
  setT('hPts',fmt(LV.score));setT('hCombo',LV.combo>=2?'×'+comboMult().toFixed(1)+' COMBO':'');
  var hh='';for(var i=0;i<3;i++)hh+=i<LV.hearts?'❤️':'🖤';setT('hHearts',hh);
  var tk=LV.endless?'s'+LV.served:LV.served+'/'+LV.missed+'/'+LV.p.n;
  if(hudC.tk!==tk){hudC.tk=tk;var e=$('#hTrucks');if(LV.endless)e.innerHTML='<b style="font:15px var(--disp)">🚚 '+LV.served+'</b>';else{var s='';for(var j=0;j<LV.p.n;j++)s+='<i class="'+(j<LV.served?'ok':j<LV.served+LV.missed?'miss':'')+'"></i>';e.innerHTML=s;}}
  var ab=$('#bAct'),lab=CR.carry?'DROP':'GRAB';if(hudC.ab!==lab){hudC.ab=lab;ab.textContent=lab;ab.classList.toggle('drop',!!CR.carry);}
  var busy=CR.state!=='idle'||CR.stun>0;if(hudC.busy!==busy){hudC.busy=busy;ab.classList.toggle('busy',busy);}
  tutTick();
}

/* ---------- tutorial (level 1-1) ---------- */
var tutTarget=null;
function tip(t){var e=$('#tip');if(!t){e.classList.add('hide');return;}if(e.textContent!==t)e.textContent=t;e.classList.remove('hide');}
function tutTick(){
  tutTarget=null;if(!LV||LV.tutStep<0||LV.phase!=='play'){if(LV&&LV.tutStep<0)tip(null);return;}
  var t=LV.trucks.filter(function(x){return x.state==='wait';})[0];
  if(!t){tip(LV.tutStep>=3?null:'A truck is pulling in…');return;}
  if(LV.tutStep===0||LV.tutStep===1){var s=null;LV.L.slots.forEach(function(sl){if(!s&&sl.kind!=='lane'&&sl.stack.length&&sl.stack[sl.stack.length-1].t===t.want)s=sl;});
    if(CR.carry){LV.tutStep=2;return;}
    if(!s){tip('Dig! Move the boxes on top to the yard first.');return;}tutTarget=s;
    var over=Math.abs(hookX()-s.x)<tolGrab();
    tip(over?(TOUCH?'Now tap GRAB':'Now press SPACE (or click) to grab'):(TOUCH?'Hold ◀ ▶ (or drag) to move over the '+TYPES[t.want].n+' container':'Use ← → (or drag) to move over the '+TYPES[t.want].n+' container'));return;}
  if(LV.tutStep===2){tutTarget=t.lane;tip(CR.carry?'Swing it over the truck. Drop when the guide turns green':'Grab the container the truck wants');return;}
  if(LV.tutStep===3){tip('Buried? Move the boxes on top to the yard first.');}
}
function tut(ev){if(!LV||LV.tutStep<0)return;if(ev==='grab'&&LV.tutStep<2)LV.tutStep=2;else if(ev==='drop'&&LV.tutStep===2&&LV.served>=1){LV.tutStep=3;setTimeout(function(){if(LV&&LV.tutStep===3){LV.tutStep=-1;tip(null);G.tut=1;save();}},9000);}}
function drawTut(){if(!tutTarget)return;var s=tutTarget,S=VIEW.S,y=s.kind==='lane'?LANE_Y+CH:topY(s),p=.5+.5*Math.sin(TIME*6);
  cx.strokeStyle='rgba(255,255,255,'+(.5+.5*p)+')';cx.lineWidth=3;rr(SX(s.x)-CW*S/2-4,SY(y)-4,CW*S+8,CH*S*(s.kind==='lane'?1:1)+8,6);cx.stroke();
  cx.fillStyle='#fff';cx.font=Math.round(S*.5)+'px Bungee,sans-serif';cx.textAlign='center';cx.fillText('▼',SX(s.x),SY(y+CH+.35+p*.15));}

/* ---------- input ---------- */
var keys={};
function dirFromKeys(){return (keys.r?1:0)-(keys.l?1:0);}
window.addEventListener('keydown',function(e){var k=e.key;
  if(k==='Escape'||k==='p'||k==='P'){if(SCREEN==='pause'){hideScr();PAUSED=false;}else if(LV&&LV.phase==='play'&&!SCREEN)showPause();return;}
  if(!LV||PAUSED)return;
  if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=1;INP.dir=dirFromKeys();e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=1;INP.dir=dirFromKeys();e.preventDefault();}
  else if((k===' '||k==='Enter'||k==='ArrowDown'||k==='s'||k==='S')&&!e.repeat){action();e.preventDefault();}});
window.addEventListener('keyup',function(e){var k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=0;if(k==='ArrowRight'||k==='d'||k==='D')keys.r=0;INP.dir=dirFromKeys();});
function holdBtn(el,d){var on=function(e){e.preventDefault();audio();INP.dir=d;el.classList.add('on');},off=function(){if(INP.dir===d)INP.dir=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(function(ev){el.addEventListener(ev,off);});}
holdBtn($('#bL'),-1);holdBtn($('#bR'),1);
$('#bAct').addEventListener('pointerdown',function(e){e.preventDefault();var b=e.currentTarget;b.classList.add('on');setTimeout(function(){b.classList.remove('on');},120);action();});
var PD=null;
cv.addEventListener('pointerdown',function(e){audio();if(!LV||PAUSED)return;PD={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),drag:false,cx:CR.x};});
cv.addEventListener('pointermove',function(e){if(!PD||e.pointerId!==PD.id)return;if(!PD.drag&&Math.hypot(e.clientX-PD.x,e.clientY-PD.y)>12)PD.drag=true;if(PD.drag)INP.drag=PD.cx+(e.clientX-PD.x)/VIEW.S;});
function pEnd(e){if(!PD||e.pointerId!==PD.id)return;if(!PD.drag&&performance.now()-PD.t<400)action();PD=null;INP.drag=null;}
cv.addEventListener('pointerup',pEnd);cv.addEventListener('pointercancel',function(){PD=null;INP.drag=null;});
$('#hPause').addEventListener('click',function(){showPause();});
document.addEventListener('visibilitychange',function(){if(document.hidden){save();if(LV&&LV.phase==='play'&&!SCREEN)showPause();}});
window.addEventListener('pagehide',save);
window.addEventListener('resize',function(){resize();setTimeout(resize,250);});

$('#scr').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;audio();SFX.ui();var a=b.dataset.a,p=b.dataset.p,l=b.dataset.l;
  if(a==='play'){if(!starsTotal())showIntro(0,0);else showMap();}
  else if(a==='title')showTitle();
  else if(a==='map')showMap();
  else if(a==='shop')showShop();
  else if(a==='lv')showIntro(+p,+l);
  else if(a==='go')startGame(+p,+l,false);
  else if(a==='endless')startGame(0,0,true);
  else if(a==='resume'){hideScr();PAUSED=false;}
  else if(a==='retry'){if(LV)startGame(LV.pi,LV.li,LV.endless);else showMap();}
  else if(a==='mute'){setMute(!G.mute);b.textContent='Sound: '+(G.mute?'off':'on');}
  else if(a==='buy'){var c=UPG_COST[U(p)];if(G.coins>=c&&U(p)<5){G.coins-=c;G.up[p]=U(p)+1;save();SFX.coin();showShop();}}
});

/* ================= LOOP ================= */
var last=performance.now();
function frame(ts){requestAnimationFrame(frame);var dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;
  if(LV&&!PAUSED)update(dt);render(dt);if(LV&&!PAUSED)hud();}
function init(){
  var s=load();G=s||freshG();
  resize();
  // menu backdrop: a quiet demo level behind the title
  showTitle();
  requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
}
var fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1500);})]):Promise.resolve();
Promise.all([fontsReady,lzBoot()]).then(init,init);

})();
</script>
