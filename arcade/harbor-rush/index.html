<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Rush | Coming soon to Lazer Arcade</title>
<meta name="description" content="Harbor Rush launches on Lazer Arcade November 12.">
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1626;--hz:#ffc400}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#1d3a63 0%,var(--ink) 70%);color:#f4f7fb;font-family:Inter,system-ui,sans-serif;padding:24px 16px;text-align:center}
.k{font:800 12px Inter,sans-serif;letter-spacing:4px;color:#8ea3bf}
h1{margin:6px 0 0;font:clamp(44px,13vw,88px)/.92 Bungee,Impact,sans-serif}
h1 span{color:var(--hz);display:block}
.st{height:14px;width:min(360px,80vw);margin:16px auto;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#111 14px 28px)}
.cd{display:flex;gap:10px;justify-content:center;margin:18px 0}
.cd div{background:#14243b;border:2px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 10px;min-width:70px}
.cd b{display:block;font:30px Bungee,Impact,sans-serif}.cd small{font-size:11px;color:#8ea3bf;font-weight:800;letter-spacing:1px}
p{color:#c7d4e6;max-width:420px;margin:8px auto;line-height:1.5}
a.btn{display:inline-block;margin-top:14px;background:var(--hz);color:var(--ink);font:17px Bungee,Impact,sans-serif;padding:14px 22px;border-radius:16px;text-decoration:none;box-shadow:0 5px 0 #a87d00}
</style>
</head>
<body>
<main>
  <div class="k">LAZER ARCADE</div>
  <h1>HARBOR<span>RUSH</span></h1>
  <div class="st"></div>
  <p>Swing a real crane over a stacked ship and dig out what every truck wants. Launching November 12.</p>
  <div class="cd" id="cd"></div>
  <a class="btn" href="/arcade/">Back to Lazer Arcade</a>
</main>
<script>
var L=new Date('2026-11-12T12:00:00-05:00').getTime();
function t(){var d=Math.max(0,L-Date.now()),u=[['DAYS',864e5],['HRS',36e5],['MIN',6e4],['SEC',1e3]],h='';
  u.forEach(function(x){var n=Math.floor(d/x[1]);d-=n*x[1];h+='<div><b>'+n+'</b><small>'+x[0]+'</small></div>';});
  document.getElementById('cd').innerHTML=h;}
t();setInterval(t,1000);
</script>
</body>
</html>
